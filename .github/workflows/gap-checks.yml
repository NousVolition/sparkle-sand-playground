name: Gap experiment checks
on:
  push:
    paths: ['zeros-gap*', 'staircase-*', 'tests/**', 'index.html', '.github/workflows/gap-checks.yml']
  pull_request:
    paths: ['zeros-gap*', 'staircase-*', 'tests/**', 'index.html', '.github/workflows/gap-checks.yml']
jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/staircase-space.cjs
      - run: node tests/staircase-shortcut.cjs
      - run: node tests/zeros-gap.cjs
      - run: node tests/zeros-gap-crossing.cjs
      - run: node --check zeros-gap-ui.js && node --check staircase-shortcut.js && node --check zeros-gap-crossing.js
