    box.appendChild(s);
  });
  const btn = document.getElementById('shiftBtn');
  const paint = () => {
    const on = !!colorState[tab].shift;
    btn.textContent = 'Shift: ' + (on ? 'On' : 'Off');
    btn.classList.toggle('active', on);
  };
  btn.onclick = () => { setTabShift(tab, !colorState[tab].shift); paint(); };
  paint();
  markColorSwatches();
}

function markColorSwatches() {
  const cur = colorState[mode] && colorState[mode].set || 'classic';
  document.querySelectorAll('#colorSets .swatch').forEach(el => el.classList.toggle('active', el.dataset.set === cur));
}

// Draw grains split into groups, one color per group (used when a color set is active)
function drawGrainsTab(list, tab, sz, glow) {
  const n = tabColorList(tab).length;
  for (let g = 0; g < n; g++) {
    let c = tabRGB(tab, g / n);
    if (glow) c = lighten(c, glow);
    ctx.fillStyle = rgbStr(c);
    for (let i = g; i < list.length; i += n) {
      const p = list[i];
      ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
  }
  // a few bright sparkles
  ctx.fillStyle = rgbStr(lighten(tabRGB(tab, 0), 0.75));
  for (let i = 0; i < list.length; i += 11) {
    const p = list[i];
    ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
}

// ---------- "Follow my work": a never-ending write / freeze cycle ----------
// 24 ticks per cycle. Ticks 1-22 write (bright colors flow). Tick 23 is the freeze:
// motion holds, the overlapping part turns gold (the user's bucket) and the rest turns
// deep blue and drifts left (the never-ending bucket). Tick 24 filters through soft white.
const FOLLOW_TICKS = 24, FOLLOW_MS = 400, FOLLOW_FREEZE = 23;
const FOLLOW_WRITE = ['#22d3ee', '#f472b6', '#a3e635', '#fde047', '#c084fc'];
const FOLLOW_GOLD = [251, 191, 36], FOLLOW_BLUE = [76, 58, 210], FOLLOW_WHITE = [241, 245, 249];
const FOLLOW_DRIFT = 60;

function isFollow(tab) { return colorState[tab] && colorState[tab].set === 'follow'; }
function followTick() {
  const t = Date.now() / FOLLOW_MS, n = Math.floor(t);
  return { tick: n % FOLLOW_TICKS + 1, frac: t - n };
}
function followHolding(tab) { return isFollow(tab) && followTick().tick === FOLLOW_FREEZE; }
function mixRGB(a, b, k) { return [a[0] + (b[0] - a[0]) * k | 0, a[1] + (b[1] - a[1]) * k | 0, a[2] + (b[2] - a[2]) * k | 0]; }
function easeIO(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

// Final color and left drift for one element, given its write color and whether it overlaps
function followStyle(base, overlap, ft) {
  const { tick, frac } = ft || followTick();
  if (tick < FOLLOW_FREEZE) return { c: base, dx: 0 };
  const target = overlap ? FOLLOW_GOLD : FOLLOW_BLUE;
  if (tick === FOLLOW_FREEZE) {
    const e = easeIO(frac * 2.5);
    return { c: mixRGB(base, target, e), dx: overlap ? 0 : -FOLLOW_DRIFT * easeIO(frac * 1.6) };
  }
  // filtered: fade through soft white, then back to the write colors
  const c = frac < 0.5 ? mixRGB(target, FOLLOW_WHITE, easeIO(frac * 2)) : mixRGB(FOLLOW_WHITE, base, easeIO(frac * 2 - 1));
  return { c, dx: overlap ? 0 : -FOLLOW_DRIFT * (1 - easeIO(frac)) };
}
function followSplitting(tab) { return isFollow(tab) && followTick().tick >= FOLLOW_FREEZE; }

function updateTickLabel() {
  const el = document.getElementById('tickLabel');
  if (!el) return;
  if (!isFollow(mode)) { if (el.textContent) { el.textContent = ''; el.classList.remove('freeze'); } return; }
  const { tick } = followTick();
  const txt = tick === FOLLOW_FREEZE ? `tick ${tick} · freeze` : `tick ${tick}`;
  if (el.textContent !== txt) {
    el.textContent = txt;
    el.classList.toggle('freeze', tick === FOLLOW_FREEZE);
  }
}

// Grains for plate / waves while splitting: near the still lines = overlap (gold)
function drawGrainsFollow(list, tab, sz, rect, field) {
  const ft = followTick();
  const n = tabColorList(tab).length;
  const styles = [];
  for (let g = 0; g < n; g++) {
    const base = tabRGB(tab, g / n);
    styles.push([followStyle(base, false, ft), followStyle(base, true, ft)]);
  }
  // overlap: on the still lines AND near the pointer (or near the middle if no pointer yet)
  const ov = new Uint8Array(list.length);
  const usePtr = mouse.x > 0;
  const ox = usePtr ? mouse.x : rect.x + rect.w / 2, oy = usePtr ? mouse.y : rect.y + rect.h / 2;
  const R = Math.max(110, Math.min(rect.w, rect.h) * 0.33), R2 = R * R;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const dx = p.x - ox, dy = p.y - oy;
    if (dx * dx + dy * dy > R2) continue;
    field((p.x - rect.x) / rect.w, (p.y - rect.y) / rect.h);
    ov[i] = Math.abs(fieldF) < 0.2 ? 1 : 0;
  }
  for (let g = 0; g < n; g++) {
    for (let o = 0; o < 2; o++) {
      const st = styles[g][o];
      ctx.fillStyle = rgbStr(st.c);
      for (let i = g; i < list.length; i += n) {
        if (ov[i] !== o) continue;
        const p = list[i];
        ctx.fillRect(p.x + st.dx - sz / 2, p.y - sz / 2, sz, sz);
      }
    }
  }
}

// ========== SHARED: ripples + vibrating grains ==========
let ripples = [];
let fieldF = 0, fieldFU = 0, fieldFV = 0;

function addRipple(x, y, color) {
  ripples.push({ x, y, r: 4, life: 1, color: color || '0,212,255' });
}

function updateRipples() {
  const fade = mode === 'loop' ? gapParams().fade : 0.014;
  for (const r of ripples) { r.r += 4.5; r.life -= fade; }
  ripples = ripples.filter(r => r.life > 0);
}

function drawRipples() {
  ctx.lineWidth = 1.5;
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(${r.color},${(r.life * 0.45).toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function scatterGrains(list, n, rect) {
  list.length = 0;
  for (let i = 0; i < n; i++) {
    list.push({
      x: rect.x + Math.random() * rect.w,
      y: rect.y + Math.random() * rect.h,
      vx: 0, vy: 0
    });
  }
}

// Grains shake in proportion to how hard their spot vibrates (|f|),
// and drift down the slope of f^2, so they gather on the still lines.
function shakeGrains(list, rect, field, boost, scale, keep, pullK) {
  if (keep === undefined) keep = 0.75;
  const pk = 0.9 * (pullK || 1);
  const stir = mouse.down;
  const SR = 70;
  for (const p of list) {
    const u = (p.x - rect.x) / rect.w, v = (p.y - rect.y) / rect.h;
    field(u, v);
    const amp = Math.min(Math.abs(fieldF), 1.6);
    const kick = (0.75 * Math.pow(amp, 1.5) + 0.03) * (1 + boost * 5);
    p.vx += (Math.random() - 0.5) * kick * 2;
    p.vy += (Math.random() - 0.5) * kick * 2;
    p.vx -= fieldF * fieldFU / scale * pk;
    p.vy -= fieldF * fieldFV / scale * pk;
    if (stir) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < SR * SR) {
        const d = Math.sqrt(d2) || 1;
        const f = (SR - d) / SR;
        p.vx += dx / d * f * 3 + (Math.random() - 0.5) * 2;
        p.vy += dy / d * f * 3 + (Math.random() - 0.5) * 2;
      }
    }
    p.vx *= keep; p.vy *= keep;
    p.x += p.vx; p.y += p.vy;
    if (p.x < rect.x) { p.x = rect.x; p.vx = Math.abs(p.vx); }
    else if (p.x > rect.x + rect.w) { p.x = rect.x + rect.w; p.vx = -Math.abs(p.vx); }
    if (p.y < rect.y) { p.y = rect.y; p.vy = Math.abs(p.vy); }
    else if (p.y > rect.y + rect.h) { p.y = rect.y + rect.h; p.vy = -Math.abs(p.vy); }
  }
}

function drawGrains(list, c1, c2, sz) {
  ctx.fillStyle = c1;
  for (let i = 0; i < list.length; i++) {
    if (i % 6 === 0) continue;
    const p = list[i];
    ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
  ctx.fillStyle = c2;
  for (let i = 0; i < list.length; i += 6) {
    const p = list[i];
    ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
}

// Faint dots along the still lines (sign changes of f)
function drawNodeLines(rect, field, color) {
  const step = 3;
  ctx.fillStyle = color;
  const nx = Math.ceil(rect.w / step), ny = Math.ceil(rect.h / step);
  let prevRow = new Float32Array(nx + 1);
  for (let j = 0; j <= ny; j++) {
    const row = new Float32Array(nx + 1);
    for (let i = 0; i <= nx; i++) {
      field(i * step / rect.w, j * step / rect.h);
      row[i] = fieldF;
      if ((i > 0 && (row[i] > 0) !== (row[i - 1] > 0)) || (j > 0 && (row[i] > 0) !== (prevRow[i] > 0))) {
        ctx.fillRect(rect.x + i * step - 0.75, rect.y + j * step - 0.75, 1.5, 1.5);
      }
    }
    prevRow = row;
  }
}

// ========== SAND PLATE (Chladni) ==========
let plateBoost = 0;
let plateLines = false;
const PLATE_GRAINS = 5000;

function plateRect() {
  // keep the plate clear of the hint bar at the bottom
  const hb = hint.offsetHeight + 32;
  const S = Math.max(120, Math.min(width - 32, height - hb - 16));
  return { x: (width - S) / 2, y: Math.max(16, (height - hb - S) / 2), w: S, h: S };
}

function plateParams() {
  let a = waveN, b = waveM, s = -1;
  if (a === b) { b = a + 1; s = 1; } // equal modes cancel out; use a neighbor mode instead
  return [a, b, s];
}

let plateA = 3, plateB = 4, plateS = -1;
function plateField(u, v) {
  const pa = Math.PI * plateA, pb = Math.PI * plateB;
  const cau = Math.cos(pa * u), sau = Math.sin(pa * u), cbu = Math.cos(pb * u), sbu = Math.sin(pb * u);
  const cav = Math.cos(pa * v), sav = Math.sin(pa * v), cbv = Math.cos(pb * v), sbv = Math.sin(pb * v);
  fieldF = cau * cbv + plateS * cbu * cav;
  fieldFU = -pa * sau * cbv - plateS * pb * sbu * cav;
  fieldFV = -pb * cau * sbv - plateS * pa * cbu * sav;
}

function scatterPlate() {
  scatterGrains(particles, PLATE_GRAINS, plateRect());
  plateBoost = 0.6;
}

function plateDown(x, y) {
  plateBoost = 1;
  addRipple(x, y, tabColorList('plate') ? rgbTriplet(tabRGB('plate', 0)) : '250,204,21');
  if (gain && audioCtx) {
    const t = audioCtx.currentTime;
    gain.gain.cancelScheduledValues(t);
    gain.gain.setValueAtTime(0.16, t);
    gain.gain.setTargetAtTime(0.08, t, 0.15);
  }
}

function updatePlate() {
  updateRipples();
  if (frozen) return;
  [plateA, plateB, plateS] = plateParams();
  const r = plateRect();
  const k = plateK();
  shakeGrains(particles, r, plateField, plateBoost, Math.PI * Math.max(plateA, plateB), clampN(1 - 0.25 * k, 0.5, 0.9), k * k);
  plateBoost *= 1 - 0.03 * k;
}

function drawPlate() {
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, width, height);
  const r = plateRect();
  ctx.fillStyle = '#0b1018';
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = 'rgba(0,212,255,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(r.x - 0.5, r.y - 0.5, r.w + 1, r.h + 1);
  [plateA, plateB, plateS] = plateParams();
  const plateCols = tabColorList('plate');
  if (plateLines) drawNodeLines(r, plateField, plateCols ? rgbStr(tabRGB('plate', 0.5), 0.35) : 'rgba(0,212,255,0.35)');
  if (plateCols && followSplitting('plate')) drawGrainsFollow(particles, 'plate', 1.7, r, plateField);
  else if (plateCols) drawGrainsTab(particles, 'plate', 1.7, 0);
  else drawGrains(particles, '#facc15', '#fff3b0', 1.7);
  drawRipples();
  if (mouse.x) {
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mouse.x - 10, mouse.y); ctx.lineTo(mouse.x + 10, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 10); ctx.lineTo(mouse.x, mouse.y + 10);
    ctx.stroke();
    if (mouse.down) {
      ctx.strokeStyle = 'rgba(0,212,255,0.3)';
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 70, 0, Math.PI * 2); ctx.stroke();
    }
  }
}

// ========== 1D TO 2D WAVES ==========
let waveParticles = [];
let waveBoost = 0;
let wavePulse = 0;
const WAVE_GRAINS = 4000;

function waveRect() {
  const gl = waveGraphs.offsetLeft, gt = waveGraphs.offsetTop;
  const gw = waveGraphs.offsetWidth, gh = waveGraphs.offsetHeight;
  const bottom = height - hint.offsetHeight - 32; // stay above the hint bar
  if (width >= 700) {
    const x = gl + gw + 32;
    return { x, y: 24, w: Math.max(80, width - x - 24), h: Math.max(80, bottom - 24) };
  }
  const y = gt + gh + 16;
  return { x: 22, y, w: Math.max(80, width - 38), h: Math.max(60, bottom - y) };
}

function waveField(u, v) {
  const a = Math.PI * hWaves, b = Math.PI * vWaves;
  const su = Math.sin(a * u), sv = Math.sin(b * v);
  fieldF = su * sv;
  fieldFU = a * Math.cos(a * u) * sv;
  fieldFV = b * su * Math.cos(b * v);
}

function resetWaveParticles() {
  scatterGrains(waveParticles, WAVE_GRAINS, waveRect());
  waveBoost = 0.6;
  updateWaveLabels();
}

function reshakeWaves() {
  updateSound();
  waveBoost = 1;
  wavePulse = 1;
  updateWaveLabels();
}

function updateWaveLabels() {
  const h = document.getElementById('hLabel'), v = document.getElementById('vLabel');
  if (h) h.textContent = `Horizontal wave: ${hWaves + 1} nodes`;
  if (v) v.textContent = `Vertical wave: ${vWaves + 1} nodes`;
}

function wavesDown(x, y) {
  const r = waveRect();
  if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
    waveBoost = 1;
    wavePulse = 1;
    addRipple(x, y, tabColorList('waves') ? rgbTriplet(tabRGB('waves', 0)) : '103,232,249');
  }
}

function updateWaves() {
  updateRipples();
  if (!waveParticles.length) resetWaveParticles();
  const k = wavesK();
  shakeGrains(waveParticles, waveRect(), waveField, waveBoost, Math.PI * Math.max(hWaves, vWaves), clampN(1 - 0.25 * k, 0.5, 0.9), k * k);
  waveBoost *= 1 - 0.03 * k;
  wavePulse *= 1 - 0.05 * k;
}

function drawWaves() {
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, width, height);
  const r = waveRect();
  ctx.fillStyle = '#0a0f17';
  ctx.fillRect(r.x, r.y, r.w, r.h);
  const waveCols = tabColorList('waves');
  ctx.strokeStyle = waveCols ? rgbStr(tabRGB('waves', 0), 0.22) : 'rgba(103,232,249,0.22)';
  ctx.lineWidth = 1;
  ctx.strokeRect(r.x - 0.5, r.y - 0.5, r.w + 1, r.h + 1);
  // node ticks on the field edges, matching the node dots in the graphs
  ctx.fillStyle = waveNodeColor();
  for (let i = 0; i <= hWaves; i++) {
    const x = r.x + r.w * i / hWaves;
    ctx.beginPath(); ctx.arc(x, r.y - 7, 3, 0, Math.PI * 2); ctx.fill();
  }
  for (let j = 0; j <= vWaves; j++) {
    const y = r.y + r.h * j / vWaves;
    ctx.beginPath(); ctx.arc(r.x - 7, y, 3, 0, Math.PI * 2); ctx.fill();
  }
  const glow = Math.min(1, waveBoost);
  if (waveCols && followSplitting('waves')) drawGrainsFollow(waveParticles, 'waves', 1.8, r, waveField);
  else if (waveCols) drawGrainsTab(waveParticles, 'waves', 1.8, glow > 0.3 ? 0.35 : 0);
  else drawGrains(waveParticles, glow > 0.3 ? '#a5f3fc' : '#67e8f9', '#ecfeff', 1.8);
  drawRipples();
  drawMiniWaves();
}

function waveNodeColor() {
  const cols = tabColorList('waves');
  if (!cols) return '#ff6b9d';
  return rgbStr(lighten(tabRGB('waves', 0.5), 0.15));
}

let lastNoteDot = '';
function drawMiniWaves() {
  const waveCols = tabColorList('waves');
  const lineC = waveCols ? tabRGB('waves', 0) : [103, 232, 249];
  const nodeC = waveNodeColor();
  if (nodeC !== lastNoteDot) {
    const dot = document.querySelector('.wave-note .dot');
    if (dot) dot.style.background = nodeC;
    lastNoteDot = nodeC;
  }
  const hCanvas = document.getElementById('hWave');
  const vCanvas = document.getElementById('vWave');
  if (!hCanvas) return;
  const t = Date.now() * 0.002;
  const pulse = wavePulse;

  function drawWave(c, waves) {
    const W = c.canvas.width, H = c.canvas.height, mid = H / 2;
    c.clearRect(0, 0, W, H);
    c.strokeStyle = rgbStr(lineC, 0.12);
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, mid); c.lineTo(W, mid); c.stroke();
    const amp = (H * 0.3) * (1 + pulse * 0.5) * Math.sin(t * 2.2);
    c.strokeStyle = waveCols ? rgbStr(lighten(lineC, pulse * 0.9)) : (pulse > 0.05 ? `rgb(${103 + 152 * pulse | 0},${232 + 23 * pulse | 0},249)` : '#67e8f9');
    c.lineWidth = 2 + pulse * 2;
    c.shadowColor = waveCols ? rgbStr(lineC) : '#67e8f9';
    c.shadowBlur = pulse * 14;
    c.beginPath();
    for (let x = 0; x <= W; x++) {
      const y = mid + Math.sin((x / W) * Math.PI * waves) * amp;
      if (x === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
    c.shadowBlur = 0;
    c.fillStyle = nodeC;
    for (let i = 0; i <= waves; i++) {
      const x = Math.min(W - 4, Math.max(4, (i / waves) * W));
      c.beginPath();
      c.arc(x, mid, 4 + pulse * 2, 0, Math.PI * 2);
      c.fill();
    }
  }
  drawWave(hCanvas.getContext('2d'), hWaves);
  drawWave(vCanvas.getContext('2d'), vWaves);
}

// ========== RELAXING LOOP ==========
let loopTrails = false;

function gapText() { return loopGap.toFixed(1) + (linkedOn ? ', size and fade linked' : ', size only'); }
// Gap m: ring radius 45*m, return spring 0.015*m, ripple fade 0.014*m, speed loss per frame 0.1*m
function gapParams() {
  const m = loopGap;
  if (!linkedOn) return { ring: 45 * m, spring: 0.015, keep: 0.9, fade: 0.014 };
  return { ring: 45 * m, spring: 0.015 * m, keep: Math.max(0.75, Math.min(0.97, 1 - 0.1 * m)), fade: 0.014 * m };
}

function initLoop() {
  loopParticles = [];
  for (let i = 0; i < loopDensity; i++) {
    loopParticles.push({
      angle: Math.random() * Math.PI * 2,
      radius: 40 + Math.random() * Math.min(width, height) * 0.35,
      speed: (0.2 + Math.random() * 0.6) * (Math.random() < 0.5 ? 1 : -1),
      size: 1.5 + Math.random() * 3,
      hue: Math.random() * 60 + 180,
      offset: Math.random() * Math.PI * 2,
      x: undefined, y: undefined, vx: 0, vy: 0
    });
  }
}

function loopDown(x, y) {
  addRipple(x, y, tabColorList('loop') ? rgbTriplet(lighten(tabRGB('loop', 0.5), 0.3)) : '125,211,252');
}

function updateLoop() {
  updateRipples();
  const cx = width / 2, cy = height / 2;
  const t = Date.now() * 0.001;
  const R = Math.max(150, Math.min(width, height) * 0.3);
  const G = gapParams();
  for (const p of loopParticles) {
    p.angle += p.speed * loopSpeed * 0.01;
    const r = p.radius + Math.sin(t * 0.5 + p.offset) * 20;
    const tx = cx + Math.cos(p.angle) * r;
    const ty = cy + Math.sin(p.angle) * r * 0.7;
    if (p.x === undefined) { p.x = tx; p.y = ty; }
    p.tx = tx; p.ty = ty;
    let hold = 0, ax = 0, ay = 0;
    if (mouse.down) {
      const dx = mouse.x - p.x, dy = mouse.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < R) {
        hold = 1 - d / R;
        const pull = (d - G.ring) / d * 0.05 * hold;   // pull in, but keep a ring (the gap) around the finger
        ax += dx * pull; ay += dy * pull;
        const swirl = 0.55 * hold * (p.speed > 0 ? 1 : 0.8);
        ax += -dy / d * swirl; ay += dx / d * swirl;
      }
    }
    // ease back to the orbit when released
    const spring = G.spring * (1 - hold);
    ax += (tx - p.x) * spring; ay += (ty - p.y) * spring;
    for (const rp of ripples) {
      const dx = p.x - rp.x, dy = p.y - rp.y;
      const d = Math.hypot(dx, dy) || 1;
      const gap = Math.abs(d - rp.r);
      if (gap < 24) {
        const f = (1 - gap / 24) * rp.life * 1.2;
        ax += dx / d * f; ay += dy / d * f;
      }
    }
    p.vx = (p.vx + ax) * G.keep;
    p.vy = (p.vy + ay) * G.keep;
    p.x += p.vx; p.y += p.vy;
  }
}

function drawLoop() {
  if (loopTrails) {
    ctx.fillStyle = 'rgba(5,7,10,0.14)';
  } else {
    ctx.fillStyle = '#05070a';
  }
  ctx.fillRect(0, 0, width, height);
  const t = Date.now() * 0.001;
  if (mouse.down) {
    const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 90);
    const gc = tabColorList('loop') ? rgbTriplet(tabRGB('loop', 0)) : '125,211,252';
    g.addColorStop(0, `rgba(${gc},0.12)`);
    g.addColorStop(1, `rgba(${gc},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 90, 0, Math.PI * 2); ctx.fill();
  }
  const loopCols = tabColorList('loop');
  const loopSplit = followSplitting('loop');
  const ft = followTick();
  const inner = 40 + Math.min(width, height) * 0.35 * 0.4;
  for (const p of loopParticles) {
    let dx = 0;
    const alpha = 0.4 + Math.sin(t + p.offset) * 0.3;
    const sp = Math.min(1, Math.hypot(p.vx, p.vy) / 6);
    if (loopCols) {
      let c = lighten(tabRGB('loop', p.offset / (Math.PI * 2)), 0.1 + sp * 0.45);
      if (loopSplit) {
        // overlap: near the pointer if it is on the canvas, else the inner ring
        const near = mouse.x ? Math.hypot(p.x - mouse.x, p.y - mouse.y) < 180 : p.radius < inner;
        const st = followStyle(c, near, ft);
        c = st.c; dx = st.dx;
      }
      ctx.fillStyle = rgbStr(c, Math.min(1, alpha + sp * 0.4).toFixed(3));
    } else {
      ctx.fillStyle = `hsla(${p.hue}, 70%, ${60 + sp * 20}%, ${Math.min(1, alpha + sp * 0.4)})`;
    }
    ctx.beginPath();
    ctx.arc(p.x + dx, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  drawRipples();
}

// ========== SILK ==========
// Thin luminous threads ride a smooth flow field. Each thread keeps a short history of
// positions (typed arrays, one shared ring index) and is drawn as a crisp arc that fades
// toward its tail. Strokes are batched by color and alpha level, so a frame is a few dozen strokes.
const SILK_PALETTES = {
  peach: { label: 'Peach & Rose Silk', colors: ['#ffd8c4', '#ffb4a2', '#f4978e', '#ffc8dd', '#ff8fab'] },
  bio:   { label: 'Bioluminescent Blue', colors: ['#22d3ee', '#38bdf8', '#5eead4', '#a5f3fc', '#0ea5e9'] },
  lapis: { label: 'Lapis & Indigo', colors: ['#fcd34d', '#fff7d6', '#ffffff', '#818cf8', '#4f46e5'] },
  north: { label: 'Northern Lights', colors: ['#34d399', '#4ade80', '#2dd4bf', '#a78bfa', '#f472b6'] },
  prism: { label: 'Prism Rainbow', colors: ['#f472b6', '#4ade80', '#facc15', '#60a5fa', '#fb923c', '#c084fc'] },
};
const SILK_MODES = {
  aurora: 'Silk Aurora Ribbons',
  vortex: 'Vortex Whirlpools',
  mandala6: '6-Fold Mandala Silk',
  kaleido8: '8-Fold Kaleidoscope',
};
const SILK_L = 40;           // history slots per thread
const SILK_ALPHA_LEVELS = 8;
let silk = (() => {
  const d = { mode: 'vortex', pal: 'prism', smooth: 1, glow: 0.55 };
  try { Object.assign(d, JSON.parse(localStorage.getItem('sparkleSilk') || '{}')); } catch (e) {}
  if (!SILK_MODES[d.mode]) d.mode = 'vortex';
  if (!SILK_PALETTES[d.pal]) d.pal = 'prism';
  return d;
})();
let silkPaused = false, silkInitW = 0, silkInitH = 0;
let silkN = 0, silkAmb = 0, silkAmbMax = 0, silkHead = 0, silkBrushPtr = 0, silkT = 0;
let sX, sY, sVX, sVY, sHX, sHY, sAge, sLife, sBright, sCol;
let silkLast = null, silkSpeed = 0, silkFrameMs = 16, silkLastStamp = 0, silkAdaptAt = 0;
let SFX = 0, SFY = 0, silkBrushScale = 1;

function saveSilk() { try { localStorage.setItem('sparkleSilk', JSON.stringify(silk)); } catch (e) {} }

function silkInit() {
  const small = width < 600;
  silkAmbMax = Math.round(Math.max(250, Math.min(small ? 300 : 620, width * height / 1400)));
  silkAmb = silkAmbMax;
  const brush = small ? 260 : 450;
  silkN = silkAmbMax + brush;
  sX = new Float32Array(silkN); sY = new Float32Array(silkN);
  sVX = new Float32Array(silkN); sVY = new Float32Array(silkN);
  sHX = new Float32Array(silkN * SILK_L); sHY = new Float32Array(silkN * SILK_L);
  sAge = new Uint16Array(silkN); sLife = new Float32Array(silkN);
  sBright = new Float32Array(silkN); sCol = new Uint8Array(silkN);
  silkBrushPtr = silkAmbMax;
  for (let i = 0; i < silkAmbMax; i++) silkSpawn(i, true);
  for (let i = silkAmbMax; i < silkN; i++) sLife[i] = 0;
}

function silkSpawn(i, first) {
  sX[i] = Math.random() * width; sY[i] = Math.random() * height;
  silkField(sX[i], sY[i]);
  sVX[i] = SFX; sVY[i] = SFY;
  sAge[i] = 0;
  sLife[i] = 120 + Math.random() * 320 + (first ? Math.random() * 200 : 0);
  sBright[i] = 0;
  sCol[i] = (Math.random() * 255) | 0;
}

function silkColors() {
  return tabColorList('silk') || SILK_PALETTES[silk.pal].colors;
}
function silkK() { return linkedOn ? silk.smooth : 1; }

// Stream function psi in units of S = half the short side; velocity = (dpsi/dv, -dpsi/du)
function silkField(x, y) {
  const S = Math.min(width, height) * 0.5, cx = width / 2, cy = height / 2;
  const u = (x - cx) / S, v = (y - cy) / S, s = silk.smooth, t = silkT;
  let pu = 0, pv = 0;
  const m = silk.mode;
  if (m === 'aurora') {
    // long gentle ribbons drifting sideways
    pv += 1;
    const a = 2.0 * u / s + 0.25 * t, b = 1.3 * v / s - 0.15 * t, c = 3.3 * u / s - 2.1 * v / s + 0.4 * t;
    pu += 0.35 * Math.cos(a) * (2.0 / s) * Math.cos(b) + 0.2 * Math.cos(c) * (3.3 / s);
    pv += -0.35 * Math.sin(a) * Math.sin(b) * (1.3 / s) - 0.2 * Math.cos(c) * (2.1 / s);
    const d = 1.1 * u / s + 0.9 * v / s - 0.1 * t;
    pu += 0.25 * Math.cos(d) * (1.1 / s); pv += 0.25 * Math.cos(d) * (0.9 / s);
  } else if (m === 'vortex') {
    // several whirlpools wandering slowly, alternating spin
    const R2 = (0.42 * s) * (0.42 * s);
    for (let k = 0; k < 5; k++) {
      const ox = 0.85 * Math.cos(0.05 * t * (k + 1) + k * 1.3) * (width / S) * 0.5;
      const oy = 0.75 * Math.sin(0.04 * t * (k + 2) + k * 2.1) * (height / S) * 0.5;
      const du = u - ox, dv = v - oy;
      const g = (k & 1 ? -0.55 : 0.6) * Math.exp(-(du * du + dv * dv) / R2);
      pu += g * -2 * du / R2; pv += g * -2 * dv / R2;
    }
    const a = 1.7 * u / s + 0.2 * t, b = 1.4 * v / s - 0.17 * t;
    pu += 0.12 * Math.cos(a) * (1.7 / s) * Math.cos(b);
    pv += -0.12 * Math.sin(a) * Math.sin(b) * (1.4 / s);
  } else {
    const N = m === 'mandala6' ? 6 : 8, mirror = m === 'kaleido8';
    const r = Math.hypot(u, v) + 1e-4, th = Math.atan2(v, u);
    let pr = 0, pth = 0;
    const T = [[0.34, 4.0, 1, 0.3, 0.13], [0.2, 7.0, 2, -0.25, -0.09], [0.16, 2.4, 1, 0.17, 0.05]];
    for (let j = 0; j < 3; j++) {
      const [A, K, mm, w, wr] = T[j];
      const ph = mirror ? 0 : wr * t * 2;
      const sr = Math.sin(K * r / s + w * t + j), cr = Math.cos(K * r / s + w * t + j);
      const ang = N * mm * th + ph;
      pr += A * cr * (K / s) * Math.cos(ang);
      pth += -A * sr * N * mm * Math.sin(ang);
    }
    pr += 0.35 * Math.cos(2.5 * r / s - 0.2 * t) * (2.5 / s);   // rings: circular currents
    const c = Math.cos(th), sn = Math.sin(th);
    pu = pr * c - pth * sn / r;
    pv = pr * sn + pth * c / r;
  }
  // soft speed limit keeps arcs a similar length everywhere
  const gx = pv, gy = -pu, g = Math.hypot(gx, gy);
  const k = 3.1 / (0.5 + g);
  SFX = gx * k; SFY = gy * k;
}

function silkPlace(i, x, y, vx, vy, bright, life) {
  sX[i] = x; sY[i] = y; sVX[i] = vx; sVY[i] = vy;
  sAge[i] = 0; sLife[i] = life; sBright[i] = bright;
  sCol[i] = (Math.random() * 255) | 0;
}

// the pointer is a brush: dense bright clusters along the path, copied around the center in the symmetric modes
function silkBrush() {
  if (!mouse.down || !silkLast) return;
  const dx = mouse.x - silkLast.x, dy = mouse.y - silkLast.y, d = Math.hypot(dx, dy);
  silkSpeed = silkSpeed * 0.8 + d * 0.2;
  const n = Math.round(Math.min(50, 4 + d * 1.0) * silkBrushScale);
  const rB = 16 * silkK();
  const cx = width / 2, cy = height / 2;
  const N = silk.mode === 'mandala6' ? 6 : silk.mode === 'kaleido8' ? 8 : 1, mirror = silk.mode === 'kaleido8';
  const copies = N * (mirror ? 2 : 1);
  const per = Math.max(2, Math.round(n / Math.sqrt(copies)));
  for (let q = 0; q < per; q++) {
    const f = Math.random();
    const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * rB;
    const ox = Math.cos(a) * rr, oy = Math.sin(a) * rr;
    const px = silkLast.x + dx * f + ox - cx, py = silkLast.y + dy * f + oy - cy;
    // drag velocity, plus a push outward with a curl so the cluster blooms
    const sw = Math.random() < 0.5 ? 1 : -1;
    const ex = Math.cos(a), ey = Math.sin(a);
    const vx = dx * 0.35 + ex * 1.6 - ey * sw * 1.2, vy = dy * 0.35 + ey * 1.6 + ex * sw * 1.2;
    const life = 90 + Math.random() * 140;
    for (let c = 0; c < copies; c++) {
      const flip = mirror && (c & 1);
      const ang = (2 * Math.PI / N) * (mirror ? c >> 1 : c);
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const qx = px, qy = flip ? -py : py, wx = vx, wy = flip ? -vy : vy;
      const i = silkBrushPtr;
      silkBrushPtr = silkBrushPtr + 1 >= silkN ? silkAmbMax : silkBrushPtr + 1;
      silkPlace(i, cx + qx * ca - qy * sa, cy + qx * sa + qy * ca, wx * ca - wy * sa, wx * sa + wy * ca, 1, life);
    }
  }
  silkLast = { x: mouse.x, y: mouse.y };
}

function silkDown(p) { silkLast = { x: p.x, y: p.y }; }

function updateSilk() {
  if (!sX) silkInit();
  silkT += 1 / 60;
  silkBrush();
  if (!mouse.down) silkSpeed *= 0.9;
  const L = SILK_L, W = width, H = height, k = silkK();
  silkHead = (silkHead + 1) % L;
  const h = silkHead;
  let dev = 0, devN = 0;
  for (let i = 0; i < silkN; i++) {
    if (sLife[i] <= 0) {
      if (i < silkAmb) silkSpawn(i); else continue;
    }
    silkField(sX[i], sY[i]);
    dev += Math.abs(SFX - sVX[i]) + Math.abs(SFY - sVY[i]); devN++;
    const br = sBright[i];
    const relax = br > 0.05 ? 0.035 : 0.14;
    sVX[i] += (SFX - sVX[i]) * relax; sVY[i] += (SFY - sVY[i]) * relax;
    sX[i] += sVX[i]; sY[i] += sVY[i];
    sHX[i * L + h] = sX[i]; sHY[i * L + h] = sY[i];
    if (sAge[i] < 65535) sAge[i]++;
    sLife[i] -= 1;
    if (br > 0) sBright[i] = br * (1 - 0.012 * k);
    const x = sX[i], y = sY[i];
    if (x < -40 || x > W + 40 || y < -40 || y > H + 40) sLife[i] = Math.min(sLife[i], 0);
  }
  silkDev = devN ? dev / devN : 0;
  // keep about 60fps: thin out the ambient threads if frames run long
  const now = performance.now();
  if (silkLastStamp) silkFrameMs = silkFrameMs * 0.95 + Math.min(100, now - silkLastStamp) * 0.05;
  silkLastStamp = now;
  if (now > silkAdaptAt) {
    silkAdaptAt = now + 1000;
    if (silkFrameMs > 19.5) { if (silkAmb > 150) silkAmb = Math.round(silkAmb * 0.85); silkBrushScale = Math.max(0.3, silkBrushScale * 0.85); }
    else if (silkFrameMs < 17.2) { silkAmb = Math.min(silkAmbMax, Math.round(silkAmb * 1.15) + 5); silkBrushScale = Math.min(1, silkBrushScale * 1.12); }
  }
}

function drawSilk() {
  ctx.fillStyle = '#04060f';
  ctx.fillRect(0, 0, width, height);
  if (!sX) silkInit();
  const cols = silkColors(), nc = cols.length;
  const split = followSplitting('silk'), ft = followTick();
  const L = SILK_L, h = silkHead, k = silkK();
  // Trail Glow sets the arc length; with Linked on, smoother flow means shorter (faster fading) arcs
  const len = Math.max(6, Math.min(L - 1, Math.round((8 + silk.glow * 30) / k)));
  const A = SILK_ALPHA_LEVELS, groups = nc * (split ? 2 : 1);
  const paths = new Array(groups * A);
  for (let q = 0; q < paths.length; q++) paths[q] = new Path2D();
  const glowPath = new Array(groups);
  for (let q = 0; q < groups; q++) glowPath[q] = new Path2D();
  const cx = width / 2, cy = height / 2, inner = Math.min(width, height) * 0.22;
  const pointerOn = mouse.x !== undefined && mouse.x > 0;
  const bands = 4;
  for (let i = 0; i < silkN; i++) {
    if (sLife[i] <= 0 && i >= silkAmb) continue;
    const age = sAge[i];
    const c = Math.min(age, len);
    if (c < 2) continue;
    let gi = sCol[i] % nc;
    if (split) {
      const near = pointerOn ? Math.hypot(sX[i] - mouse.x, sY[i] - mouse.y) < 180 : Math.hypot(sX[i] - cx, sY[i] - cy) < inner;
      gi = gi * 2 + (near ? 1 : 0);
    }
    // whole-thread fade at birth and end of life
    const fade = Math.min(1, age / 12, Math.max(0, sLife[i]) / 25) * (0.55 + 0.45 * Math.min(1, sBright[i] * 2 + 0.6));
    const base = i * L;
    for (let b = 0; b < bands; b++) {
      const s0 = Math.floor(b * c / bands), s1 = Math.floor((b + 1) * c / bands);
      if (s1 <= s0) continue;
      const al = fade * (1 - b / bands) * (1 - 0.5 * b / bands);
      const ai = Math.round(al * (A - 1));
      if (ai <= 0) continue;
      const P = paths[gi * A + ai];
      let j = (h - s0 + L) % L;
      P.moveTo(sHX[base + j], sHY[base + j]);
      for (let s = s0 + 1; s <= s1; s++) {
        j = (h - s + L) % L;
        P.lineTo(sHX[base + j], sHY[base + j]);
      }
    }
    if (sBright[i] > 0.55 && c >= 4) {
      const j0 = h, j1 = (h - 3 + L) % L;
      glowPath[gi].moveTo(sHX[base + j0], sHY[base + j0]);
      glowPath[gi].lineTo(sHX[base + j1], sHY[base + j1]);
    }
  }
  ctx.save();
  ctx.lineCap = 'butt';
  for (let g = 0; g < groups; g++) {
    let col = hexToRgbCached(cols[split ? g >> 1 : g]), dx = 0;
    if (split) { const st = followStyle(col, (g & 1) === 1, ft); col = st.c; dx = st.dx; }
    if (dx) ctx.translate(dx, 0);
    ctx.strokeStyle = rgbStr(col);
    ctx.lineWidth = 1.5;
    for (let a = 1; a < A; a++) {
      ctx.globalAlpha = a / (A - 1);
      ctx.stroke(paths[g * A + a]);
    }
    // soft added glow on the heads of freshly painted threads
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 3;
    ctx.strokeStyle = rgbStr(lighten(col, 0.4));
    ctx.stroke(glowPath[g]);
    ctx.globalCompositeOperation = 'source-over';
    if (dx) ctx.translate(-dx, 0);
  }
  ctx.restore();
}

function silkClear() {
  if (!sX) return;
  for (let i = 0; i < silkN; i++) { if (i < silkAmbMax) silkSpawn(i); else sLife[i] = 0; }
}

function silkPaletteOptions() {
  let o = Object.keys(SILK_PALETTES).map(k => `<option value="${k}">${SILK_PALETTES[k].label}</option>`).join('');
  o += '<optgroup label="Shared sets">' + Object.keys(COLOR_SETS).map(k => `<option value="set:${k}">${COLOR_SETS[k].label}</option>`).join('') + '</optgroup>';
  o += '<option value="follow">Follow my work</option>';
  return o;
}
function silkPaletteValue() {
  const st = colorState.silk;
  if (st && st.set === 'follow') return 'follow';
  if (st && st.set && COLOR_SETS[st.set]) return 'set:' + st.set;
  return silk.pal;
}
function setSilkPalette(v) {
  if (v === 'follow') setTabColors('silk', FOLLOW_WRITE, 'follow');
  else if (v.startsWith('set:')) setTabColors('silk', COLOR_SETS[v.slice(4)].colors, v.slice(4));
  else { setTabColors('silk', null); silk.pal = v; saveSilk(); }
}

// ===== Rest meter: how far each tab is from rest, over time (log scale) =====
// Based on Michele's rest-meter.js (restMeter / sampleRestMeter / fitHealRate / drawRestMeter),
// widened to every tab. The slope of the falling line after you let go is the healing rate (the gap).
const restMeter = { hist: [], times: [], hist2: [], max: 600, releasedAt: null, rate: null, wasDown: false,
  tab: null, unit: 0.5, state: '',
  // starts folded on phones (it would cover the play area); remembers your choice
  collapsed: (() => { try { const v = localStorage.getItem('sparkleRest'); return v === null ? window.innerWidth < 600 : v === '0'; } catch (e) { return false; } })() };
let silkDev = 0;

// what "distance from rest" means on each tab, and the smallest step above calm that counts (unit)
const REST_DEF = {
  loop:    { label: 'distance from rest (log)', unit: 0.5 },     // mean px from home (her original)
  bubbles: { label: 'bubble motion (log)', unit: 0.01 },         // total speed²
  plate:   { label: 'distance from still lines (log)', unit: 0.002, second: true },  // mean |field| at grains; faint: grain energy
  waves:   { label: 'distance from still lines (log)', unit: 0.002, second: true },
  silk:    { label: 'threads off the flow (log)', unit: 0.01 },  // mean |velocity - flow|
  crystal: { label: 'vapor change per step (log)', unit: 0.0005 },
  magnets: { label: 'fluid motion (log)', unit: 0.001 },   // mean particle speed, px per step // mean |change| of the vapor field, thousandths
};

function sampleRestMeter(list, pressed, nowMs) {
  let sum = 0, n = 0;
  for (const p of list) {
    if (p.tx === undefined || p.x === undefined) continue;
    sum += Math.hypot(p.x - p.tx, p.y - p.ty); n++;
  }
  return sampleRestMeterValue(n ? sum / n : 0, pressed, nowMs);
}

function sampleRestMeterValue(d, pressed, nowMs, d2) {
  const m = restMeter;
  // skip the first 0.8s on a tab: start-up values would set a false calm line
  if (m.enteredAt && nowMs - m.enteredAt < 800) return;
  m.hist.push(d); m.times.push(nowMs); m.hist2.push(d2 || 0);
  if (m.hist.length > m.max) { m.hist.shift(); m.times.shift(); m.hist2.shift(); }
  if (m.wasDown && !pressed) { m.releasedAt = nowMs; m.rate = null; }   // just let go
  if (pressed) m.releasedAt = null;
  m.wasDown = pressed;
  if (m.releasedAt !== null) m.rate = fitHealRate(m) ?? m.rate;
  m.state = restState(m, pressed);
  return d;
}

// Straight-line fit of ln(distance above calm) against time, using samples since release.
function fitHealRate(m) {
  const calm = Math.min(...m.hist);                 // resting level (e.g. the specks' lag)
  const ts = [], as = [];
  for (let i = 0; i < m.hist.length; i++) {
    if (m.times[i] < m.releasedAt) continue;
    ts.push((m.times[i] - m.releasedAt) / 1000); as.push(m.hist[i] - calm);
  }
  if (ts.length < 6) return null;
  // the return can swing past home and back, so fit the falling envelope (the highest value still to come)
  for (let i = as.length - 2; i >= 0; i--) as[i] = Math.max(as[i], as[i + 1]);
  const a0 = as[0], xs = [], ys = [];
  for (let i = 0; i < as.length; i++) {
    const above = as[i];
    if (above <= Math.max(m.unit, 0.03 * a0)) break;   // down at the resting wobble
    if (above > 0.6 * a0) continue;                       // skip the first quick snap
    xs.push(ts[i]); ys.push(Math.log(above));
  }
  if (xs.length < 4) return null;
  const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  let sxy = 0, sxx = 0;
  for (let i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; }
  return sxx > 0 ? -sxy / sxx : null;               // per second; positive means healing
}

// plain words from the last 1.5 s: falling straight, flat above calm, or rising
function restState(m, pressed) {
  const H = m.hist, T = m.times, n = H.length;
  if (n < 10) return '';
  const calm = Math.min(...H), now = T[n - 1];
  if (H[n - 1] - calm < Math.max(m.unit * 2, 0.05 * (Math.max(...H) - calm))) return 'at rest (floor)';
  let sx = 0, sy = 0, sxx = 0, sxy = 0, k = 0;
  for (let i = n - 1; i >= 0 && T[i] > now - 1500; i--) {
    const x = (T[i] - now) / 1000, y = Math.log(Math.max(m.unit, H[i] - calm));
    sx += x; sy += y; sxx += x * x; sxy += x * y; k++;
  }
  const slope = k > 8 ? (k * sxy - sx * sy) / Math.max(1e-9, k * sxx - sx * sx) : 0;
  m.shortSlope = slope;
  // how sure is that slope? (t = slope / its standard error); jitter near the floor gives small t
  let tStat = 0;
  if (k > 8) {
    const mx = sx / k, my = sy / k, Sxx = sxx - k * mx * mx;
    let rss = 0;
    for (let i = n - 1, j = 0; j < k; i--, j++) {
      const x = (T[i] - now) / 1000, y = Math.log(Math.max(m.unit, H[i] - calm));
      const e = y - (my + slope * (x - mx)); rss += e * e;
    }
    const se = Math.sqrt(rss / (k - 2) / Math.max(1e-9, Sxx));
    tStat = se > 0 ? slope / se : (slope ? 99 * Math.sign(slope) : 0);
  }

      const t = audioCtx.currentTime;
      h1.frequency.setTargetAtTime(toneN(hWaves), t, 0.1); h2.frequency.setTargetAtTime(toneN(hWaves) + 0.8, t, 0.1);
      v1.frequency.setTargetAtTime(toneM(vWaves), t, 0.1); v2.frequency.setTargetAtTime(toneM(vWaves) + 0.6, t, 0.1);
    };
    addNodes(b, [h1, h2, v1, v2]);
    bed = b;
  } else if (tab === 'loop') {
    const b = makeBed(tab, 0.05);
    const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220; lp.Q.value = 0.7;
    lp.connect(b.out);
    const a = osc('sawtooth', 55), c = osc('sawtooth', 55.35), d = osc('sine', 82.4);
    [a, c, d].forEach(o => o.connect(lp));
    b.frame = () => {
      let s = 0;
      for (const p of loopParticles) s += Math.abs(p.vx) + Math.abs(p.vy);
      const avg = loopParticles.length ? s / loopParticles.length : 0;
      lp.frequency.setTargetAtTime(200 + Math.min(1, avg / 5) * 1400, audioCtx.currentTime, 0.12);
    };
    addNodes(b, [a, c, d, lp]);
    bed = b;
  } else if (tab === 'sand') {
    const b = makeBed(tab, 1);
    const src = audioCtx.createBufferSource(); src.buffer = getNoise(); src.loop = true;
    const hissF = audioCtx.createBiquadFilter(); hissF.type = 'bandpass'; hissF.frequency.value = 3200; hissF.Q.value = 0.6;
    const hissG = audioCtx.createGain(); hissG.gain.value = 0;
    const scrF = audioCtx.createBiquadFilter(); scrF.type = 'bandpass'; scrF.frequency.value = 700; scrF.Q.value = 1.2;
    const scrG = audioCtx.createGain(); scrG.gain.value = 0;
    src.connect(hissF); hissF.connect(hissG); hissG.connect(b.out);
    src.connect(scrF); scrF.connect(scrG); scrG.connect(b.out);
    b.frame = () => {
      const t = audioCtx.currentTime;
      const pouring = mouse.down && tool === 'pour';
      hissG.gain.setTargetAtTime(pouring ? 0.035 + size * 0.003 : 0, t, 0.08);
      const carving = mouse.down && tool === 'carve' && performance.now() - lastScrape < 120;
      scrG.gain.setTargetAtTime(carving ? 0.09 : 0, t, 0.05);
    };
    addNodes(b, [src, hissF, hissG, scrF, scrG]);
    bed = b;
  } else if (tab === 'bubbles') {
    bed = makeBed(tab, 0);  // no bed; pops are one-shots
  } else if (tab === 'silk') {
    const b = makeBed(tab, 1);
    const src = audioCtx.createBufferSource(); src.buffer = getNoise(); src.loop = true;
    const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1200; bp.Q.value = 0.8;
    const ng = audioCtx.createGain(); ng.gain.value = 0;
    src.connect(bp); bp.connect(ng); ng.connect(b.out);
    // a faint high shimmer: two detuned sines that beat slowly
    const s1 = osc('sine', 1318.5), s2 = osc('sine', 1321.3), sg = audioCtx.createGain(); sg.gain.value = 0;
    s1.connect(sg); s2.connect(sg); sg.connect(b.out);
    b.frame = () => {
      const t = audioCtx.currentTime, v = Math.min(1, silkSpeed / 25);
      ng.gain.setTargetAtTime(0.004 + v * 0.05, t, 0.1);
      bp.frequency.setTargetAtTime(700 + v * 3200, t, 0.1);
      sg.gain.setTargetAtTime(0.002 + v * 0.012, t, 0.15);
    };
    addNodes(b, [src, bp, ng, s1, s2, sg]);
    bed = b;
  } else if (tab === 'magnets') {
    // a soft magnetic hum: low tones through a lowpass that opens as the pull and the spikes grow
    const b = makeBed(tab, 1);
    const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160; lp.Q.value = 2;
    const hg = audioCtx.createGain(); hg.gain.value = 0;
    lp.connect(hg); hg.connect(b.out);
    const a = osc('sawtooth', 60), c = osc('sawtooth', 60.4), d = osc('sine', 120);
    [a, c, d].forEach(o => o.connect(lp));
    b.frame = () => {
      const t = audioCtx.currentTime, sp = Math.min(1, magSpike / 40);
      hg.gain.setTargetAtTime(0.012 + 0.03 * Math.min(1.5, mag.pull) / 1.5 + 0.03 * sp, t, 0.15);
      lp.frequency.setTargetAtTime(140 + 260 * mag.pull + 900 * sp, t, 0.15);
    };
    addNodes(b, [a, c, d, lp, hg]);
    bed = b;
  }
}

function updateSound() { if (bed && bed.update) bed.update(); }

// Short one-shot voice: an oscillator with a pitch glide and decay envelope
function blip(type, f0, f1, dur, vol, when) {
  if (!soundOn || !audioCtx || !master) return;
  const t = audioCtx.currentTime + (when || 0);
  const o = osc(type, f0), g = audioCtx.createGain();
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur * 0.6);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  liveVoices += 2;
  o.onended = () => { o.disconnect(); g.disconnect(); liveVoices -= 2; };
  o.start(t); o.stop(t + dur + 0.05);
}

function chime(base, vol) {
  blip('sine', base, base, 1.6, vol || 0.08);
  blip('sine', base * 2.01, base * 2.01, 1.1, (vol || 0.08) * 0.4);
  blip('sine', base * 3.0, base * 3.0, 0.7, (vol || 0.08) * 0.2);
}

// Plucked string (Karplus-Strong) rendered into a buffer
function pluck(freq, vol, kLink) {
  const loss = 1 - 0.004 * (kLink || 1);   // Linked: more nodes, the string dies faster
  if (!soundOn || !audioCtx || !master) return;
  const sr = audioCtx.sampleRate, N = Math.max(2, Math.round(sr / freq)), len = Math.floor(sr * 1.4);
  const buf = audioCtx.createBuffer(1, len, sr), d = buf.getChannelData(0);
  const ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
  let k = 0;
  for (let i = 0; i < len; i++) {
    const a = ring[k], b = ring[(k + 1) % N];
    d[i] = a;
    ring[k] = (a + b) * 0.5 * loss;
    k = (k + 1) % N;
  }
  const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
  src.buffer = buf; g.gain.value = vol || 0.22;
  src.connect(g); g.connect(master);
  liveVoices += 2;
  src.onended = () => { src.disconnect(); g.disconnect(); liveVoices -= 2; };
  src.start();
}

function soundPointerDown(p) {
  if (!soundOn) return;
  if (mode === 'sand') {
    if (tool === 'stamp') blip('square', 1800, 900, 0.05, 0.03);
  } else if (mode === 'loop') {
    chime(660 + Math.random() * 220, 0.06);
  } else if (mode === 'plate') {
    blip('triangle', toneN(waveN) * 4, toneN(waveN) * 3.9, 0.5, 0.07);
    blip('sine', toneM(waveM) * 2, toneM(waveM) * 2, 0.7, 0.05);
  } else if (mode === 'silk') {
    chime(880 + Math.random() * 440, 0.03);
  } else if (mode === 'waves') {
    const r = waveRect();
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
      pluck(toneN(hWaves) * 2, 0.22, wavesK());
      pluck(toneM(vWaves) * 2, 0.14, wavesK());
    }
  }
}

function soundPointerMove() {
  if (mode === 'sand' && tool === 'carve' && mouse.down) lastScrape = performance.now();
}

// Called every frame
function soundFrame() {
  if (mode === 'bubbles') {
    const n = bubbles.length;
    if (soundOn) {
      if (n > lastBubbleCount) {
        const b = bubbles[n - 1];
        const f = 900 - Math.min(60, b.r) * 8;
        blip('sine', f, f * 1.6, 0.18, 0.08);          // blow: rising bloop
      } else if (n < lastBubbleCount && n > 0) {
        const big = Math.max(...bubbles.map(b => b.r));
        const f = Math.max(140, 700 - big * 5);
        blip('sine', f * 1.5, f, 0.22, 0.09);          // merge: falling bloop, lower for bigger bubbles
      }
    }
    lastBubbleCount = n;
  } else {
    lastBubbleCount = 0;
  }
  if (isFollow(mode)) {
    const tk = followTick().tick;
    if (tk !== lastFollowTick && tk === FOLLOW_FREEZE && soundOn) chime(523.25, 0.05);
    lastFollowTick = tk;
  }
  if (soundOn && bed && bed.frame) bed.frame();
}

// ========== MAIN LOOP ==========
function loop() {
  updateTickLabel();
  document.documentElement.style.setProperty('--rest-bottom', (hint.offsetHeight + 28) + 'px');
  soundFrame();
  if (mode === 'sand') {
    updateSand();
    drawSand();
  } else if (mode === 'loop') {
    if (!followHolding('loop')) updateLoop();
    drawLoop();
  } else if (mode === 'bubbles') {
    if (!followHolding('bubbles')) updateBubbles();
    drawBubbles();
  } else if (mode === 'plate') {
    if (!followHolding('plate')) updatePlate();
    drawPlate();
  } else if (mode === 'waves') {
    if (!followHolding('waves')) updateWaves();
    drawWaves();
  } else if (mode === 'silk') {
    if (!followHolding('silk') && !silkPaused) updateSilk();
    else if (mouse.down) silkLast = { x: mouse.x, y: mouse.y };
    drawSilk();
  } else if (mode === 'crystal') {
    if (!followHolding('crystal') && !cryPaused) updateCrystal();
    drawCrystal();
  } else if (mode === 'magnets') {
    magnetsFrame();
    if (!followHolding('magnets') && !magPaused) updateMagnets();
    drawMagnets();
  } else if (mode === 'stretch') {
    drawStretch();
  }
  restFrame();
  requestAnimationFrame(loop);
}

// Mouse / Touch
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

canvas.addEventListener('mousedown', e => {
  mouse.down = true;
  const p = getPos(e);
  mouse.x = p.x; mouse.y = p.y;
  if (mode === 'bubbles') startBubbleInteraction(p.x, p.y);
  if (mode === 'sand') sandDown(p);
  if (mode === 'loop') loopDown(p.x, p.y);
  if (mode === 'plate') plateDown(p.x, p.y);
  if (mode === 'waves') wavesDown(p.x, p.y);
  if (mode === 'silk') silkDown(p);
  if (mode === 'crystal') crystalDown(p);
  if (mode === 'magnets') magnetsDown(p, e);
  soundPointerDown(p);
});
canvas.addEventListener('mousemove', e => {
  const p = getPos(e);
  mouse.x = p.x; mouse.y = p.y;
  if (mode === 'bubbles') moveDraggedBubble(p.x, p.y);
  if (mode === 'sand') sandMove(p);
  soundPointerMove();
});
window.addEventListener('mouseup', () => { mouse.down = false; draggingBubble = null; if (lifted) dropObject(mouse.x, mouse.y); });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  mouse.down = true;
  const p = getPos(e);
  mouse.x = p.x; mouse.y = p.y;
  if (mode === 'bubbles') startBubbleInteraction(p.x, p.y);
  if (mode === 'sand') sandDown(p);
  if (mode === 'loop') loopDown(p.x, p.y);
  if (mode === 'plate') plateDown(p.x, p.y);
  if (mode === 'waves') wavesDown(p.x, p.y);
  if (mode === 'silk') silkDown(p);
  if (mode === 'crystal') crystalDown(p);
  if (mode === 'magnets') magnetsDown(p, e);
  soundPointerDown(p);
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const p = getPos(e);
  mouse.x = p.x; mouse.y = p.y;
  if (mode === 'bubbles') moveDraggedBubble(p.x, p.y);
  if (mode === 'sand') sandMove(p);
  soundPointerMove();
}, {passive: false});
window.addEventListener('touchend', () => { mouse.down = false; draggingBubble = null; if (lifted) dropObject(mouse.x, mouse.y); });

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const newMode = tab.dataset.mode;
    stopBed();
    mode = newMode;
    particles = [];
    bubbles = [];
    draggingBubble = null;
    setControls();
    if (soundOn) startBed(mode);
  });
});
document.getElementById('soundToggle').onclick = () => setSound(!soundOn);
document.getElementById('linkToggle').onclick = () => setLinked(!linkedOn);
setLinked(linkedOn);

setControls();
loop();
</script>
</body>
</html>
