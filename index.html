<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tension, Waves & Sparkle Sand</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141922;
    --accent: #00d4ff;
    --text: #e6edf3;
    --muted: #8b949e;
    --border: #21262d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    background: linear-gradient(90deg, #ff6b9d, #c084fc, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .sound-btn {
    padding: 8px 16px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 20px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
  }
  .sound-btn.active { background: #c084fc; color: #000; border: 1px solid #c084fc; }
  .link-btn.active { background: var(--accent); border: 1px solid var(--accent); }
  .linked-note { font-size: 0.78rem; color: var(--muted); }
  .tab, .sound-btn { padding: 8px 10px; }
  .tabs { gap: 5px; }
  header { padding: 16px 18px; }
  .tab.active, .tab:hover {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .controls {
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    min-height: 56px;
  }
  .controls label {
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .controls input[type="range"] {
    width: 100px;
    accent-color: var(--accent);
  }
  .controls button {
    padding: 6px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
  }
  .controls button:hover, .controls button.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .palette {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch.active { border-color: white; transform: scale(1.15); }
  #canvas-container {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #05070a;
  }
  #main {
    position: absolute;
    inset: 0;
  }
  .hint {
    position: absolute;
    bottom: 16px;
    left: 24px;
    right: 24px;
    background: rgba(0,0,0,0.7);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.8rem;
    color: var(--muted);
    pointer-events: none;
  }
  .wave-graphs {
    position: absolute;
    left: 16px;
    top: 16px;
    width: min(340px, calc(100% - 32px));
    background: rgba(10,14,20,0.85);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: none;
  }
  .wave-graphs.visible { display: block; }
  .wave-graphs canvas { height: 90px; margin-bottom: 10px; background: transparent; }
  .wave-graphs h3 { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
  .wave-note { font-size: 0.72rem; color: var(--muted); line-height: 1.4; }
  .wave-note .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff6b9d; margin-right: 4px; }
  @media (max-width: 700px) { .wave-graphs { padding: 10px; } .wave-graphs canvas { height: 56px; margin-bottom: 6px; } }
  .controls.sand { gap: 8px; }
  .controls.sand input[type="range"] { width: 58px; }
  .controls.sand button { padding: 6px 11px; }
  .controls.sand label { gap: 6px; }
  .controls.sand .palette { gap: 5px; }
  .controls.sand .swatch { width: 20px; height: 20px; }
  .controls select {
    padding: 6px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .mold-box {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .controls canvas#moldIcon {
    width: 22px;
    height: 22px;
    background: transparent;
    cursor: pointer;
  }
  .palette.sets { gap: 5px; }
  .swatch.set { width: 20px; height: 20px; }
  .swatch.set.follow { outline: 1px dashed rgba(255,255,255,0.6); outline-offset: 2px; }
  .tick-label { font-size: 0.8rem; color: var(--muted); min-width: 96px; font-variant-numeric: tabular-nums; }
  .tick-label:empty { display: none; }
  .tick-label.freeze { color: #fbbf24; }
  .hint { transition: opacity 0.6s; }
  .hint.faded { opacity: 0.25; }
</style>
</head>
<body>
<header>
  <h1>Tension, Waves & Sparkle Sand</h1>
  <div class="tabs">
    <button class="tab active" data-mode="sand">1. Sparkle Kinetic Sand</button>
    <button class="tab" data-mode="loop">2. Relaxing Loop</button>
    <button class="tab" data-mode="bubbles">3. Soap Bubbles</button>
    <button class="tab" data-mode="plate">4. Sound & Sand Plate</button>
    <button class="tab" data-mode="waves">5. 1D to 2D Waves</button>
    <button class="sound-btn" id="soundToggle" title="Sound for every tab">Sound: Off</button>
    <button class="sound-btn link-btn" id="linkToggle" title="Tie size and settling into one number">Linked: On</button>
  </div>
</header>

<div class="controls" id="controls">
  <!-- Dynamic controls -->
</div>

<div id="canvas-container">
  <canvas id="main"></canvas>
  <div class="wave-graphs" id="waveGraphs">
    <h3 id="hLabel">Horizontal wave</h3>
    <canvas id="hWave" width="640" height="180"></canvas>
    <h3 id="vLabel">Vertical wave</h3>
    <canvas id="vWave" width="640" height="180"></canvas>
    <p class="wave-note"><span class="dot"></span> Nodes: points that stay still. Sand collects on the lines through them.</p>
  </div>
  <div class="hint" id="hint">Pour: click and drag to pour glitter sand.</div>
</div>

<script>
const canvas = document.getElementById('main');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const controlsDiv = document.getElementById('controls');
const waveGraphs = document.getElementById('waveGraphs');

let mode = 'sand';
let width, height;
let particles = [];
let bubbles = [];
let draggingBubble = null;
let dragOffset = { x: 0, y: 0 };
let lastDrag = { x: 0, y: 0 };
let loopParticles = [];
let mouse = { x: 0, y: 0, down: false };
let color = '#ff6b9d';
let cling = 0.7;
let size = 3;
let pouring = true;
let guideLines = true;
let surfaceTension = 0.6;
let waveN = 3;
let waveM = 4;
let frozen = false;
let hWaves = 2;
let vWaves = 3;
let loopSpeed = 0.6;
let loopDensity = 150;
let linkedOn = (() => { try { return localStorage.getItem('sparkleLinked') !== '0'; } catch (e) { return true; } })();
const LINK_NOTES = {
  loop: 'Linked: bigger gap heals faster',
  plate: 'Linked: finer pattern settles faster',
  waves: 'Linked: more nodes, pluck fades faster',
  bubbles: 'Linked: higher tension merges sooner, calms faster'
};
function applyLinkNote() {
  if (!LINK_NOTES[mode] || hint.dataset.base === undefined) return;
  hint.textContent = hint.dataset.base + (linkedOn ? ' ' + LINK_NOTES[mode] + '.' : '');
}
function linkNoteHTML() { return LINK_NOTES[mode] ? `<span class="linked-note" id="linkNote">${linkedOn ? LINK_NOTES[mode] : ''}</span>` : ''; }
function setLinked(on) {
  linkedOn = !!on;
  try { localStorage.setItem('sparkleLinked', linkedOn ? '1' : '0'); } catch (e) {}
  const b = document.getElementById('linkToggle');
  if (b) { b.textContent = linkedOn ? 'Linked: On' : 'Linked: Off'; b.classList.toggle('active', linkedOn); }
  applyLinkNote();
  const g = document.getElementById('gapVal');
  if (g) g.textContent = gapText();
}
// one number per tab; 1 = the original look
function plateK() { return linkedOn ? Math.max(plateA, plateB) / 4 : 1; }
function wavesK() { return linkedOn ? Math.max(hWaves, vWaves) / 3 : 1; }
function bubblesK() { return linkedOn ? surfaceTension / 0.6 : 1; }
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
let loopGap = 1;   // one number: ring size around the finger AND how fast things heal
let audioCtx = null;
let osc1 = null;
let osc2 = null;
let gain = null;
let soundOn = false;

const palette = [
  '#ff6b9d', '#00d4ff', '#c084fc', '#fbbf24', '#34d399',
  '#fb923c', '#f472b6', '#a78bfa', '#facc15', '#2dd4bf'
];

function resize() {
  width = canvas.width = canvas.offsetWidth * devicePixelRatio;
  height = canvas.height = canvas.offsetHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  width /= devicePixelRatio;
  height /= devicePixelRatio;
}
window.addEventListener('resize', resize);
resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('canvas-container'));

function setControls() {
  controlsDiv.innerHTML = '';
  waveGraphs.classList.remove('visible');
  hint.classList.remove('faded');
  controlsDiv.classList.toggle('sand', mode === 'sand');
  if (lifted) dropObject(mouse.x, mouse.y);
  canvas.style.cursor = '';
  ripples = [];
  
  if (mode === 'sand') {
    controlsDiv.innerHTML = `
      <button id="pourBtn" data-tool="pour">Pour</button>
      <button id="stampBtn" data-tool="stamp">Stamp</button>
      <button id="carveBtn" data-tool="carve">Carve</button>
      <button id="ledgeBtn" data-tool="ledge">Ledge</button>
      <button id="meltBtn" class="${meltOn ? 'active' : ''}" title="Layered: shapes stay separate. Melt: overlapping shapes blend.">${meltOn ? 'Melt' : 'Layered'}</button>
      <span class="mold-box"><canvas id="moldIcon" width="44" height="44"></canvas><select id="mold" title="Mold"></select></span>
      <label>Mold size <input type="range" id="moldSize" min="25" max="140" value="${moldSize}"></label>
      <label>Size <input type="range" id="size" min="1" max="8" value="${size}"></label>
      <label>Cling <input type="range" id="cling" min="0" max="1" step="0.05" value="${cling}"></label>
      <button id="guideBtn" class="${guideLines ? 'active' : ''}">Guides: ${guideLines ? 'On' : 'Off'}</button>
      <button id="clearBtn">Clear</button>
      <div class="palette" id="palette"></div>
    `;
    const pal = document.getElementById('palette');
    palette.forEach(c => {
      const s = document.createElement('div');
      s.className = 'swatch' + (c === color ? ' active' : '');
      s.style.background = c;
      s.onclick = () => {
        color = c;
        document.querySelectorAll('.swatch').forEach(el => el.classList.remove('active'));
        s.classList.add('active');
        drawMoldIcon();
      };
      pal.appendChild(s);
    });
    const sel = document.getElementById('mold');
    Object.keys(MOLDS).forEach(k => {
      const o = document.createElement('option');
      o.value = k; o.textContent = MOLDS[k].label;
      if (k === moldName) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { moldName = sel.value; drawMoldIcon(); setTool('stamp'); };
    document.getElementById('moldIcon').onclick = () => setTool('stamp');
    document.querySelectorAll('[data-tool]').forEach(btn => btn.onclick = () => setTool(btn.dataset.tool));
    document.getElementById('moldSize').oninput = e => { moldSize = +e.target.value; setTool('stamp'); };
    document.getElementById('size').oninput = e => size = +e.target.value;
    document.getElementById('cling').oninput = e => cling = +e.target.value;
    document.getElementById('guideBtn').onclick = function() {
      guideLines = !guideLines;
      this.textContent = 'Guides: ' + (guideLines ? 'On' : 'Off');
      this.classList.toggle('active', guideLines);
    };
    document.getElementById('clearBtn').onclick = clearSand;
    document.getElementById('meltBtn').onclick = () => setMelt(!meltOn);
    drawMoldIcon();
    setTool(tool);
  }
  else if (mode === 'loop') {
    hint.textContent = 'Calm on its own. Touch and drag to swirl the light around you; let go and it drifts home. Tap for a ripple. Gap sets the ring size and how fast it heals.';
    controlsDiv.innerHTML = `
      <button id="resetLoop">Reset Loop</button>
      <label>Speed <input type="range" id="loopSpeed" min="0.2" max="2" step="0.1" value="${loopSpeed}"></label>
      <label>Density <input type="range" id="loopDensity" min="50" max="400" value="${loopDensity}"></label>
      <label title="Bigger gap heals faster: one number sets both">Gap <input type="range" id="loopGap" min="0.5" max="2" step="0.1" value="${loopGap}"> <span id="gapVal">${gapText()}</span></label>
      <button id="trailsBtn" class="${loopTrails ? 'active' : ''}">Trails: ${loopTrails ? 'On' : 'Off'}</button>
      ${colorControlsHTML()}
    `;
    setupColorControls('loop');
    document.getElementById('resetLoop').onclick = initLoop;
    document.getElementById('loopSpeed').oninput = e => loopSpeed = +e.target.value;
    document.getElementById('loopDensity').oninput = e => { loopDensity = +e.target.value; initLoop(); };
    document.getElementById('loopGap').oninput = e => { loopGap = +e.target.value; document.getElementById('gapVal').textContent = gapText(); };
    document.getElementById('trailsBtn').onclick = function() {
      loopTrails = !loopTrails;
      this.textContent = 'Trails: ' + (loopTrails ? 'On' : 'Off');
      this.classList.toggle('active', loopTrails);
    };
    initLoop();
  }
  else if (mode === 'bubbles') {
    hint.textContent = 'Click empty space to blow a bubble. Click and drag a bubble to move it; bring bubbles close to merge them.';
    controlsDiv.innerHTML = `
      <button id="blowBtn">+ Blow Bubble</button>
      <button id="jiggleBtn">Jiggle All</button>
      <button id="popBtn">Pop All</button>
      <label>Surface Tension <input type="range" id="tension" min="0.2" max="1" step="0.05" value="${surfaceTension}"></label>
      ${colorControlsHTML()}
    `;
    setupColorControls('bubbles');
    document.getElementById('blowBtn').onclick = () => blowBubble(width/2, height/2);
    document.getElementById('jiggleBtn').onclick = jiggleBubbles;
    document.getElementById('popBtn').onclick = () => bubbles = [];
    document.getElementById('tension').oninput = e => surfaceTension = +e.target.value;
  }
  else if (mode === 'plate') {
    hint.textContent = 'Sand jumps off the shaking parts and gathers on the still lines. Change Wave N and M for a new figure. Drag to stir, tap to shake.';
    controlsDiv.innerHTML = `
      <label>Wave N <input type="range" id="wn" min="1" max="12" value="${waveN}"></label>
      <label>Wave M <input type="range" id="wm" min="1" max="12" value="${waveM}"></label>
      <button id="scatterBtn">Scatter Sand</button>
      <button id="freezeBtn">${frozen ? 'Resume' : 'Freeze'}</button>
      <button id="soundBtn">${soundOn ? 'Sound: On' : 'Sound: Off'}</button>
      <button id="linesBtn" class="${plateLines ? 'active' : ''}">Lines: ${plateLines ? 'On' : 'Off'}</button>
      ${colorControlsHTML()}
    `;
    setupColorControls('plate');
    document.getElementById('wn').oninput = e => { waveN = +e.target.value; plateBoost = 1; updateSound(); };
    document.getElementById('wm').oninput = e => { waveM = +e.target.value; plateBoost = 1; updateSound(); };
    document.getElementById('scatterBtn').onclick = scatterPlate;
    document.getElementById('freezeBtn').onclick = function() {
      frozen = !frozen;
      this.textContent = frozen ? 'Resume' : 'Freeze';
    };
    document.getElementById('soundBtn').onclick = () => setSound(!soundOn);
    document.getElementById('soundBtn').classList.toggle('active', soundOn);
    document.getElementById('linesBtn').onclick = function() {
      plateLines = !plateLines;
      this.textContent = 'Lines: ' + (plateLines ? 'On' : 'Off');
      this.classList.toggle('active', plateLines);
    };
    scatterPlate();
  }
  else if (mode === 'waves') {
    hint.textContent = 'Each 1D wave has still points (the dots). Where they cross, sand gathers into the 2D pattern. Tap the field to pluck, drag to stir.';
    waveGraphs.classList.add('visible');
    controlsDiv.innerHTML = `
      <label>Horizontal Waves <input type="range" id="hw" min="1" max="8" value="${hWaves}"></label>
      <label>Vertical Waves <input type="range" id="vw" min="1" max="8" value="${vWaves}"></label>
      <button id="resetWaves">Reset Sand</button>
      ${colorControlsHTML()}
    `;
    setupColorControls('waves');
    document.getElementById('hw').oninput = e => { hWaves = +e.target.value; reshakeWaves(); };
    document.getElementById('vw').oninput = e => { vWaves = +e.target.value; reshakeWaves(); };
    document.getElementById('resetWaves').onclick = resetWaveParticles;
    resetWaveParticles();
  }
  hint.dataset.base = hint.textContent;
  applyLinkNote();
}

const TOOL_HINTS = {
  pour: 'Pour: click and drag to pour glitter sand. Cling sets how steep it piles.',
  stamp: 'Stamp: click empty space to stamp the mold. Drag a placed shape or ledge to move it.',
  carve: 'Carve: drag through sand to dig it out. Size sets the brush.',
  ledge: 'Ledge: drag to draw a ledge. Sand lands and piles on it. Use Stamp to move a ledge.'
};

function setTool(t) {
  tool = t;
  pouring = t === 'pour';
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  if (mode === 'sand') {
    hint.textContent = TOOL_HINTS[t];
    hint.classList.remove('faded');
  }
}

// ========== SAND MODE ==========
const CELL = 3;               // grain size in px (one grid cell)
const MAX_FLYING = 5000;      // cap on grains in the air
const EMPTY = 0, LOOSE = 1, LEDGE = 2, STAMP = 3;
let tool = 'pour';
let moldName = 'star';
let moldSize = 60;
let gCols = 0, gRows = 0;
let gType = null, gColor = null, gSticky = null, gPhase = null;
let flying = [];
let sandFrame = 0;
let lastPt = null;
const sandBuf = document.createElement('canvas');
const sandBufCtx = sandBuf.getContext('2d');
let sandImg = null, sandPix = null;
const rgbCache = {};

function hexRgb(h) {
  if (!rgbCache[h]) {
    const n = parseInt(h.slice(1), 16);
    rgbCache[h] = [n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  return rgbCache[h];
}

// Pack a grain color (ABGR for ImageData) with a little natural variation
function grainColor(hex, kind) {
  let [r, g, b] = hexRgb(hex);
  // a few fixed shade steps keep the number of grain sprites small
  let k = 0.8 + ((Math.random() * 6) | 0) * 0.06;
  if (Math.random() < 0.07) k = 1.2;
  if (kind === 'inner') k *= 0.88;
  r *= k; g *= k; b *= k;
  if (kind === 'edge') {
    const w = 0.44;
    r = r + (255 - r) * w; g = g + (255 - g) * w; b = b + (255 - b) * w;
  }
  r = Math.min(255, r | 0); g = Math.min(255, g | 0); b = Math.min(255, b | 0);
  return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
}

function initSandGrid() {
  const nc = Math.max(1, Math.floor(width / CELL));
  const nr = Math.max(1, Math.floor(height / CELL));
  if (gType && nc === gCols && nr === gRows) return;
  const t = new Uint8Array(nc * nr), c = new Uint32Array(nc * nr);
  const s = new Uint8Array(nc * nr), ph = new Uint16Array(nc * nr), ow = new Uint32Array(nc * nr);
  for (let i = 0; i < ph.length; i++) ph[i] = (Math.random() * 1024) | 0;
  if (gType) {
    const dy = nr - gRows; // keep the floor where it is
    for (let y = 0; y < gRows; y++) {
      const ny = y + dy;
      if (ny < 0 || ny >= nr) continue;
      for (let x = 0; x < Math.min(gCols, nc); x++) {
        const o = y * gCols + x, n = ny * nc + x;
        t[n] = gType[o]; c[n] = gColor[o]; s[n] = gSticky[o]; ow[n] = gOwner ? gOwner[o] : 0;
      }
    }
    for (const p of flying) p.y += dy * CELL;
  }
  gType = t; gColor = c; gSticky = s; gPhase = ph; gOwner = ow; gCols = nc; gRows = nr;
  sandBuf.width = nc; sandBuf.height = nr;
  sandImg = sandBufCtx.createImageData(nc, nr);
  sandPix = new Uint32Array(sandImg.data.buffer);
}

function clearSand() {
  flying = [];
  if (gType) { gType.fill(0); gOwner.fill(0); }
  lifted = null;
}

// ---------- Moving placed stamps and ledges ----------
// Every stamp and every ledge stroke gets an id stored per grid cell (gOwner).
// With the Stamp tool, pressing on a placed piece lifts it; releasing sets it down.
let gOwner = null;
let nextObjId = 1, curLedgeId = 0;
let lifted = null;
const LIFT_PAD = 10;

function objectAt(px, py) {
  if (!gOwner) return 0;
  const cx = Math.floor(px / CELL), cy = Math.floor(py / CELL), R = 4;
  let best = 0, bd = 1e9;
  for (let y = cy - R; y <= cy + R; y++) {
    if (y < 0 || y >= gRows) continue;
    for (let x = cx - R; x <= cx + R; x++) {
      if (x < 0 || x >= gCols) continue;
      const i = y * gCols + x, id = gOwner[i];
      if (!id || (gType[i] !== STAMP && gType[i] !== LEDGE)) continue;
      const d = (x - cx) * (x - cx) + (y - cy) * (y - cy);
      if (d < bd) { bd = d; best = id; }
    }
  }
  return best;
}

function pieceCells(id) {
  const out = [];
  let seedType = 0;
  for (let i = 0; i < gOwner.length; i++) {
    if (gOwner[i] !== id || (gType[i] !== STAMP && gType[i] !== LEDGE)) continue;
    out.push(i); seedType = gType[i];
  }
  if (!meltOn || seedType !== STAMP) return out;

function dropObject(px, py) {

  // keep the whole piece on the canvas

  dy = Math.max(-L.miny, Math.min(gRows - 1 - L.maxy, dy));

function drawLifted() {

  ctx.drawImage(L.img, x, y, L.wCss, L.hCss);

}

// ---------- Matte molds + Melt ----------

// Poured sand: soft and calm. Color is half its own, half the 3x3 average (low contrast),

// palette tone for poured sand: close to the molds, a touch brighter, small grain to grain change

// Melt: a gap of up to about 14 cells between two different shapes fills in, like sand settling into the seam

  pc.width = pc.height = S;

  matteBuf.width = gCols; matteBuf.height = gRows;
  matteBufCtx = matteBuf.getContext('2d');

    for (let x = 0; x < C; x++, i++) {

function renderPiece(cells, minx, miny, maxx, maxy, pad) {

function setMelt(on) {
  if (lifted) dropObject(mouse.x, mouse.y);

  try { localStorage.setItem('sparkleMelt', on ? '1' : '0'); } catch (e) {}
  if (pMT) pMT.fill(255);   // reshade every mold; the shapes themselves are untouched
  const b = document.getElementById('meltBtn');
  if (b) { b.textContent = on ? 'Melt' : 'Layered'; b.classList.toggle('active', on); }
  if (mode === 'sand') {
    hint.textContent = on ? 'Melt: overlapping shapes blend into one pile and move together.'
                          : 'Layered: each shape keeps its own edge and moves on its own.';
    hint.classList.remove('faded');

// ---------- Molds ----------

// Each mold draws itself in a -1..1 box (y down)
const MOLDS = {
  star: { label: 'Star', draw: g => poly(g, starPts(5, 1, 0.43, 0.1)) },
  heart: { label: 'Heart', draw: g => {
    const pts = [];
    for (let i = 0; i < 80; i++) {
      const t = i / 80 * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      pts.push([x / 16.5, y / 16.5 - 0.15]);
    }
    poly(g, pts);
  } },
  circle: { label: 'Circle', draw: g => disc(g, 0, 0, 0.95) },
  square: { label: 'Square', draw: g => { g.beginPath(); g.roundRect(-0.85, -0.85, 1.7, 1.7, 0.1); g.fill(); } },
  triangle: { label: 'Triangle', draw: g => poly(g, [[0, -0.92], [0.98, 0.8], [-0.98, 0.8]]) },
  moon: { label: 'Moon', draw: g => {
    disc(g, -0.05, 0, 0.95);
    cut(g, () => disc(g, 0.4, -0.25, 0.78));
  } },
  flower: { label: 'Flower', draw: g => {

const moldCanvas = document.createElement('canvas');
const moldCtx = moldCanvas.getContext('2d', { willReadFrequently: true });
const maskCache = {};

function moldMask(name, n) {
  const key = name + ':' + n;
  if (maskCache[key]) return maskCache[key];
  moldCanvas.width = n; moldCanvas.height = n;
  const g = moldCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, n, n);
  g.globalCompositeOperation = 'source-over';
  const s = n / 2;
  g.setTransform(s, 0, 0, s, s, s);
  g.fillStyle = '#fff'; g.strokeStyle = '#fff';
  MOLDS[name].draw(g);
  const d = g.getImageData(0, 0, n, n).data;
  const m = new Uint8Array(n * n);
  for (let i = 0; i < n * n; i++) m[i] = d[i * 4 + 3] > 120 ? 1 : 0;
  maskCache[key] = m;
  return m;
}

function drawMoldIcon() {
  const ic = document.getElementById('moldIcon');
  if (!ic) return;
  const g = ic.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, ic.width, ic.height);
  const s = ic.width / 2;
  g.setTransform(s * 0.9, 0, 0, s * 0.9, s, s);
  g.fillStyle = color; g.strokeStyle = color;
  g.globalCompositeOperation = 'source-over';
  MOLDS[moldName].draw(g);
  g.globalCompositeOperation = 'source-over';
}

function stampMold(px, py) {
  initSandGrid();
  const n = Math.max(8, Math.round(2 * moldSize / CELL));
  const m = moldMask(moldName, n);
  const x0 = Math.round(px / CELL - n / 2), y0 = Math.round(py / CELL - n / 2);
  const id = nextObjId++, mc = moldColor(color);
  for (let y = 0; y < n; y++) {
    const gy = y0 + y;
    if (gy < 0 || gy >= gRows) continue;
    for (let x = 0; x < n; x++) {
      if (!m[y * n + x]) continue;
      const gx = x0 + x;
      if (gx < 0 || gx >= gCols) continue;
      const i = gy * gCols + gx;
      if (gType[i] === LEDGE) continue;
      gType[i] = STAMP;
      gOwner[i] = id;
      gColor[i] = mc;
    }
  }
}

// ---------- Pour / carve / ledge ----------
function pourSand() {
  if (!mouse.down || tool !== 'pour') return;
  const spread = 4 + size * 3;
  const n = 3 + Math.round(size * 1.5);
  for (let k = 0; k < n && flying.length < MAX_FLYING; k++) {
    flying.push({
      x: mouse.x + (Math.random() - 0.5) * spread,
      y: mouse.y + (Math.random() - 0.5) * spread * 0.5,
      vx: (Math.random() - 0.5) * 1.2,
      vy: Math.random() * 1.5 + 0.5,
      c: pourColor(color)
    });
  }
}

function eachOnSegment(a, b, stepLen, fn) {
  const d = Math.hypot(b.x - a.x, b.y - a.y);
  const steps = Math.max(1, Math.ceil(d / stepLen));
  for (let s = 0; s <= steps; s++) {
    const t = s / steps;
    fn(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
  }
}

function carveAt(px, py) {
  const r = (6 + size * 4) / CELL;
  const cx = px / CELL, cy = py / CELL;
  for (let gy = Math.floor(cy - r); gy <= Math.ceil(cy + r); gy++) {
    if (gy < 0 || gy >= gRows) continue;
    for (let gx = Math.floor(cx - r); gx <= Math.ceil(cx + r); gx++) {
      if (gx < 0 || gx >= gCols) continue;
      const dx = gx + 0.5 - cx, dy = gy + 0.5 - cy;
      const d2 = dx * dx + dy * dy;
      if (d2 > r * r) continue;
      const i = gy * gCols + gx;
      const t = gType[i];
      if (t !== LOOSE && t !== STAMP) continue;
      gType[i] = EMPTY;
      gOwner[i] = 0;
      // push some grains out to the sides of the brush
      if (Math.random() < 0.3 && flying.length < MAX_FLYING) {
        const d = Math.sqrt(d2) || 1;
        flying.push({
          x: (gx + 0.5) * CELL, y: (gy + 0.5) * CELL,
          vx: dx / d * (1.5 + Math.random() * 2),
          vy: dy / d * (1.5 + Math.random() * 2) - 1.5,
          c: gColor[i]
        });
      }
    }
  }
}

function ledgeAt(px, py) {
  const w = 1 + Math.floor(size / 3);
  const gx0 = Math.round(px / CELL - w / 2), gy0 = Math.round(py / CELL - w / 2);
  for (let gy = gy0; gy < gy0 + w; gy++) {
    if (gy < 0 || gy >= gRows) continue;
    for (let gx = gx0; gx < gx0 + w; gx++) {
      if (gx < 0 || gx >= gCols) continue;
      const i = gy * gCols + gx;
      if (gType[i] === LEDGE) continue;
      gType[i] = LEDGE;
      gOwner[i] = curLedgeId;
      gColor[i] = ((255 << 24) | (176 << 16) | (184 << 8) | 196) >>> 0;
    }
  }
}

function sandDown(p) {
  initSandGrid();
  hint.classList.add('faded');
  lastPt = { x: p.x, y: p.y };
  if (lifted) dropObject(p.x, p.y);
  if (tool === 'stamp') {
    // press on a placed shape or ledge to pick it up; press on empty space to stamp
    const id = objectAt(p.x, p.y);
    if (!(id && liftObject(id, p.x, p.y))) stampMold(p.x, p.y);
  }
  else if (tool === 'carve') carveAt(p.x, p.y);
  else if (tool === 'ledge') { curLedgeId = nextObjId++; ledgeAt(p.x, p.y); }
}

function sandMove(p) {
  if (!mouse.down) sandHover(p);
  if (!mouse.down || !lastPt || lifted) return;
  if (tool === 'carve') eachOnSegment(lastPt, p, (6 + size * 4) * 0.5, carveAt);
  else if (tool === 'ledge') eachOnSegment(lastPt, p, CELL * 0.7, ledgeAt);
  lastPt = { x: p.x, y: p.y };
}

// ---------- Physics ----------
function settleGrain(p) {
  let cx = Math.min(gCols - 1, Math.max(0, (p.x / CELL) | 0));
  let cy = Math.min(gRows - 1, Math.floor(p.y / CELL));
  if (cy < 0) return;
  // if a settled grain slipped into this spot, sit just above it (never climb far)
  const lim = cy - 2;
  while (cy >= 0 && cy >= lim && gType[cy * gCols + cx] !== EMPTY) cy--;
  if (cy < 0 || cy < lim) return;
  const i = cy * gCols + cx;
  gType[i] = LOOSE;
  gColor[i] = p.c;
  gSticky[i] = Math.random() < cling ? 1 : 0;
}

function updateFlying() {
  const G = 0.25, maxV = 9, W = gCols * CELL - 0.01;
  const keep = [];
  for (const p of flying) {
    p.vy = Math.min(p.vy + G, maxV);
    p.vx *= 0.985;
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(p.vx), Math.abs(p.vy)) / (CELL * 0.8)));
    let landed = false;
    for (let s = 0; s < steps; s++) {
      let nx = p.x + p.vx / steps, ny = p.y + p.vy / steps;
      if (nx < 0) { nx = 0; p.vx = Math.abs(p.vx) * 0.4; }
      else if (nx > W) { nx = W; p.vx = -Math.abs(p.vx) * 0.4; }
      const cx = (nx / CELL) | 0, cy = Math.floor(ny / CELL);
      if (cy >= gRows) { landed = true; break; }
      if (cy >= 0 && gType[cy * gCols + cx] !== EMPTY) {
        const ox = (p.x / CELL) | 0;
        // side hit while falling: drop straight instead
        if (cx !== ox && gType[cy * gCols + ox] === EMPTY && p.vy > 0) {
          p.vx *= -0.3; p.y = ny; continue;
        }
        if (p.vy < 0) { p.vy = 0; p.vx *= 0.5; continue; }
        landed = true; break;
      }
      p.x = nx; p.y = ny;
    }
    if (landed) settleGrain(p); else keep.push(p);
  }
  flying = keep;
}

// Settled grains: fall if unsupported, slide down diagonally unless they cling
function updateGrid() {
  const C = gCols, R = gRows, T = gType, S = gSticky, Col = gColor;
  const flip = sandFrame & 1;
  for (let y = R - 2; y >= 0; y--) {
    const row = y * C, below = row + C;
    for (let k = 0; k < C; k++) {
      const x = flip ? k : C - 1 - k;
      const i = row + x;
      if (T[i] !== LOOSE) continue;
      if (T[below + x] === EMPTY) {
        // long drops become falling grains; one-cell drops stay in the grid
        if (y + 2 < R && T[below + C + x] === EMPTY && flying.length < MAX_FLYING * 2) {
          flying.push({ x: (x + 0.5) * CELL, y: (y + 0.5) * CELL, vx: 0, vy: 1, c: Col[i] });
          T[i] = EMPTY;
        } else {
          T[below + x] = LOOSE; Col[below + x] = Col[i]; S[below + x] = S[i]; T[i] = EMPTY;
        }
        continue;
      }
      const dl = x > 0 ? T[below + x - 1] !== EMPTY : true;
      const dr = x < C - 1 ? T[below + x + 1] !== EMPTY : true;
      if (dl && dr) continue;
      let dir;
      if (!dl && !dr) dir = Math.random() < 0.5 ? -1 : 1;
      else dir = dl ? 1 : -1;
      if (T[i + dir] !== EMPTY) continue;
      // clingy grains hold on unless the drop on that side is steep
      if (S[i]) {
        const two = below + C + x + dir;
        if (y + 2 >= R || T[two] !== EMPTY) continue;
      }
      const j = below + x + dir;
      T[j] = LOOSE; Col[j] = Col[i]; S[j] = S[i]; T[i] = EMPTY;
    }
  }
}

function updateSand() {
  initSandGrid();
  sandFrame++;
  pourSand();
  updateFlying();
  updateGrid();
  sandFrame++;
  updateGrid();
}

function drawSand() {
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, width, height);

  if (guideLines) {
    ctx.strokeStyle = 'rgba(0,212,255,0.15)';
    ctx.lineWidth = 1;
    for (let x = 0; x < width; x += 50) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
    }
    for (let y = 0; y < height; y += 50) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
    }
    ctx.beginPath();
    for (let r = 50; r < Math.max(width, height); r += 50) {
      ctx.moveTo(width / 2 + r, height / 2);
      ctx.arc(width / 2, height / 2, r, 0, Math.PI * 2);
    }
    ctx.stroke();
  }
  if (!gType) return;

  // Settled grains live on a cached full-resolution layer; only tiles that changed get redrawn.
  const T = gType, Col = gColor, ph = gPhase, f = sandFrame, C = gCols, R = gRows;
  const atlas = sandAtlas();
  ensureSandLayer();
  const glints = [];
  const pT = prevT, pC = prevC, TD = tileDirty, TX = tilesX;
  for (let y = 0; y < R; y++) {
    const ty = (y / TILE) | 0, ly = y - ty * TILE;
    for (let x = 0, i = y * C; x < C; x++, i++) {
      const t = T[i];
      if (t !== pT[i] || (t !== EMPTY && Col[i] !== pC[i])) {
        pT[i] = t; pC[i] = Col[i];
        const tx = (x / TILE) | 0, lx = x - tx * TILE;
        // dots spill a little into the neighbor cells, so mark bordering tiles too
        const x0 = lx === 0 && tx > 0 ? tx - 1 : tx, x1 = lx === TILE - 1 && tx < TX - 1 ? tx + 1 : tx;
        const y0 = ly === 0 && ty > 0 ? ty - 1 : ty, y1 = ly === TILE - 1 && ty < tilesY - 1 ? ty + 1 : ty;
        for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) TD[yy * TX + xx] = 1;
      }
      if (t === LOOSE && (ph[i] & 3) === 0 && glints.length < 90) {
        const a = (ph[i] * 4 + (f >> 1)) & 4095;
        if (a < GLINT_LEN) glints.push(grainX(i, t), grainY(i, t), a);
      }
    }
  }
  const lc = layerCtx;
  for (let k = 0; k < TD.length; k++) {
    if (!TD[k]) continue;
    TD[k] = 0;
    const tx = k % TX, ty = (k / TX) | 0;
    const px = tx * TILE * CELL, py = ty * TILE * CELL, pw = TILE * CELL;
    lc.save();
    lc.beginPath(); lc.rect(px, py, pw, pw); lc.clip();
    lc.clearRect(px, py, pw, pw);
    const xs = Math.max(0, tx * TILE - 1), xe = Math.min(C - 1, tx * TILE + TILE);
    const ys = Math.max(0, ty * TILE - 1), ye = Math.min(R - 1, ty * TILE + TILE);
    for (let y = ys; y <= ye; y++) {
      for (let x = xs, i = y * C + xs; x <= xe; x++, i++) {
        const t = T[i];
      }
    }
    lc.restore();
  }
  updateMatteLayer();
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(matteLayer, 0, 0, C * CELL, R * CELL);
  drawLifted();
  const SP = SPR_PX;
  for (const p of flying) {
    const idx = grainSprite(p.c);
    ctx.drawImage(atlas, (idx % SPR_COLS) * SP, ((idx / SPR_COLS) | 0) * SP, SP, SP,
      p.x - SPR_CSS / 2, p.y - SPR_CSS / 2, SPR_CSS, SPR_CSS);
  }

  // soft twinkling sparkles, added light
  if (glints.length) {
    const spk = sparkleSprite();
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < glints.length; k += 3) {
      const a = glints[k + 2] / GLINT_LEN;
      const tw = Math.sin(a * Math.PI);           // fade in and out
      const s = SPARK_CSS * (0.55 + 0.45 * tw);
      ctx.globalAlpha = tw * 0.5;
      ctx.drawImage(spk, glints[k] - s / 2, glints[k + 1] - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ---------- grain + sparkle sprites (drawn once per color at full screen resolution) ----------
const SPR_CSS = 5, SPR_COLS = 32, SPARK_CSS = 9, GLINT_LEN = 110;
let SPR_PX = 0, sprDpr = 0, sprAtlas = null, sprCtx = null, sprNext = 0, sparkCanvas = null;
const sprMap = new Map();

function resetSprites() {
  sprDpr = window.devicePixelRatio || 1;
  SPR_PX = Math.ceil(SPR_CSS * sprDpr);
  sprAtlas = document.createElement('canvas');
  sprAtlas.width = sprAtlas.height = SPR_COLS * SPR_PX;
  sprCtx = sprAtlas.getContext('2d');
  sprMap.clear(); sprNext = 0;
  sparkCanvas = null;
  if (prevT) prevT.fill(255); // sprites moved: redraw the whole layer
}
function sandAtlas() {
  if (!sprAtlas || sprDpr !== (window.devicePixelRatio || 1)) resetSprites();
  return sprAtlas;
}
function grainSprite(u32) {
  let idx = sprMap.get(u32);
  if (idx !== undefined) return idx;
  if (sprNext >= SPR_COLS * SPR_COLS) { resetSprites(); }
  idx = sprNext++;
  const sx = (idx % SPR_COLS) * SPR_PX, sy = ((idx / SPR_COLS) | 0) * SPR_PX;
  const r = u32 & 255, g = (u32 >> 8) & 255, b = (u32 >> 16) & 255;

  grad.addColorStop(0, `rgb(${hi(r)},${hi(g)},${hi(b)})`);
  grad.addColorStop(0.4, `rgb(${r},${g},${b})`);
  grad.addColorStop(0.82, `rgb(${lo(r)},${lo(g)},${lo(b)})`);
  grad.addColorStop(1, `rgba(${lo(r)},${lo(g)},${lo(b)},0)`);
  sprCtx.fillStyle = grad;
  sprCtx.beginPath(); sprCtx.arc(cx, cy, rr, 0, Math.PI * 2); sprCtx.fill();

}
function sparkleSprite() {
  if (sparkCanvas) return sparkCanvas;
  const d = window.devicePixelRatio || 1, S = Math.ceil(SPARK_CSS * d), h = S / 2;
  sparkCanvas = document.createElement('canvas');
  sparkCanvas.width = sparkCanvas.height = S;
  const c = sparkCanvas.getContext('2d');
  const glow = c.createRadialGradient(h, h, 0, h, h, h * 0.55);
  glow.addColorStop(0, 'rgba(255,255,255,0.9)');
  glow.addColorStop(0.3, 'rgba(255,250,235,0.35)');
  glow.addColorStop(1, 'rgba(255,250,235,0)');
  c.fillStyle = glow; c.fillRect(0, 0, S, S);

  c.translate(h, h);
  for (let k = 0; k < 2; k++) {
    const beam = c.createLinearGradient(-h, 0, h, 0);
    beam.addColorStop(0, 'rgba(255,255,255,0)');
    beam.addColorStop(0.5, 'rgba(255,255,255,0.95)');
    beam.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = beam;
    c.beginPath();
    c.moveTo(-h, 0); c.quadraticCurveTo(0, -h * 0.07, h, 0); c.quadraticCurveTo(0, h * 0.07, -h, 0);
    c.fill();
    c.rotate(Math.PI / 2);
  }

}

// ---------- cached layer for settled grains ----------
const TILE = 16;
let sandLayer = null, layerCtx = null, prevT = null, prevC = null, tileDirty = null, tilesX = 0, tilesY = 0, layerDpr = 0;

function ensureSandLayer() {
  const d = window.devicePixelRatio || 1;
  if (sandLayer && prevT && prevT.length === gType.length && layerDpr === d && sandLayer._c === gCols) return;
  layerDpr = d;
  sandLayer = document.createElement('canvas');
  sandLayer.width = Math.round(gCols * CELL * d);
  sandLayer.height = Math.round(gRows * CELL * d);
  sandLayer._c = gCols;
  layerCtx = sandLayer.getContext('2d');
  layerCtx.setTransform(d, 0, 0, d, 0, 0);
  layerCtx.imageSmoothingEnabled = true;
  prevT = new Uint8Array(gType.length).fill(255);
  prevC = new Uint32Array(gType.length);
  tilesX = Math.ceil(gCols / TILE); tilesY = Math.ceil(gRows / TILE);
  tileDirty = new Uint8Array(tilesX * tilesY);
}

function grainX(i, t) {
  const x = (i % gCols + 0.5) * CELL;
  return t === LOOSE ? x + ((gPhase[i] & 15) / 15 - 0.5) * 1.3 : x;
}
function grainY(i, t) {
  const y = ((i / gCols) | 0) * CELL + CELL * 0.5;
  return t === LOOSE ? y + (((gPhase[i] >> 4) & 15) / 15 - 0.5) * 1.1 : y;
}
function drawGrainOn(c, atlas, i, t, col) {
  const idx = grainSprite(col);
  // loose sand: sub-cell jitter and size variation so piles don't look like a grid; stamps stay crisp
  const dw = t === LOOSE ? SPR_CSS * (0.86 + ((gPhase[i] >> 8) & 3) * 0.08) : SPR_CSS;
  c.drawImage(atlas, (idx % SPR_COLS) * SPR_PX, ((idx / SPR_COLS) | 0) * SPR_PX, SPR_PX, SPR_PX,
    grainX(i, t) - dw / 2, grainY(i, t) - dw / 2, dw, dw);
}

// ========== BUBBLES ==========
function blowBubble(x, y) {
  const r = 25 + Math.random() * 40;
  bubbles.push({
    x, y, r,
    vx: (Math.random()-0.5)*2,
    vy: (Math.random()-0.5)*2,
    hue: Math.random()*360,
    k: Math.random()
  });
}

function findBubbleAt(x, y) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (Math.hypot(x - b.x, y - b.y) <= b.r) return b;
  }
  return null;
}

function startBubbleInteraction(x, y) {
  const hit = findBubbleAt(x, y);
  if (hit) {
    draggingBubble = hit;
    dragOffset.x = hit.x - x;
    dragOffset.y = hit.y - y;
    lastDrag.x = x; lastDrag.y = y;
    hit.vx = 0; hit.vy = 0;
  } else {
    blowBubble(x, y);
  }
}

function moveDraggedBubble(x, y) {
  if (!draggingBubble) return;
  if (!bubbles.includes(draggingBubble)) { draggingBubble = null; return; }
  draggingBubble.x = x + dragOffset.x;
  draggingBubble.y = y + dragOffset.y;
  draggingBubble.vx = (x - lastDrag.x) * 0.5;
  draggingBubble.vy = (y - lastDrag.y) * 0.5;
  lastDrag.x = x; lastDrag.y = y;
}

function jiggleBubbles() {
  for (let b of bubbles) {
    b.vx += (Math.random()-0.5)*4;
    b.vy += (Math.random()-0.5)*4;
  }
}

function updateBubbles() {
  for (let i = 0; i < bubbles.length; i++) {
    const b = bubbles[i];
    if (b !== draggingBubble) {
      b.x += b.vx;
      b.y += b.vy;
    }
    const keepB = clampN(1 - 0.02 * bubblesK(), 0.95, 0.995);
    b.vx *= keepB;
    b.vy *= keepB;
    
    // bounce walls
    if (b.x - b.r < 0 || b.x + b.r > width) b.vx *= -0.8;
    if (b.y - b.r < 0 || b.y + b.r > height) b.vy *= -0.8;
    b.x = Math.max(b.r, Math.min(width - b.r, b.x));
    b.y = Math.max(b.r, Math.min(height - b.r, b.y));
    
    // merge
    for (let j = i+1; j < bubbles.length; j++) {
      const o = bubbles[j];
      const dx = o.x - b.x;
      const dy = o.y - b.y;
      const dist = Math.hypot(dx, dy);
      if (dist < (b.r + o.r) * surfaceTension) {
        // merge into larger
        const newR = Math.sqrt(b.r*b.r + o.r*o.r);
        b.x = (b.x * b.r + o.x * o.r) / (b.r + o.r);
        b.y = (b.y * b.r + o.y * o.r) / (b.r + o.r);
        b.r = newR;
        b.vx = (b.vx + o.vx) / 2;
        b.vy = (b.vy + o.vy) / 2;
        if (o === draggingBubble) draggingBubble = b;
        bubbles.splice(j, 1);
        j--;
      }
    }
  }
}

function drawBubbles() {
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, width, height);
  
  const bubCols = tabColorList('bubbles');
  const bubSplit = followSplitting('bubbles');
  const bft = followTick();
  for (let b of bubbles) {
    let bdx = 0, fc = null;
    if (bubSplit) {
      // overlap: bubbles touching another bubble
      const touching = bubbles.some(o => o !== b && Math.hypot(o.x - b.x, o.y - b.y) < o.r + b.r + 6);
      const nb = bubCols.length;
      if (b.k === undefined) b.k = Math.random();
      const st = followStyle(tabRGB('bubbles', Math.floor(b.k * nb) / nb), touching, bft);
      fc = st.c; bdx = st.dx;
    }
    ctx.save();
    ctx.translate(bdx, 0);
    const g = ctx.createRadialGradient(b.x - b.r*0.3, b.y - b.r*0.3, 0, b.x, b.y, b.r);
    g.addColorStop(0, 'rgba(255,255,255,0.6)');
    if (bubCols) {
      if (b.k === undefined) b.k = Math.random();
      const nb = tabColorList('bubbles').length;
      const c = fc || tabRGB('bubbles', Math.floor(b.k * nb) / nb);
      g.addColorStop(0.3, rgbStr(c, 0.53));
      g.addColorStop(1, rgbStr(c, 0.13));
    } else {
      g.addColorStop(0.3, `hsla(${b.hue}, 60%, 50%, 0.53)`);
      g.addColorStop(1, `hsla(${b.hue}, 60%, 50%, 0.13)`);
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
}

// Active color list for a tab, or null when it should draw exactly as before

function hexToRgb(h) {

}

// Color at position f (0..1) along the tab's list, blended, moving over time if Shift is on
function tabRGB(tab, f) {

  let x = f * n + (st.set === 'follow' ? Date.now() * 0.001 * 0.6 : st.shift ? Date.now() * 0.001 * SHIFT_RATE : 0);
  x = ((x % n) + n) % n;
  const i = Math.floor(x), k = x - i;
  const a = hexToRgbCached(list[i]), b = hexToRgbCached(list[(i + 1) % n]);

const _rgbC = {};
function hexToRgbCached(h) { return _rgbC[h] || (_rgbC[h] = hexToRgb(h)); }
function rgbStr(c, a) { return a === undefined ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function rgbTriplet(c) { return `${c[0]},${c[1]},${c[2]}`; }
function lighten(c, w) { return [c[0] + (255 - c[0]) * w | 0, c[1] + (255 - c[1]) * w | 0, c[2] + (255 - c[2]) * w | 0]; }

// Draw grains split into groups, one color per group (used when a color set is active)
function drawGrainsTab(list, tab, sz, glow) {

// ---------- "Follow my work": a never-ending write / freeze cycle ----------
// 24 ticks per cycle. Ticks 1-22 write (bright colors flow). Tick 23 is the freeze:
// motion holds, the overlapping part turns gold (the user's bucket) and the rest turns
// deep blue and drifts left (the never-ending bucket). Tick 24 filters through soft white.
const FOLLOW_TICKS = 24, FOLLOW_MS = 400, FOLLOW_FREEZE = 23;
const FOLLOW_WRITE = ['#22d3ee', '#f472b6', '#a3e635', '#fde047', '#c084fc'];
const FOLLOW_GOLD = [251, 191, 36], FOLLOW_BLUE = [76, 58, 210], FOLLOW_WHITE = [241, 245, 249];
const FOLLOW_DRIFT = 60;

function isFollow(tab) { return colorState[tab] && colorState[tab].set === 'follow'; }
function followTick() {
  const t = Date.now() / FOLLOW_MS, n = Math.floor(t);
  return { tick: n % FOLLOW_TICKS + 1, frac: t - n };
}
function followHolding(tab) { return isFollow(tab) && followTick().tick === FOLLOW_FREEZE; }
function mixRGB(a, b, k) { return [a[0] + (b[0] - a[0]) * k | 0, a[1] + (b[1] - a[1]) * k | 0, a[2] + (b[2] - a[2]) * k | 0]; }
function easeIO(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

// Final color and left drift for one element, given its write color and whether it overlaps
function followStyle(base, overlap, ft) {
  const { tick, frac } = ft || followTick();
  if (tick < FOLLOW_FREEZE) return { c: base, dx: 0 };
  const target = overlap ? FOLLOW_GOLD : FOLLOW_BLUE;
  if (tick === FOLLOW_FREEZE) {
    const e = easeIO(frac * 2.5);
    return { c: mixRGB(base, target, e), dx: overlap ? 0 : -FOLLOW_DRIFT * easeIO(frac * 1.6) };
  }
  // filtered: fade through soft white, then back to the write colors
  const c = frac < 0.5 ? mixRGB(target, FOLLOW_WHITE, easeIO(frac * 2)) : mixRGB(FOLLOW_WHITE, base, easeIO(frac * 2 - 1));
  return { c, dx: overlap ? 0 : -FOLLOW_DRIFT * (1 - easeIO(frac)) };
}
function followSplitting(tab) { return isFollow(tab) && followTick().tick >= FOLLOW_FREEZE; }

function updateTickLabel() {
  const el = document.getElementById('tickLabel');
  if (!el) return;
  if (!isFollow(mode)) { if (el.textContent) { el.textContent = ''; el.classList.remove('freeze'); } return; }
  const { tick } = followTick();
  const txt = tick === FOLLOW_FREEZE ? `tick ${tick} · freeze` : `tick ${tick}`;
  if (el.textContent !== txt) {
    el.textContent = txt;
    el.classList.toggle('freeze', tick === FOLLOW_FREEZE);
  }
}

// Grains for plate / waves while splitting: near the still lines = overlap (gold)
function drawGrainsFollow(list, tab, sz, rect, field) {
  const ft = followTick();
  const n = tabColorList(tab).length;
  const styles = [];
  for (let g = 0; g < n; g++) {
    const base = tabRGB(tab, g / n);
    styles.push([followStyle(base, false, ft), followStyle(base, true, ft)]);
  }
  // overlap: on the still lines AND near the pointer (or near the middle if no pointer yet)
  const ov = new Uint8Array(list.length);
  const usePtr = mouse.x > 0;
  const ox = usePtr ? mouse.x : rect.x + rect.w / 2, oy = usePtr ? mouse.y : rect.y + rect.h / 2;
  const R = Math.max(110, Math.min(rect.w, rect.h) * 0.33), R2 = R * R;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const dx = p.x - ox, dy = p.y - oy;
    if (dx * dx + dy * dy > R2) continue;
    field((p.x - rect.x) / rect.w, (p.y - rect.y) / rect.h);
    ov[i] = Math.abs(fieldF) < 0.2 ? 1 : 0;
  }
  for (let g = 0; g < n; g++) {
    for (let o = 0; o < 2; o++) {
      const st = styles[g][o];
      ctx.fillStyle = rgbStr(st.c);
      for (let i = g; i < list.length; i += n) {
        if (ov[i] !== o) continue;
        const p = list[i];
        ctx.fillRect(p.x + st.dx - sz / 2, p.y - sz / 2, sz, sz);
      }
    }
  }
}

// ========== SHARED: ripples + vibrating grains ==========
let ripples = [];
let fieldF = 0, fieldFU = 0, fieldFV = 0;

function addRipple(x, y, color) {
  ripples.push({ x, y, r: 4, life: 1, color: color || '0,212,255' });
}

function updateRipples() {
  const fade = mode === 'loop' ? gapParams().fade : 0.014;
  for (const r of ripples) { r.r += 4.5; r.life -= fade; }
  ripples = ripples.filter(r => r.life > 0);
}

function drawRipples() {
  ctx.lineWidth = 1.5;
  for (const r of ripples) {
    ctx.strokeStyle = `rgba(${r.color},${(r.life * 0.45).toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function scatterGrains(list, n, rect) {
  list.length = 0;
  for (let i = 0; i < n; i++) {
    list.push({
      x: rect.x + Math.random() * rect.w,
      y: rect.y + Math.random() * rect.h,
      vx: 0, vy: 0
    });
  }
}

// Grains shake in proportion to how hard their spot vibrates (|f|),
// and drift down the slope of f^2, so they gather on the still lines.
function shakeGrains(list, rect, field, boost, scale, keep, pullK) {
  if (keep === undefined) keep = 0.75;
  const pk = 0.9 * (pullK || 1);
  const stir = mouse.down;
  const SR = 70;
  for (const p of list) {
    const u = (p.x - rect.x) / rect.w, v = (p.y - rect.y) / rect.h;
    field(u, v);
    const amp = Math.min(Math.abs(fieldF), 1.6);
    const kick = (0.75 * Math.pow(amp, 1.5) + 0.03) * (1 + boost * 5);
    p.vx += (Math.random() - 0.5) * kick * 2;
    p.vy += (Math.random() - 0.5) * kick * 2;
    p.vx -= fieldF * fieldFU / scale * pk;
    p.vy -= fieldF * fieldFV / scale * pk;
    if (stir) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < SR * SR) {
        const d = Math.sqrt(d2) || 1;
        const f = (SR - d) / SR;
        p.vx += dx / d * f * 3 + (Math.random() - 0.5) * 2;
        p.vy += dy / d * f * 3 + (Math.random() - 0.5) * 2;
      }
    }
    p.vx *= keep; p.vy *= keep;
    p.x += p.vx; p.y += p.vy;
    if (p.x < rect.x) { p.x = rect.x; p.vx = Math.abs(p.vx); }
    else if (p.x > rect.x + rect.w) { p.x = rect.x + rect.w; p.vx = -Math.abs(p.vx); }
    if (p.y < rect.y) { p.y = rect.y; p.vy = Math.abs(p.vy); }
    else if (p.y > rect.y + rect.h) { p.y = rect.y + rect.h; p.vy = -Math.abs(p.vy); }
  }
}

function drawGrains(list, c1, c2, sz) {
  ctx.fillStyle = c1;
  for (let i = 0; i < list.length; i++) {
    if (i % 6 === 0) continue;
    const p = list[i];
    ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
  ctx.fillStyle = c2;
  for (let i = 0; i < list.length; i += 6) {
    const p = list[i];
    ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
}

// Faint dots along the still lines (sign changes of f)
function drawNodeLines(rect, field, color) {
  const step = 3;
  ctx.fillStyle = color;
  const nx = Math.ceil(rect.w / step), ny = Math.ceil(rect.h / step);
  let prevRow = new Float32Array(nx + 1);
  for (let j = 0; j <= ny; j++) {
    const row = new Float32Array(nx + 1);
    for (let i = 0; i <= nx; i++) {
      field(i * step / rect.w, j * step / rect.h);
      row[i] = fieldF;
      if ((i > 0 && (row[i] > 0) !== (row[i - 1] > 0)) || (j > 0 && (row[i] > 0) !== (prevRow[i] > 0))) {
        ctx.fillRect(rect.x + i * step - 0.75, rect.y + j * step - 0.75, 1.5, 1.5);
      }
    }
    prevRow = row;
  }
}

// ========== SAND PLATE (Chladni) ==========
let plateBoost = 0;
let plateLines = false;
const PLATE_GRAINS = 5000;

function plateRect() {
  // keep the plate clear of the hint bar at the bottom
  const hb = hint.offsetHeight + 32;
  const S = Math.max(120, Math.min(width - 32, height - hb - 16));
  return { x: (width - S) / 2, y: Math.max(16, (height - hb - S) / 2), w: S, h: S };

function plateParams() {
  let a = waveN, b = waveM, s = -1;
  if (a === b) { b = a + 1; s = 1; } // equal modes cancel out; use a neighbor mode instead

}

let plateA = 3, plateB = 4, plateS = -1;
function plateField(u, v) {
  const pa = Math.PI * plateA, pb = Math.PI * plateB;
  const cau = Math.cos(pa * u), sau = Math.sin(pa * u), cbu = Math.cos(pb * u), sbu = Math.sin(pb * u);
  const cav = Math.cos(pa * v), sav = Math.sin(pa * v), cbv = Math.cos(pb * v), sbv = Math.sin(pb * v);
  fieldF = cau * cbv + plateS * cbu * cav;
  fieldFU = -pa * sau * cbv - plateS * pb * sbu * cav;
  fieldFV = -pb * cau * sbv - plateS * pa * cbu * sav;
}

function scatterPlate() {
  scatterGrains(particles, PLATE_GRAINS, plateRect());
  plateBoost = 0.6;
}

function plateDown(x, y) {
  plateBoost = 1;
  addRipple(x, y, tabColorList('plate') ? rgbTriplet(tabRGB('plate', 0)) : '250,204,21');
  if (gain && audioCtx) {
    const t = audioCtx.currentTime;
    gain.gain.cancelScheduledValues(t);
    gain.gain.setValueAtTime(0.16, t);
    gain.gain.setTargetAtTime(0.08, t, 0.15);
  }
}

function updatePlate() {
  updateRipples();
  if (frozen) return;
  [plateA, plateB, plateS] = plateParams();
  const r = plateRect();
  const k = plateK();
  shakeGrains(particles, r, plateField, plateBoost, Math.PI * Math.max(plateA, plateB), clampN(1 - 0.25 * k, 0.5, 0.9), k * k);
  plateBoost *= 1 - 0.03 * k;
}

function drawPlate() {
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, width, height);
  const r = plateRect();
  ctx.fillStyle = '#0b1018';
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = 'rgba(0,212,255,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(r.x - 0.5, r.y - 0.5, r.w + 1, r.h + 1);
  [plateA, plateB, plateS] = plateParams();
  const plateCols = tabColorList('plate');
  if (plateLines) drawNodeLines(r, plateField, plateCols ? rgbStr(tabRGB('plate', 0.5), 0.35) : 'rgba(0,212,255,0.35)');
  if (plateCols && followSplitting('plate')) drawGrainsFollow(particles, 'plate', 1.7, r, plateField);
  else if (plateCols) drawGrainsTab(particles, 'plate', 1.7, 0);
  else drawGrains(particles, '#facc15', '#fff3b0', 1.7);
  drawRipples();
  if (mouse.x) {
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mouse.x - 10, mouse.y); ctx.lineTo(mouse.x + 10, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 10); ctx.lineTo(mouse.x, mouse.y + 10);
    ctx.stroke();
    if (mouse.down) {
      ctx.strokeStyle = 'rgba(0,212,255,0.3)';
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 70, 0, Math.PI * 2); ctx.stroke();
    }
  }
}

// ========== 1D TO 2D WAVES ==========
let waveParticles = [];
let waveBoost = 0;
let wavePulse = 0;
const WAVE_GRAINS = 4000;

function waveRect() {
  const gl = waveGraphs.offsetLeft, gt = waveGraphs.offsetTop;
  const gw = waveGraphs.offsetWidth, gh = waveGraphs.offsetHeight;
  const bottom = height - hint.offsetHeight - 32; // stay above the hint bar
  if (width >= 700) {
    const x = gl + gw + 32;
    return { x, y: 24, w: Math.max(80, width - x - 24), h: Math.max(80, bottom - 24) };
  }
  const y = gt + gh + 16;
  return { x: 22, y, w: Math.max(80, width - 38), h: Math.max(60, bottom - y) };
}

function waveField(u, v) {
  const a = Math.PI * hWaves, b = Math.PI * vWaves;
  const su = Math.sin(a * u), sv = Math.sin(b * v);
  fieldF = su * sv;
  fieldFU = a * Math.cos(a * u) * sv;
  fieldFV = b * su * Math.cos(b * v);
}

function resetWaveParticles() {
  scatterGrains(waveParticles, WAVE_GRAINS, waveRect());
  waveBoost = 0.6;
  updateWaveLabels();
}

function reshakeWaves() {
  updateSound();
  waveBoost = 1;
  wavePulse = 1;
  updateWaveLabels();
}

function updateWaveLabels() {
  const h = document.getElementById('hLabel'), v = document.getElementById('vLabel');
  if (h) h.textContent = `Horizontal wave: ${hWaves + 1} nodes`;
  if (v) v.textContent = `Vertical wave: ${vWaves + 1} nodes`;
}

function wavesDown(x, y) {
  const r = waveRect();
  if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
    waveBoost = 1;
    wavePulse = 1;
    addRipple(x, y, tabColorList('waves') ? rgbTriplet(tabRGB('waves', 0)) : '103,232,249');
  }
}

function updateWaves() {
  updateRipples();
  if (!waveParticles.length) resetWaveParticles();
  const k = wavesK();
  shakeGrains(waveParticles, waveRect(), waveField, waveBoost, Math.PI * Math.max(hWaves, vWaves), clampN(1 - 0.25 * k, 0.5, 0.9), k * k);
  waveBoost *= 1 - 0.03 * k;
  wavePulse *= 1 - 0.05 * k;
}

function drawWaves() {
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, width, height);
  const r = waveRect();
  ctx.fillStyle = '#0a0f17';
  ctx.fillRect(r.x, r.y, r.w, r.h);
  const waveCols = tabColorList('waves');
  ctx.strokeStyle = waveCols ? rgbStr(tabRGB('waves', 0), 0.22) : 'rgba(103,232,249,0.22)';
  ctx.lineWidth = 1;
  ctx.strokeRect(r.x - 0.5, r.y - 0.5, r.w + 1, r.h + 1);
  // node ticks on the field edges, matching the node dots in the graphs
  ctx.fillStyle = waveNodeColor();
  for (let i = 0; i <= hWaves; i++) {
    const x = r.x + r.w * i / hWaves;
    ctx.beginPath(); ctx.arc(x, r.y - 7, 3, 0, Math.PI * 2); ctx.fill();
  }
  for (let j = 0; j <= vWaves; j++) {
    const y = r.y + r.h * j / vWaves;
    ctx.beginPath(); ctx.arc(r.x - 7, y, 3, 0, Math.PI * 2); ctx.fill();
  }
  const glow = Math.min(1, waveBoost);
  if (waveCols && followSplitting('waves')) drawGrainsFollow(waveParticles, 'waves', 1.8, r, waveField);
  else if (waveCols) drawGrainsTab(waveParticles, 'waves', 1.8, glow > 0.3 ? 0.35 : 0);
  else drawGrains(waveParticles, glow > 0.3 ? '#a5f3fc' : '#67e8f9', '#ecfeff', 1.8);
  drawRipples();
  drawMiniWaves();
}

function waveNodeColor() {
  const cols = tabColorList('waves');
  if (!cols) return '#ff6b9d';
  return rgbStr(lighten(tabRGB('waves', 0.5), 0.15));
}

let lastNoteDot = '';
function drawMiniWaves() {
  const waveCols = tabColorList('waves');
  const lineC = waveCols ? tabRGB('waves', 0) : [103, 232, 249];
  const nodeC = waveNodeColor();
  if (nodeC !== lastNoteDot) {
    const dot = document.querySelector('.wave-note .dot');
    if (dot) dot.style.background = nodeC;
    lastNoteDot = nodeC;
  }
  const hCanvas = document.getElementById('hWave');
  const vCanvas = document.getElementById('vWave');
  if (!hCanvas) return;
  const t = Date.now() * 0.002;
  const pulse = wavePulse;

  function drawWave(c, waves) {
    const W = c.canvas.width, H = c.canvas.height, mid = H / 2;
    c.clearRect(0, 0, W, H);
    c.strokeStyle = rgbStr(lineC, 0.12);
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, mid); c.lineTo(W, mid); c.stroke();
    const amp = (H * 0.3) * (1 + pulse * 0.5) * Math.sin(t * 2.2);
    c.strokeStyle = waveCols ? rgbStr(lighten(lineC, pulse * 0.9)) : (pulse > 0.05 ? `rgb(${103 + 152 * pulse | 0},${232 + 23 * pulse | 0},249)` : '#67e8f9');
    c.lineWidth = 2 + pulse * 2;
    c.shadowColor = waveCols ? rgbStr(lineC) : '#67e8f9';
    c.shadowBlur = pulse * 14;
    c.beginPath();
    for (let x = 0; x <= W; x++) {
      const y = mid + Math.sin((x / W) * Math.PI * waves) * amp;
      if (x === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
    c.shadowBlur = 0;
    c.fillStyle = nodeC;
    for (let i = 0; i <= waves; i++) {
      const x = Math.min(W - 4, Math.max(4, (i / waves) * W));
      c.beginPath();
      c.arc(x, mid, 4 + pulse * 2, 0, Math.PI * 2);
      c.fill();
    }
  }
  drawWave(hCanvas.getContext('2d'), hWaves);
  drawWave(vCanvas.getContext('2d'), vWaves);
}

// ========== RELAXING LOOP ==========
let loopTrails = false;

function gapText() { return loopGap.toFixed(1) + (linkedOn ? ', size and fade linked' : ', size only'); }
// Gap m: ring radius 45*m, return spring 0.015*m, ripple fade 0.014*m, speed loss per frame 0.1*m
function gapParams() {
  const m = loopGap;
  if (!linkedOn) return { ring: 45 * m, spring: 0.015, keep: 0.9, fade: 0.014 };
  return { ring: 45 * m, spring: 0.015 * m, keep: Math.max(0.75, Math.min(0.97, 1 - 0.1 * m)), fade: 0.014 * m };
}

function initLoop() {
  loopParticles = [];
  for (let i = 0; i < loopDensity; i++) {
    loopParticles.push({
      angle: Math.random() * Math.PI * 2,
      radius: 40 + Math.random() * Math.min(width, height) * 0.35,
      speed: (0.2 + Math.random() * 0.6) * (Math.random() < 0.5 ? 1 : -1),
      size: 1.5 + Math.random() * 3,
      hue: Math.random() * 60 + 180,
      offset: Math.random() * Math.PI * 2,
      x: undefined, y: undefined, vx: 0, vy: 0
    });
  }
}

function loopDown(x, y) {
  addRipple(x, y, tabColorList('loop') ? rgbTriplet(lighten(tabRGB('loop', 0.5), 0.3)) : '125,211,252');
}

function updateLoop() {
  updateRipples();
  const cx = width / 2, cy = height / 2;
  const t = Date.now() * 0.001;
  const R = Math.max(150, Math.min(width, height) * 0.3);
  const G = gapParams();
  for (const p of loopParticles) {
    p.angle += p.speed * loopSpeed * 0.01;
    const r = p.radius + Math.sin(t * 0.5 + p.offset) * 20;
    const tx = cx + Math.cos(p.angle) * r;
    const ty = cy + Math.sin(p.angle) * r * 0.7;
    if (p.x === undefined) { p.x = tx; p.y = ty; }
    p.tx = tx; p.ty = ty;
    let hold = 0, ax = 0, ay = 0;
    if (mouse.down) {
      const dx = mouse.x - p.x, dy = mouse.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < R) {
        hold = 1 - d / R;
        const pull = (d - G.ring) / d * 0.05 * hold;   // pull in, but keep a ring (the gap) around the finger
        ax += dx * pull; ay += dy * pull;
        const swirl = 0.55 * hold * (p.speed > 0 ? 1 : 0.8);
        ax += -dy / d * swirl; ay += dx / d * swirl;
      }
    }
    // ease back to the orbit when released
    const spring = G.spring * (1 - hold);
    ax += (tx - p.x) * spring; ay += (ty - p.y) * spring;
    for (const rp of ripples) {
      const dx = p.x - rp.x, dy = p.y - rp.y;
      const d = Math.hypot(dx, dy) || 1;
      const gap = Math.abs(d - rp.r);
      if (gap < 24) {
        const f = (1 - gap / 24) * rp.life * 1.2;
        ax += dx / d * f; ay += dy / d * f;
      }
    }
    p.vx = (p.vx + ax) * G.keep;
    p.vy = (p.vy + ay) * G.keep;
    p.x += p.vx; p.y += p.vy;
  }
}

function drawLoop() {
  if (loopTrails) {
    ctx.fillStyle = 'rgba(5,7,10,0.14)';
  } else {
    ctx.fillStyle = '#05070a';
  }
  ctx.fillRect(0, 0, width, height);
  const t = Date.now() * 0.001;
  if (mouse.down) {
    const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 90);
    const gc = tabColorList('loop') ? rgbTriplet(tabRGB('loop', 0)) : '125,211,252';
    g.addColorStop(0, `rgba(${gc},0.12)`);
    g.addColorStop(1, `rgba(${gc},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 90, 0, Math.PI * 2); ctx.fill();
  }
  const loopCols = tabColorList('loop');
  const loopSplit = followSplitting('loop');
  const ft = followTick();
  const inner = 40 + Math.min(width, height) * 0.35 * 0.4;
  for (const p of loopParticles) {
    let dx = 0;
    const alpha = 0.4 + Math.sin(t + p.offset) * 0.3;
    const sp = Math.min(1, Math.hypot(p.vx, p.vy) / 6);
    if (loopCols) {
      let c = lighten(tabRGB('loop', p.offset / (Math.PI * 2)), 0.1 + sp * 0.45);
      if (loopSplit) {
        // overlap: near the pointer if it is on the canvas, else the inner ring
        const near = mouse.x ? Math.hypot(p.x - mouse.x, p.y - mouse.y) < 180 : p.radius < inner;
        const st = followStyle(c, near, ft);
        c = st.c; dx = st.dx;
      }
      ctx.fillStyle = rgbStr(c, Math.min(1, alpha + sp * 0.4).toFixed(3));
    } else {
      ctx.fillStyle = `hsla(${p.hue}, 70%, ${60 + sp * 20}%, ${Math.min(1, alpha + sp * 0.4)})`;
    }
    ctx.beginPath();
    ctx.arc(p.x + dx, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  drawRipples();
}

// ========== SOUND (shared layer) ==========
// One master gain + soft compressor. Each tab can run a "bed" (continuous voices)
// plus short one-shot sounds. Everything starts only after a user click.
let master = null, limiter = null, noiseBuf = null;
let bed = null;                 // { tab, out, nodes, frame, update }
let liveVoices = 0;             // for testing cleanup
let lastBubbleCount = 0, lastFollowTick = 0, lastScrape = 0;
const toneN = n => 80 + n * 18;  // same mapping as the plate's Wave N
const toneM = m => 120 + m * 22; // same mapping as the plate's Wave M

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (!master) {
    limiter = audioCtx.createDynamicsCompressor();
    limiter.threshold.value = -18;
    limiter.knee.value = 12;
    limiter.ratio.value = 8;
    limiter.attack.value = 0.004;
    limiter.release.value = 0.25;
    master = audioCtx.createGain();
    master.gain.value = 0.7;
    master.connect(limiter);
    limiter.connect(audioCtx.destination);
  }
}

function getNoise() {
  if (!noiseBuf) {
    const sr = audioCtx.sampleRate;
    noiseBuf = audioCtx.createBuffer(1, sr * 2, sr);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

function setSound(on) {
  soundOn = !!on;
  const hb = document.getElementById('soundToggle');
  if (hb) { hb.textContent = soundOn ? 'Sound: On' : 'Sound: Off'; hb.classList.toggle('active', soundOn); }
  const pb = document.getElementById('soundBtn');
  if (pb) { pb.textContent = soundOn ? 'Sound: On' : 'Sound: Off'; pb.classList.toggle('active', soundOn); }
  if (soundOn) { ensureAudio(); startBed(mode); }
  else stopBed();
}
// kept for older callers
function startSound() { setSound(true); }
function stopSound() { stopBed(); }

function osc(type, freq) {
  const o = audioCtx.createOscillator();
  o.type = type; o.frequency.value = freq;
  return o;
}

function stopBed() {
  if (!bed || !audioCtx) { bed = null; return; }
  const b = bed; bed = null;
  const t = audioCtx.currentTime;
  b.out.gain.cancelScheduledValues(t);
  b.out.gain.setValueAtTime(b.out.gain.value, t);
  b.out.gain.linearRampToValueAtTime(0, t + 0.2);
  setTimeout(() => {
    b.nodes.forEach(n => { try { n.stop && n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} });
    try { b.out.disconnect(); } catch (e) {}
    liveVoices -= b.nodes.length;
  }, 300);
  if (b.tab === 'plate') { osc1 = osc2 = gain = null; }
}

function makeBed(tab, level) {
  const out = audioCtx.createGain();
  out.gain.value = 0;
  out.connect(master);
  out.gain.setTargetAtTime(level, audioCtx.currentTime, 0.15);
  return { tab, out, nodes: [], frame: null, update: null };
}
function addNodes(b, list) { b.nodes.push(...list); liveVoices += list.length; list.forEach(n => n.start && n.start()); }

function startBed(tab) {
  stopBed();
  if (!soundOn || !audioCtx) return;
  if (tab === 'plate') {
    const b = makeBed(tab, 1);
    gain = audioCtx.createGain(); gain.gain.value = 0.08; gain.connect(b.out);
    osc1 = osc('sine', toneN(waveN)); osc2 = osc('triangle', toneM(waveM));
    osc1.connect(gain); osc2.connect(gain);
    b.update = () => {
      const t = audioCtx.currentTime;
      osc1 && osc1.frequency.setTargetAtTime(toneN(waveN), t, 0.1);
      osc2 && osc2.frequency.setTargetAtTime(toneM(waveM), t, 0.1);
    };
    addNodes(b, [osc1, osc2, gain]);
    bed = b;
  } else if (tab === 'waves') {
    const b = makeBed(tab, 0.06);
    // each wave gets a tone plus a slightly detuned twin, so they shimmer and beat together
    const h1 = osc('sine', toneN(hWaves)), h2 = osc('sine', toneN(hWaves) + 0.8);
    const v1 = osc('triangle', toneM(vWaves)), v2 = osc('sine', toneM(vWaves) + 0.6);
    [h1, h2, v1, v2].forEach(o => o.connect(b.out));
    b.update = () => {
      const t = audioCtx.currentTime;
      h1.frequency.setTargetAtTime(toneN(hWaves), t, 0.1); h2.frequency.setTargetAtTime(toneN(hWaves) + 0.8, t, 0.1);
      v1.frequency.setTargetAtTime(toneM(vWaves), t, 0.1); v2.frequency.setTargetAtTime(toneM(vWaves) + 0.6, t, 0.1);
    };
    addNodes(b, [h1, h2, v1, v2]);
    bed = b;
  } else if (tab === 'loop') {
    const b = makeBed(tab, 0.05);
    const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220; lp.Q.value = 0.7;
    lp.connect(b.out);
    const a = osc('sawtooth', 55), c = osc('sawtooth', 55.35), d = osc('sine', 82.4);
    [a, c, d].forEach(o => o.connect(lp));
    b.frame = () => {
      let s = 0;
      for (const p of loopParticles) s += Math.abs(p.vx) + Math.abs(p.vy);
      const avg = loopParticles.length ? s / loopParticles.length : 0;
      lp.frequency.setTargetAtTime(200 + Math.min(1, avg / 5) * 1400, audioCtx.currentTime, 0.12);
    };
    addNodes(b, [a, c, d, lp]);
    bed = b;
  } else if (tab === 'sand') {
    const b = makeBed(tab, 1);
    const src = audioCtx.createBufferSource(); src.buffer = getNoise(); src.loop = true;
    const hissF = audioCtx.createBiquadFilter(); hissF.type = 'bandpass'; hissF.frequency.value = 3200; hissF.Q.value = 0.6;
    const hissG = audioCtx.createGain(); hissG.gain.value = 0;
    const scrF = audioCtx.createBiquadFilter(); scrF.type = 'bandpass'; scrF.frequency.value = 700; scrF.Q.value = 1.2;
    const scrG = audioCtx.createGain(); scrG.gain.value = 0;
    src.connect(hissF); hissF.connect(hissG); hissG.connect(b.out);
    src.connect(scrF); scrF.connect(scrG); scrG.connect(b.out);
    b.frame = () => {
      const t = audioCtx.currentTime;
      const pouring = mouse.down && tool === 'pour';
      hissG.gain.setTargetAtTime(pouring ? 0.035 + size * 0.003 : 0, t, 0.08);
      const carving = mouse.down && tool === 'carve' && performance.now() - lastScrape < 120;
      scrG.gain.setTargetAtTime(carving ? 0.09 : 0, t, 0.05);
    };
    addNodes(b, [src, hissF, hissG, scrF, scrG]);
    bed = b;
  } else if (tab === 'bubbles') {
    bed = makeBed(tab, 0);  // no bed; pops are one-shots
  }
}

function updateSound() { if (bed && bed.update) bed.update(); }

// Short one-shot voice: an oscillator with a pitch glide and decay envelope
function blip(type, f0, f1, dur, vol, when) {
  if (!soundOn || !audioCtx || !master) return;
  const t = audioCtx.currentTime + (when || 0);
  const o = osc(type, f0), g = audioCtx.createGain();
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur * 0.6);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  liveVoices += 2;
  o.onended = () => { o.disconnect(); g.disconnect(); liveVoices -= 2; };
  o.start(t); o.stop(t + dur + 0.05);
}

function chime(base, vol) {
  blip('sine', base, base, 1.6, vol || 0.08);
  blip('sine', base * 2.01, base * 2.01, 1.1, (vol || 0.08) * 0.4);
  blip('sine', base * 3.0, base * 3.0, 0.7, (vol || 0.08) * 0.2);
}

// Plucked string (Karplus-Strong) rendered into a buffer
function pluck(freq, vol, kLink) {
  const loss = 1 - 0.004 * (kLink || 1);   // Linked: more nodes, the string dies faster
  if (!soundOn || !audioCtx || !master) return;
  const sr = audioCtx.sampleRate, N = Math.max(2, Math.round(sr / freq)), len = Math.floor(sr * 1.4);
  const buf = audioCtx.createBuffer(1, len, sr), d = buf.getChannelData(0);
  const ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
  let k = 0;
  for (let i = 0; i < len; i++) {
    const a = ring[k], b = ring[(k + 1) % N];
    d[i] = a;
    ring[k] = (a + b) * 0.5 * loss;
    k = (k + 1) % N;
  }
  const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
  src.buffer = buf; g.gain.value = vol || 0.22;
  src.connect(g); g.connect(master);
  liveVoices += 2;
  src.onended = () => { src.disconnect(); g.disconnect(); liveVoices -= 2; };
  src.start();
}

function soundPointerDown(p) {
  if (!soundOn) return;
  if (mode === 'sand') {
    if (tool === 'stamp') blip('square', 1800, 900, 0.05, 0.03);
  } else if (mode === 'loop') {
    chime(660 + Math.random() * 220, 0.06);
  } else if (mode === 'plate') {
    blip('triangle', toneN(waveN) * 4, toneN(waveN) * 3.9, 0.5, 0.07);
    blip('sine', toneM(waveM) * 2, toneM(waveM) * 2, 0.7, 0.05);
  } else if (mode === 'waves') {
    const r = waveRect();
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
      pluck(toneN(hWaves) * 2, 0.22, wavesK());
      pluck(toneM(vWaves) * 2, 0.14, wavesK());
    }
  }
}

function soundPointerMove() {
  if (mode === 'sand' && tool === 'carve' && mouse.down) lastScrape = performance.now();
}

// Called every frame
function soundFrame() {
  if (mode === 'bubbles') {
    const n = bubbles.length;
    if (soundOn) {
      if (n > lastBubbleCount) {
        const b = bubbles[n - 1];
        const f = 900 - Math.min(60, b.r) * 8;
        blip('sine', f, f * 1.6, 0.18, 0.08);          // blow: rising bloop
      } else if (n < lastBubbleCount && n > 0) {
        const big = Math.max(...bubbles.map(b => b.r));
        const f = Math.max(140, 700 - big * 5);
        blip('sine', f * 1.5, f, 0.22, 0.09);          // merge: falling bloop, lower for bigger bubbles
      }
    }
    lastBubbleCount = n;
  } else {
    lastBubbleCount = 0;
  }
  if (isFollow(mode)) {
    const tk = followTick().tick;
    if (tk !== lastFollowTick && tk === FOLLOW_FREEZE && soundOn) chime(523.25, 0.05);
    lastFollowTick = tk;
  }
  if (soundOn && bed && bed.frame) bed.frame();
}

// ========== MAIN LOOP ==========
function loop() {
  updateTickLabel();
  soundFrame();
  if (mode === 'sand') {
    updateSand();
    drawSand();
  } else if (mode === 'loop') {
    if (!followHolding('loop')) updateLoop();
    drawLoop();
  } else if (mode === 'bubbles') {
    if (!followHolding('bubbles')) updateBubbles();
    drawBubbles();
  } else if (mode === 'plate') {
    if (!followHolding('plate')) updatePlate();
    drawPlate();
  } else if (mode === 'waves') {
    if (!followHolding('waves')) updateWaves();
    drawWaves();
  }
  requestAnimationFrame(loop);
}

// Mouse / Touch
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

canvas.addEventListener('mousedown', e => {
  mouse.down = true;
  const p = getPos(e);
  mouse.x = p.x; mouse.y = p.y;
  if (mode === 'bubbles') startBubbleInteraction(p.x, p.y);
  if (mode === 'sand') sandDown(p);
  if (mode === 'loop') loopDown(p.x, p.y);
  if (mode === 'plate') plateDown(p.x, p.y);
  if (mode === 'waves') wavesDown(p.x, p.y);
  soundPointerDown(p);
});
canvas.addEventListener('mousemove', e => {
  const p = getPos(e);
  mouse.x = p.x; mouse.y = p.y;
  if (mode === 'bubbles') moveDraggedBubble(p.x, p.y);
  if (mode === 'sand') sandMove(p);
  soundPointerMove();
});
window.addEventListener('mouseup', () => { mouse.down = false; draggingBubble = null; if (lifted) dropObject(mouse.x, mouse.y); });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  mouse.down = true;
  const p = getPos(e);
  mouse.x = p.x; mouse.y = p.y;
  if (mode === 'bubbles') startBubbleInteraction(p.x, p.y);
  if (mode === 'sand') sandDown(p);
  if (mode === 'loop') loopDown(p.x, p.y);
  if (mode === 'plate') plateDown(p.x, p.y);
  if (mode === 'waves') wavesDown(p.x, p.y);
  soundPointerDown(p);
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const p = getPos(e);
  mouse.x = p.x; mouse.y = p.y;
  if (mode === 'bubbles') moveDraggedBubble(p.x, p.y);
  if (mode === 'sand') sandMove(p);
  soundPointerMove();
}, {passive: false});
window.addEventListener('touchend', () => { mouse.down = false; draggingBubble = null; if (lifted) dropObject(mouse.x, mouse.y); });

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const newMode = tab.dataset.mode;
    stopBed();
    mode = newMode;
    particles = [];
    bubbles = [];
    draggingBubble = null;
    setControls();
    if (soundOn) startBed(mode);
  });
});
document.getElementById('soundToggle').onclick = () => setSound(!soundOn);
document.getElementById('linkToggle').onclick = () => setLinked(!linkedOn);
setLinked(linkedOn);

setControls();
loop();
</script>
</body>
</html>
