<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tension, Waves & Sparkle Sand</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141922;
    --accent: #00d4ff;
    --text: #e6edf3;
    --muted: #8b949e;
    --border: #21262d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    background: linear-gradient(90deg, #ff6b9d, #c084fc, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .sound-btn {
    padding: 8px 16px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 20px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
  }
  .sound-btn.active { background: #c084fc; color: #000; border: 1px solid #c084fc; }
  .link-btn.active { background: var(--accent); border: 1px solid var(--accent); }
  .linked-note { font-size: 0.78rem; color: var(--muted); }
  .tab, .sound-btn { padding: 8px 10px; }
  .tabs { gap: 5px; }
  header { padding: 16px 18px; }
  .tab.active, .tab:hover {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .controls {
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    min-height: 56px;
  }
  #tab-stretch .stc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  #tab-stretch .control-group { display: flex; align-items: center; gap: 6px; }
  #tab-stretch .btn.active-toggle { background: #2d3b55; border-color: #79c0ff; color: #79c0ff; font-weight: 600; }
  #tab-stretch .btn.primary { background: #7ee787; color: #080b10; font-weight: 600; border-color: #7ee787; }
  #tab-stretch label { font-size: 0.8rem; color: var(--muted); }
  #tab-stretch span { font-size: 0.85rem; }
  .mag-pct { min-width: 3.2em; color: var(--text); font-variant-numeric: tabular-nums; }
  .controls label {
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .controls input[type="range"] {
    width: 100px;
    accent-color: var(--accent);
  }
  .controls button {
    padding: 6px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
  }
  .controls button:hover, .controls button.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .palette {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch.active { border-color: white; transform: scale(1.15); }
  #canvas-container {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #05070a;
  }
  #main {
    position: absolute;
    inset: 0;
  }
  .hint {
    position: absolute;
    bottom: 16px;
    left: 24px;
    right: 24px;
    background: rgba(0,0,0,0.7);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.8rem;
    color: var(--muted);
    pointer-events: none;
  }
  .wave-graphs {
    position: absolute;
    left: 16px;
    top: 16px;
    width: min(340px, calc(100% - 32px));
    background: rgba(10,14,20,0.85);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: none;
  }
  .wave-graphs.visible { display: block; }
  .wave-graphs canvas { height: 90px; margin-bottom: 10px; background: transparent; }
  .wave-graphs h3 { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
  .wave-note { font-size: 0.72rem; color: var(--muted); line-height: 1.4; }
  .wave-note .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff6b9d; margin-right: 4px; }
  @media (max-width: 700px) { .wave-graphs { padding: 10px; } .wave-graphs canvas { height: 56px; margin-bottom: 6px; } }
  .controls.sand { gap: 8px; }
  .controls.sand input[type="range"] { width: 58px; }
  .controls.sand button { padding: 6px 11px; }
  .controls.sand label { gap: 6px; }
  .controls.sand .palette { gap: 5px; }
  .controls.sand .swatch { width: 20px; height: 20px; }
  .controls select {
    padding: 6px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .mold-box {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .controls canvas#moldIcon {
    width: 22px;
    height: 22px;
    background: transparent;
    cursor: pointer;
  }
  .palette.sets { gap: 5px; }
  .swatch.set { width: 20px; height: 20px; }
  .swatch.set.follow { outline: 1px dashed rgba(255,255,255,0.6); outline-offset: 2px; }
  .tick-label { font-size: 0.8rem; color: var(--muted); min-width: 96px; font-variant-numeric: tabular-nums; }
  .tick-label:empty { display: none; }
  #restBox { position: absolute; top: 10px; right: 10px; z-index: 3; border-radius: 6px; overflow: hidden; }
  #restBox canvas { background: transparent; display: block; width: 220px; height: 96px; }
  #restBox.collapsed canvas { display: none; }
  #restToggle { position: absolute; top: 2px; right: 4px; background: none; border: none; color: var(--muted); font-size: 0.7rem; cursor: pointer; padding: 2px 4px; z-index: 1; }
  #restBox.collapsed #restToggle { position: static; background: rgba(10,14,22,0.85); border: 1px solid var(--border); border-radius: 12px; padding: 4px 10px; }
  @media (max-width: 600px) { #restBox { top: auto; bottom: var(--rest-bottom, 90px); } }
  .tick-label.freeze { color: #fbbf24; }
  .hint { transition: opacity 0.6s; }
  .hint.faded { opacity: 0.25; }
  header { position: relative; }
  #copyNote { position: absolute; right: 18px; bottom: 2px; font-size: 10px; line-height: 12px; color: var(--muted); opacity: 0.55; white-space: nowrap; }
  #copyNote a { color: inherit; }
  #copyNote:hover { opacity: 0.9; }
</style>
</head>
<body>
<header>
  <h1>Tension, Waves & Sparkle Sand</h1>
  <div class="tabs">
    <button class="tab active" data-mode="sand">1. Sand</button>
    <button class="tab" data-mode="loop">2. Loop</button>
    <button class="tab" data-mode="bubbles">3. Bubbles</button>
    <button class="tab" data-mode="plate">4. Plate</button>
    <button class="tab" data-mode="waves">5. Waves</button>
    <button class="tab" data-mode="silk">6. Silk</button>
    <button class="tab" data-mode="crystal">7. Crystal</button>
    <button class="tab" data-mode="magnets">8. Magnets</button>
    <button class="tab" data-mode="stretch" title="Stretch &amp; Close">9. Stretch</button>
    <button class="sound-btn" id="soundToggle" title="Sound for every tab">Sound: Off</button>
    <button class="sound-btn link-btn" id="linkToggle" title="Tie size and settling into one number">Linked: On</button>
  </div>
  <div id="copyNote">Copyright © 2026 NousVolition. All rights reserved. <a href="https://github.com/NousVolition/sparkle-sand-playground/blob/main/LICENSE" target="_blank" rel="noopener">Reuse terms</a></div>
</header>

<div class="controls" id="controls">
  <!-- Dynamic controls -->
</div>

<div id="canvas-container">
  <canvas id="main"></canvas>
  <div class="wave-graphs" id="waveGraphs">
    <h3 id="hLabel">Horizontal wave</h3>
    <canvas id="hWave" width="640" height="180"></canvas>
    <h3 id="vLabel">Vertical wave</h3>
    <canvas id="vWave" width="640" height="180"></canvas>
    <p class="wave-note"><span class="dot"></span> Nodes: points that stay still. Sand collects on the lines through them.</p>
  </div>
  <div class="hint" id="hint">Pour: click and drag to pour glitter sand.</div>
</div>

<script>
const canvas = document.getElementById('main');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const controlsDiv = document.getElementById('controls');
const waveGraphs = document.getElementById('waveGraphs');

let mode = 'sand';
let width, height;
let particles = [];
let bubbles = [];
let draggingBubble = null;
let dragOffset = { x: 0, y: 0 };
let lastDrag = { x: 0, y: 0 };
let loopParticles = [];
let mouse = { x: 0, y: 0, down: false };
let color = '#ff6b9d';
let cling = 0.7;
let size = 3;
let pouring = true;
let guideLines = true;
let surfaceTension = 0.6;
let waveN = 3;
let waveM = 4;
let frozen = false;
let hWaves = 2;
let vWaves = 3;
let loopSpeed = 0.6;
let loopDensity = 150;
let linkedOn = (() => { try { return localStorage.getItem('sparkleLinked') !== '0'; } catch (e) { return true; } })();
const LINK_NOTES = {
  loop: 'Linked: bigger gap heals faster',
  plate: 'Linked: finer pattern settles faster',
  waves: 'Linked: more nodes, pluck fades faster',
  bubbles: 'Linked: higher tension merges sooner, calms faster',
  silk: 'Linked: smoother flow, wider strokes, trails fade faster',
  crystal: 'Linked: more humidity, vapor bursts settle faster',
  magnets: 'Linked: stronger surface tension, smaller spikes, the fluid snaps back faster'
};
function applyLinkNote() {
  if (!LINK_NOTES[mode] || hint.dataset.base === undefined) return;
  hint.textContent = hint.dataset.base + (linkedOn ? ' ' + LINK_NOTES[mode] + '.' : '');
}
function linkNoteHTML() { return LINK_NOTES[mode] ? `<span class="linked-note" id="linkNote">${linkedOn ? LINK_NOTES[mode] : ''}</span>` : ''; }
function setLinked(on) {
  linkedOn = !!on;
  try { localStorage.setItem('sparkleLinked', linkedOn ? '1' : '0'); } catch (e) {}
  const b = document.getElementById('linkToggle');
  if (b) { b.textContent = linkedOn ? 'Linked: On' : 'Linked: Off'; b.classList.toggle('active', linkedOn); }
  applyLinkNote();
  const g = document.getElementById('gapVal');
  if (g) g.textContent = gapText();
}
// one number per tab; 1 = the original look
function plateK() { return linkedOn ? Math.max(plateA, plateB) / 4 : 1; }
function wavesK() { return linkedOn ? Math.max(hWaves, vWaves) / 3 : 1; }
function bubblesK() { return linkedOn ? surfaceTension / 0.6 : 1; }
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
let loopGap = 1;   // one number: ring size around the finger AND how fast things heal
let audioCtx = null;
let osc1 = null;
let osc2 = null;
let gain = null;
let soundOn = false;

const palette = [
  '#ff6b9d', '#00d4ff', '#c084fc', '#fbbf24', '#34d399',
  '#fb923c', '#f472b6', '#a78bfa', '#facc15', '#2dd4bf'
];

function resize() {
  width = canvas.width = canvas.offsetWidth * devicePixelRatio;
  height = canvas.height = canvas.offsetHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  width /= devicePixelRatio;
  height /= devicePixelRatio;
}
window.addEventListener('resize', resize);
resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('canvas-container'));

function setControls() {
  controlsDiv.innerHTML = '';
  waveGraphs.classList.remove('visible');
  hint.classList.remove('faded');
  controlsDiv.classList.toggle('sand', mode === 'sand');
  if (lifted) dropObject(mouse.x, mouse.y);
  canvas.style.cursor = '';
  ripples = [];
  
  if (mode === 'sand') {
    controlsDiv.innerHTML = `
      <button id="pourBtn" data-tool="pour">Pour</button>
      <button id="stampBtn" data-tool="stamp">Stamp</button>
      <button id="dropBtn" class="${stampDrop ? 'active' : ''}" title="Stamp drop. On: stamped molds fall and land. Off: they stamp in place." style="padding:6px 8px">Drop: ${stampDrop ? 'On' : 'Off'}</button>
      <button id="carveBtn" data-tool="carve">Carve</button>
      <button id="ledgeBtn" data-tool="ledge">Ledge</button>
      <button id="meltBtn" class="${meltOn ? 'active' : ''}" title="Layered: shapes stay separate. Melt: overlapping shapes blend.">${meltOn ? 'Melt' : 'Layered'}</button>
      <span class="mold-box"><canvas id="moldIcon" width="44" height="44"></canvas><select id="mold" title="Mold"></select></span>
      <label>Mold size <input type="range" id="moldSize" min="25" max="140" value="${moldSize}"></label>
      <label>Size <input type="range" id="size" min="1" max="8" value="${size}"></label>
      <label>Cling <input type="range" id="cling" min="0" max="1" step="0.05" value="${cling}"></label>
      <button id="guideBtn" class="${guideLines ? 'active' : ''}">Guides: ${guideLines ? 'On' : 'Off'}</button>
      <button id="clearBtn">Clear</button>
      <div class="palette" id="palette"></div>
    `;
    const pal = document.getElementById('palette');
    palette.forEach(c => {
      const s = document.createElement('div');
      s.className = 'swatch' + (c === color ? ' active' : '');
      s.style.background = c;
      s.onclick = () => {
        color = c;
        document.querySelectorAll('.swatch').forEach(el => el.classList.remove('active'));
        s.classList.add('active');
        drawMoldIcon();
      };
      pal.appendChild(s);
    });
    const sel = document.getElementById('mold');
    Object.keys(MOLDS).forEach(k => {
      const o = document.createElement('option');
      o.value = k; o.textContent = MOLDS[k].label;
      if (k === moldName) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { moldName = sel.value; drawMoldIcon(); setTool('stamp'); };
    document.getElementById('moldIcon').onclick = () => setTool('stamp');
    document.querySelectorAll('[data-tool]').forEach(btn => btn.onclick = () => setTool(btn.dataset.tool));
    document.getElementById('moldSize').oninput = e => { moldSize = +e.target.value; setTool('stamp'); };
    document.getElementById('size').oninput = e => size = +e.target.value;
    document.getElementById('cling').oninput = e => cling = +e.target.value;
    document.getElementById('guideBtn').onclick = function() {
      guideLines = !guideLines;
      this.textContent = 'Guides: ' + (guideLines ? 'On' : 'Off');
      this.classList.toggle('active', guideLines);
    };
    document.getElementById('clearBtn').onclick = clearSand;
    document.getElementById('meltBtn').onclick = () => setMelt(!meltOn);
    document.getElementById('dropBtn').onclick = () => { setStampDrop(!stampDrop); setTool('stamp'); hint.textContent = stampDrop ? 'Stamp drop: stamped molds fall, land and settle. Turn it off to stamp in place.' : 'Stamp drop off: molds stamp right where you click.'; };
    drawMoldIcon();
    setTool(tool);
  }
  else if (mode === 'loop') {
    hint.textContent = 'Calm on its own. Touch and drag to swirl the light around you; let go and it drifts home. Tap for a ripple. Gap sets the ring size and how fast it heals.';
    controlsDiv.innerHTML = `
      <button id="resetLoop">Reset Loop</button>
      <label>Speed <input type="range" id="loopSpeed" min="0.2" max="2" step="0.1" value="${loopSpeed}"></label>
      <label>Density <input type="range" id="loopDensity" min="50" max="400" value="${loopDensity}"></label>
      <label title="Bigger gap heals faster: one number sets both">Gap <input type="range" id="loopGap" min="0.5" max="2" step="0.1" value="${loopGap}"> <span id="gapVal">${gapText()}</span></label>
      <button id="trailsBtn" class="${loopTrails ? 'active' : ''}">Trails: ${loopTrails ? 'On' : 'Off'}</button>
      ${colorControlsHTML()}
    `;
    setupColorControls('loop');
    document.getElementById('resetLoop').onclick = initLoop;
    document.getElementById('loopSpeed').oninput = e => loopSpeed = +e.target.value;
    document.getElementById('loopDensity').oninput = e => { loopDensity = +e.target.value; initLoop(); };
    document.getElementById('loopGap').oninput = e => { loopGap = +e.target.value; document.getElementById('gapVal').textContent = gapText(); };
    document.getElementById('trailsBtn').onclick = function() {
      loopTrails = !loopTrails;
      this.textContent = 'Trails: ' + (loopTrails ? 'On' : 'Off');
      this.classList.toggle('active', loopTrails);
    };
    initLoop();
  }
  else if (mode === 'bubbles') {
    hint.textContent = 'Click empty space to blow a bubble. Click and drag a bubble to move it; bring bubbles close to merge them.';
    controlsDiv.innerHTML = `
      <button id="blowBtn">+ Blow Bubble</button>
      <button id="jiggleBtn">Jiggle All</button>
      <button id="popBtn">Pop All</button>
      <label>Surface Tension <input type="range" id="tension" min="0.2" max="1" step="0.05" value="${surfaceTension}"></label>
      ${colorControlsHTML()}
    `;
    setupColorControls('bubbles');
    document.getElementById('blowBtn').onclick = () => blowBubble(width/2, height/2);
    document.getElementById('jiggleBtn').onclick = jiggleBubbles;
    document.getElementById('popBtn').onclick = () => bubbles = [];
    document.getElementById('tension').oninput = e => surfaceTension = +e.target.value;
  }
  else if (mode === 'plate') {
    hint.textContent = 'Sand jumps off the shaking parts and gathers on the still lines. Change Wave N and M for a new figure. Drag to stir, tap to shake.';
    controlsDiv.innerHTML = `
      <label>Wave N <input type="range" id="wn" min="1" max="12" value="${waveN}"></label>
      <label>Wave M <input type="range" id="wm" min="1" max="12" value="${waveM}"></label>
      <button id="scatterBtn">Scatter Sand</button>
      <button id="freezeBtn">${frozen ? 'Resume' : 'Freeze'}</button>
      <button id="soundBtn">${soundOn ? 'Sound: On' : 'Sound: Off'}</button>
      <button id="linesBtn" class="${plateLines ? 'active' : ''}">Lines: ${plateLines ? 'On' : 'Off'}</button>
      ${colorControlsHTML()}
    `;
    setupColorControls('plate');
    document.getElementById('wn').oninput = e => { waveN = +e.target.value; plateBoost = 1; updateSound(); };
    document.getElementById('wm').oninput = e => { waveM = +e.target.value; plateBoost = 1; updateSound(); };
    document.getElementById('scatterBtn').onclick = scatterPlate;
    document.getElementById('freezeBtn').onclick = function() {
      frozen = !frozen;
      this.textContent = frozen ? 'Resume' : 'Freeze';
    };
    document.getElementById('soundBtn').onclick = () => setSound(!soundOn);
    document.getElementById('soundBtn').classList.toggle('active', soundOn);
    document.getElementById('linesBtn').onclick = function() {
      plateLines = !plateLines;
      this.textContent = 'Lines: ' + (plateLines ? 'On' : 'Off');
      this.classList.toggle('active', plateLines);
    };
    scatterPlate();
  }
  else if (mode === 'waves') {
    hint.textContent = 'Each 1D wave has still points (the dots). Where they cross, sand gathers into the 2D pattern. Tap the field to pluck, drag to stir.';
    waveGraphs.classList.add('visible');
    controlsDiv.innerHTML = `
      <label>Horizontal Waves <input type="range" id="hw" min="1" max="8" value="${hWaves}"></label>
      <label>Vertical Waves <input type="range" id="vw" min="1" max="8" value="${vWaves}"></label>
      <button id="resetWaves">Reset Sand</button>
      ${colorControlsHTML()}
    `;
    setupColorControls('waves');
    document.getElementById('hw').oninput = e => { hWaves = +e.target.value; reshakeWaves(); };
    document.getElementById('vw').oninput = e => { vWaves = +e.target.value; reshakeWaves(); };
    document.getElementById('resetWaves').onclick = resetWaveParticles;
    resetWaveParticles();
  }
  else if (mode === 'silk') {
    hint.textContent = 'Drag to paint luminous silk currents.';
    controlsDiv.innerHTML = `
      <label>Flow Mode: <select id="silkMode">${Object.keys(SILK_MODES).map(k => `<option value="${k}">${SILK_MODES[k]}</option>`).join('')}</select></label>
      <label>Palette: <select id="silkPal">${silkPaletteOptions()}</select></label>
      <label>Smoothness: <input type="range" id="silkSmooth" min="0.5" max="2" step="0.05" value="${silk.smooth}"></label>
      <label>Trail Glow: <input type="range" id="silkGlow" min="0" max="1" step="0.05" value="${silk.glow}"></label>
      <button id="silkPause">${silkPaused ? 'Resume' : 'Pause'}</button>
      <button id="silkClear">Clear</button>
      <button id="soundBtn">${soundOn ? 'Sound: On' : 'Sound: Off'}</button>
      <span class="tick-label" id="tickLabel"></span>
    `;
    const ms = document.getElementById('silkMode'), ps = document.getElementById('silkPal');
    ms.value = silk.mode; ps.value = silkPaletteValue();
    ms.onchange = () => { silk.mode = ms.value; saveSilk(); };
    ps.onchange = () => setSilkPalette(ps.value);
    document.getElementById('silkSmooth').oninput = e => { silk.smooth = +e.target.value; saveSilk(); };
    document.getElementById('silkGlow').oninput = e => { silk.glow = +e.target.value; saveSilk(); };
    document.getElementById('silkPause').onclick = function() { silkPaused = !silkPaused; this.textContent = silkPaused ? 'Resume' : 'Pause'; this.classList.toggle('active', silkPaused); };
    document.getElementById('silkClear').onclick = silkClear;
    document.getElementById('soundBtn').onclick = () => setSound(!soundOn);
    document.getElementById('soundBtn').classList.toggle('active', soundOn);
    if (!sX || silkInitW !== width || silkInitH !== height) { silkInit(); silkInitW = width; silkInitH = height; }
  }
  else if (mode === 'crystal') {
    hint.textContent = 'Watch water vapor diffuse inward and freeze onto the hexagonal crystal seed, or click anywhere on the crystal to seed extra frost branches!';
    controlsDiv.innerHTML = `

const TOOL_HINTS = {

function setTool(t) {

// ========== SAND MODE ==========
const CELL = 3;               // grain size in px (one grid cell)
const MAX_FLYING = 5000;      // cap on grains in the air
const EMPTY = 0, LOOSE = 1, LEDGE = 2, STAMP = 3;
let tool = 'pour';
let moldName = 'star';
let moldSize = 60;
let gCols = 0, gRows = 0;
let gType = null, gColor = null, gSticky = null, gPhase = null;
let flying = [];
let sandFrame = 0;
let lastPt = null;
const sandBuf = document.createElement('canvas');
const sandBufCtx = sandBuf.getContext('2d');
let sandImg = null, sandPix = null;
const rgbCache = {};

function hexRgb(h) {
  if (!rgbCache[h]) {
    const n = parseInt(h.slice(1), 16);
    rgbCache[h] = [n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  return rgbCache[h];
}

// Pack a grain color (ABGR for ImageData) with a little natural variation
function grainColor(hex, kind) {
  let [r, g, b] = hexRgb(hex);
  // a few fixed shade steps keep the number of grain sprites small
  let k = 0.8 + ((Math.random() * 6) | 0) * 0.06;
  if (Math.random() < 0.07) k = 1.2;
  if (kind === 'inner') k *= 0.88;
  r *= k; g *= k; b *= k;
  if (kind === 'edge') {
    const w = 0.44;
    r = r + (255 - r) * w; g = g + (255 - g) * w; b = b + (255 - b) * w;
  }
  r = Math.min(255, r | 0); g = Math.min(255, g | 0); b = Math.min(255, b | 0);
  return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
}

function initSandGrid() {
  const nc = Math.max(1, Math.floor(width / CELL));
  const nr = Math.max(1, Math.floor(height / CELL));
  if (gType && nc === gCols && nr === gRows) return;
  const t = new Uint8Array(nc * nr), c = new Uint32Array(nc * nr);
  const s = new Uint8Array(nc * nr), ph = new Uint16Array(nc * nr), ow = new Uint32Array(nc * nr);
  for (let i = 0; i < ph.length; i++) ph[i] = (Math.random() * 1024) | 0;
  if (gType) {
    const dy = nr - gRows; // keep the floor where it is
    for (let y = 0; y < gRows; y++) {
      const ny = y + dy;
      if (ny < 0 || ny >= nr) continue;
      for (let x = 0; x < Math.min(gCols, nc); x++) {
        const o = y * gCols + x, n = ny * nc + x;
        t[n] = gType[o]; c[n] = gColor[o]; s[n] = gSticky[o]; ow[n] = gOwner ? gOwner[o] : 0;
      }
    }
    for (const p of flying) p.y += dy * CELL;
  }
  gType = t; gColor = c; gSticky = s; gPhase = ph; gOwner = ow; gCols = nc; gRows = nr;
  sandBuf.width = nc; sandBuf.height = nr;
  sandImg = sandBufCtx.createImageData(nc, nr);
  sandPix = new Uint32Array(sandImg.data.buffer);
}

function clearSand() {
  flying = [];
  if (typeof fallingMolds !== 'undefined') fallingMolds = [];
  if (gType) { gType.fill(0); gOwner.fill(0); }
  lifted = null;
}

// ---------- Moving placed stamps and ledges ----------
// Every stamp and every ledge stroke gets an id stored per grid cell (gOwner).
// With the Stamp tool, pressing on a placed piece lifts it; releasing sets it down.
let gOwner = null;
let nextObjId = 1, curLedgeId = 0;
let lifted = null;
const LIFT_PAD = 10;

function objectAt(px, py) {
  if (!gOwner) return 0;
  const cx = Math.floor(px / CELL), cy = Math.floor(py / CELL), R = 4;
  let best = 0, bd = 1e9;
  for (let y = cy - R; y <= cy + R; y++) {
    if (y < 0 || y >= gRows) continue;
    for (let x = cx - R; x <= cx + R; x++) {
      if (x < 0 || x >= gCols) continue;
      const i = y * gCols + x, id = gOwner[i];
      if (!id || (gType[i] !== STAMP && gType[i] !== LEDGE)) continue;
      const d = (x - cx) * (x - cx) + (y - cy) * (y - cy);
      if (d < bd) { bd = d; best = id; }
    }
  }
  return best;
}

function pieceCells(id) {
  const out = [];
  let seedType = 0;
  for (let i = 0; i < gOwner.length; i++) {
    if (gOwner[i] !== id || (gType[i] !== STAMP && gType[i] !== LEDGE)) continue;
    out.push(i); seedType = gType[i];
  }
  if (!meltOn || seedType !== STAMP) return out;
  // Melt: every stamp touching this one comes along as one piece
  const seen = new Uint8Array(gType.length), C = gCols, R = gRows;
  for (const i of out) seen[i] = 1;
  for (let q = 0; q < out.length; q++) {
    const i = out[q], x = i % C, y = (i / C) | 0;
    const nb = [x > 0 ? i - 1 : -1, x < C - 1 ? i + 1 : -1, y > 0 ? i - C : -1, y < R - 1 ? i + C : -1];
    for (const j of nb) if (j >= 0 && !seen[j] && gType[j] === STAMP) { seen[j] = 1; out.push(j); }
  }
  return out;
}

function liftObject(id, px, py) {
  const cells = [];
  let minx = 1e9, miny = 1e9, maxx = -1, maxy = -1;
  for (const i of pieceCells(id)) {
    const x = i % gCols, y = (i / gCols) | 0;
    cells.push(x, y, gType[i], gColor[i], gOwner[i], gPhase[i]);
    gType[i] = EMPTY; gOwner[i] = 0;
    if (x < minx) minx = x; if (x > maxx) maxx = x;
    if (y < miny) miny = y; if (y > maxy) maxy = y;
  }
  if (!cells.length) return false;
  // pre-render the piece once, with a soft glow, so dragging stays smooth
  const d = window.devicePixelRatio || 1;
  const { base, wCss, hCss } = renderPiece(cells, minx, miny, maxx, maxy, LIFT_PAD);
  const img = document.createElement('canvas');
  img.width = base.width; img.height = base.height;
  const ic = img.getContext('2d');
  ic.shadowColor = 'rgba(255,255,255,0.45)';
  ic.shadowBlur = 8 * d;
  ic.drawImage(base, 0, 0);
  ic.shadowBlur = 0;
  ic.drawImage(base, 0, 0);
  lifted = { id, cells, minx, miny, maxx, maxy, img, wCss, hCss, grabX: px, grabY: py };
  canvas.style.cursor = 'grabbing';
  if (typeof blip === 'function') blip('sine', 520, 880, 0.12, 0.05);
  return true;
}

function dropObject(px, py) {
  const L = lifted;
  lifted = null;
  canvas.style.cursor = '';
  if (!L || !gType) return;
  let dx = Math.round((px - L.grabX) / CELL), dy = Math.round((py - L.grabY) / CELL);
  // keep the whole piece on the canvas
  dx = Math.max(-L.minx, Math.min(gCols - 1 - L.maxx, dx));
  dy = Math.max(-L.miny, Math.min(gRows - 1 - L.maxy, dy));
  const displaced = [];
  for (let k = 0; k < L.cells.length; k += 6) {
    const x = L.cells[k] + dx, y = L.cells[k + 1] + dy;
    if (x < 0 || x >= gCols || y < 0 || y >= gRows) continue;
    const i = y * gCols + x;
    if (gType[i] === LOOSE) displaced.push(x, gColor[i]);
    gType[i] = L.cells[k + 2]; gColor[i] = L.cells[k + 3]; gOwner[i] = L.cells[k + 4];
  }
  // sand that was under the new spot is lifted onto the top of the piece and settles again
  const topY = (L.miny + dy) * CELL;
  for (let k = 0; k < displaced.length && flying.length < MAX_FLYING * 2; k += 2) {
    flying.push({
      x: (displaced[k] + 0.5) * CELL + (Math.random() - 0.5) * 2,
      y: topY - CELL * (1 + Math.random() * 4),
      vx: (Math.random() - 0.5) * 1.5, vy: 0, c: displaced[k + 1]
    });
  }
  if (typeof blip === 'function') blip('triangle', 720, 360, 0.15, 0.06);
}

function drawLifted() {
  if (!lifted) return;
  const L = lifted;
  const x = L.minx * CELL - LIFT_PAD + (mouse.x - L.grabX);
  const y = L.miny * CELL - LIFT_PAD + (mouse.y - L.grabY) - 4; // a small lift
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.globalAlpha = 0.6;
  ctx.drawImage(L.img, x + 3, y + 7, L.wCss, L.hCss);   // soft drop shadow
  ctx.globalAlpha = 1;
  ctx.drawImage(L.img, x, y, L.wCss, L.hCss);
  ctx.restore();
}

function sandHover(p) {
  if (lifted) return;
  canvas.style.cursor = tool === 'stamp' && objectAt(p.x, p.y) ? 'grab' : '';
}

// ---------- Matte molds + Melt ----------
// Stamps and ledges render as matte kinetic sand on their own cached layer:
// one pixel per cell, scaled up smoothly, shaded by a small 5x5 height estimate, with fine grain on top.
// Layered: each piece is shaded on its own, with a light rim. Melt: overlapping stamps share one surface.
let meltOn = (() => { try { return localStorage.getItem('sparkleMelt') === '1'; } catch (e) { return false; } })();
let matteBuf = null, matteBufCtx = null, matteImg = null, mattePix = null, matteLayer = null, matteCtx = null;
let pMT = null, pMO = null, pMC = null, mDirty = null, grainPat = null, grainPatDpr = 0;

function moldColor(hex) {
  // muted, non-shiny version of the palette color
  const [r, g, b] = hexRgb(hex);
  const L = 0.3 * r + 0.59 * g + 0.11 * b, k = 0.88;
  const m = v => Math.min(255, (v + (L - v) * 0.32) * k | 0);
  return ((255 << 24) | (m(b) << 16) | (m(g) << 8) | m(r)) >>> 0;
}

// packed ABGR color for cell (x, y), or 0 when nothing matte is drawn there
function matteRGB(T, O, Col, PH, F, C, R, x, y, melt) {
  const i = y * C + x;
  let tt = T[i];
  const own = O[i];
  if (tt === LOOSE) return looseRGB(T, Col, PH, C, R, x, y);
  let fill = false;
  if (tt !== STAMP && tt !== LEDGE) {
    if (!melt || tt !== EMPTY || !F[i]) return 0;
    tt = STAMP; fill = true;
  }
  let lit = 0, n = 0, r = 0, g = 0, b = 0, cn = 0, edge = false;
  const blend = melt && tt === STAMP;
  // F[j] marks seam cells filled in Melt; they count as surface but carry no color of their own
  for (let dy = -2; dy <= 2; dy++) {
    const yy = y + dy;
    for (let dx = -2; dx <= 2; dx++) {
      const xx = x + dx;
      let s = false, j = 0;
      if (xx >= 0 && yy >= 0 && xx < C && yy < R) {
        j = yy * C + xx;
        s = (T[j] === tt && (melt || O[j] === own)) || (blend && F[j] === 1) || T[j] === LOOSE;
      }
      if (!s) { if (Math.abs(dx) + Math.abs(dy) === 1) edge = true; continue; }
      n++; lit += dx + dy;
      if ((blend || (!dx && !dy)) && T[j] === tt) {
        const c = Col[j]; r += c & 255; g += (c >> 8) & 255; b += (c >> 16) & 255; cn++;
      }
    }
  }
  if (!cn) return 0;
  r /= cn; g /= cn; b /= cn;
  // light from the top left, edges round off a little
  let k = (1 + 0.24 * lit / 15) * (0.8 + 0.2 * n / 25);
  k *= 0.94 + (((PH[i] * 7) >> 2) & 15) / 15 * 0.12;  // fine grain
  if (fill) k *= 0.96;
  r *= k; g *= k; b *= k;
  if (edge && !melt) { const w = 0.16; r += (255 - r) * w; g += (255 - g) * w; b += (255 - b) * w; }
  r = Math.min(255, r | 0); g = Math.min(255, g | 0); b = Math.min(255, b | 0);
  return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
}

// Poured sand: soft and calm. Color is half its own, half the 3x3 average (low contrast),
// shading is gentler than the molds, and molds count as support so the pile and the mold share one surface.
function looseRGB(T, Col, PH, C, R, x, y) {
  const i = y * C + x;
  let lit = 0, n = 0, r = 0, g = 0, b = 0, cn = 0;
  for (let dy = -2; dy <= 2; dy++) {
    const yy = y + dy;
    if (yy < 0) continue;
    for (let dx = -2; dx <= 2; dx++) {
      const xx = x + dx;
      if (xx < 0 || xx >= C) continue;
      if (yy >= R) { n++; lit += dx + dy; continue; }   // the floor holds sand up
      const j = yy * C + xx, t = T[j];
      if (t === EMPTY) continue;
      n++; lit += dx + dy;
      if (t === LOOSE && dx * dx <= 1 && dy * dy <= 1) {
        const c = Col[j]; r += c & 255; g += (c >> 8) & 255; b += (c >> 16) & 255; cn++;
      }
    }
  }
  const c = Col[i];
  r = ((c & 255) + r / cn) / 2; g = (((c >> 8) & 255) + g / cn) / 2; b = (((c >> 16) & 255) + b / cn) / 2;
  let k = (1 + 0.14 * lit / 15) * (0.86 + 0.14 * n / 25);
  k *= 0.92 + (((PH[i] * 7) >> 2) & 15) / 15 * 0.16;
  r = Math.min(255, r * k | 0); g = Math.min(255, g * k | 0); b = Math.min(255, b * k | 0);
  return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
}

// palette tone for poured sand: close to the molds, a touch brighter, small grain to grain change
function pourColor(hex) {
  const [r, g, b] = hexRgb(hex);
  const L = 0.3 * r + 0.59 * g + 0.11 * b;
  const k = 0.93 + ((Math.random() * 4) | 0) * 0.03;
  const m = v => Math.min(255, (v + (L - v) * 0.22) * k | 0);
  return ((255 << 24) | (m(b) << 16) | (m(g) << 8) | m(r)) >>> 0;
}

// Melt: a gap of up to about 14 cells between two different shapes fills in, like sand settling into the seam
const SEAM_DIRS = [1, 0, 0, 1, 1, 1, 1, -1], SEAM_REACH = 7;
function stampOwnerAt(T, O, C, R, x, y) {
  if (x < 0 || y < 0 || x >= C || y >= R) return 0;
  const j = y * C + x;
  return T[j] === STAMP ? O[j] || 1 : 0;
}
function seamFill(T, O, C, R, x, y) {
  for (let k = 0; k < 8; k += 2) {
    const ux = SEAM_DIRS[k], uy = SEAM_DIRS[k + 1];
    let a = 0, b = 0;
    for (let d = 1; d <= SEAM_REACH && !a; d++) a = stampOwnerAt(T, O, C, R, x + d * ux, y + d * uy);
    if (!a) continue;
    for (let d = 1; d <= SEAM_REACH && !b; d++) b = stampOwnerAt(T, O, C, R, x - d * ux, y - d * uy);
    if (b && b !== a) return true;
  }
  return false;
}

// cell color with a soft alpha edge: the alpha follows how much of the 3x3 around it is mold,
// so stair steps turn into smooth slopes once the layer is scaled up
function mattePixel(T, O, Col, PH, F, C, R, x, y, melt) {
  let cnt = 0, nb = -1;
  for (let dy = -1; dy <= 1; dy++) {
    const yy = y + dy;
    if (yy < 0 || yy >= R) continue;
    for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx;
      if (xx < 0 || xx >= C) continue;
      const t = T[yy * C + xx];
      if (t !== EMPTY || F[yy * C + xx]) { cnt++; if (nb < 0 || (dx === 0 || dy === 0)) nb = yy * C + xx; }
    }
  }
  if (!cnt) return 0;
  let v = matteRGB(T, O, Col, PH, F, C, R, x, y, melt);
  const self = T[y * C + x];
  if (v) { if (cnt < 9 && self === LOOSE) cnt = Math.max(cnt, 3.9); else if (cnt < 9 && self !== EMPTY) cnt = Math.max(cnt, 5); else if (cnt < 9) cnt = Math.max(cnt + 2, 6); }
  else {
    if (cnt < 3) return 0;
    v = matteRGB(T, O, Col, PH, F, C, R, nb % C, (nb / C) | 0, melt);
    if (!v) return 0;
  }
  const a = Math.max(0, Math.min(1, (cnt - 2.5) / 4.5));
  if (a <= 0) return 0;
  return ((v & 0xffffff) | ((a * 255 | 0) << 24)) >>> 0;
}

let fillMask = null;
const NOFILL = { length: 0 };   // reads as undefined (no fill) everywhere
function computeFill(F, T, O, C, R, xs, ys, xe, ye) {
  for (let y = Math.max(0, ys); y < Math.min(R, ye); y++)
    for (let x = Math.max(0, xs), i = y * C + x; x < Math.min(C, xe); x++, i++)
      F[i] = T[i] === EMPTY && seamFill(T, O, C, R, x, y) ? 1 : 0;
}

function grainPattern(c) {
  const d = window.devicePixelRatio || 1;
  if (grainPat && grainPatDpr === d) return grainPat;
  const S = 96;
  const pc = document.createElement('canvas');
  pc.width = pc.height = S;
  const g = pc.getContext('2d');
  const img = g.createImageData(S, S), p = img.data;
  for (let k = 0; k < S * S; k++) {
    const v = Math.random();
    if (v < 0.16) { p[k * 4 + 3] = 46; }                                   // dark speck
    else if (v > 0.9) { p[k * 4] = p[k * 4 + 1] = p[k * 4 + 2] = 255; p[k * 4 + 3] = 22; } // pale speck
  }
  g.putImageData(img, 0, 0);
  grainPat = c.createPattern(pc, 'repeat');
  grainPat.setTransform(new DOMMatrix().scale(1 / d, 1 / d));
  grainPatDpr = d;
  return grainPat;
}

function ensureMatteLayer() {
  const d = window.devicePixelRatio || 1;
  if (matteLayer && pMT && pMT.length === gType.length && matteLayer._c === gCols && matteLayer._d === d) return;
  matteBuf = document.createElement('canvas');
  matteBuf.width = gCols; matteBuf.height = gRows;
  matteBufCtx = matteBuf.getContext('2d');
  matteImg = matteBufCtx.createImageData(gCols, gRows);
  mattePix = new Uint32Array(matteImg.data.buffer);
  matteLayer = document.createElement('canvas');
  matteLayer.width = Math.round(gCols * CELL * d); matteLayer.height = Math.round(gRows * CELL * d);
  matteLayer._c = gCols; matteLayer._d = d;
  matteCtx = matteLayer.getContext('2d');
  matteCtx.setTransform(d, 0, 0, d, 0, 0);
  matteCtx.imageSmoothingEnabled = true;
  matteCtx.imageSmoothingQuality = 'high';
  pMT = new Uint8Array(gType.length).fill(255);
  fillMask = new Uint8Array(gType.length);
  pMO = new Uint32Array(gType.length);
  pMC = new Uint32Array(gType.length);
  mDirty = new Uint8Array(tilesX * tilesY);
}

function markMatte(x, y) {
  // shading looks 2 cells around, so changes near a tile border touch the next tile too
  // (in Melt, seam fill reaches further)
  const m = meltOn ? SEAM_REACH + 3 : 3;
  const tx = (x / TILE) | 0, ty = (y / TILE) | 0, lx = x - tx * TILE, ly = y - ty * TILE;
  const x0 = lx < m && tx > 0 ? tx - 1 : tx, x1 = lx > TILE - 1 - m && tx < tilesX - 1 ? tx + 1 : tx;
  const y0 = ly < m && ty > 0 ? ty - 1 : ty, y1 = ly > TILE - 1 - m && ty < tilesY - 1 ? ty + 1 : ty;
  for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) mDirty[yy * tilesX + xx] = 1;
}

function updateMatteLayer() {
  ensureMatteLayer();
  const T = gType, O = gOwner, Col = gColor, C = gCols, R = gRows;
  let nd = 0;
  for (let y = 0, i = 0; y < R; y++) {
    for (let x = 0; x < C; x++, i++) {
      const t = T[i], mt = t;
      if (mt !== pMT[i] || (mt && (Col[i] !== pMC[i] || O[i] !== pMO[i]))) {
        pMT[i] = mt; pMC[i] = Col[i]; pMO[i] = O[i];
        markMatte(x, y);
        nd++;
      }
    }
  }
  const any = mDirty.indexOf(1);
  if (any < 0) return;
  const melt = meltOn;
  const list = [];
  for (let k = any; k < mDirty.length; k++) {
    if (!mDirty[k]) continue;
    mDirty[k] = 0;
    const tx = k % tilesX, ty = (k / tilesX) | 0;
    const xs = tx * TILE, ys = ty * TILE, xe = Math.min(C, xs + TILE), ye = Math.min(R, ys + TILE);
    if (melt) computeFill(fillMask, T, O, C, R, xs - 3, ys - 3, xe + 3, ye + 3);
    for (let y = ys; y < ye; y++) for (let x = xs; x < xe; x++) mattePix[y * C + x] = mattePixel(T, O, Col, gPhase, melt ? fillMask : NOFILL, C, R, x, y, melt);
    matteBufCtx.putImageData(matteImg, 0, 0, xs, ys, xe - xs, ye - ys);
    list.push(xs, ys, xe, ye);
  }
  const mc = matteCtx, pat = grainPattern(mc);
  for (let k = 0; k < list.length; k += 4) {
    const xs = list[k], ys = list[k + 1], xe = list[k + 2], ye = list[k + 3];
    const sx = Math.max(0, xs - 2), sy = Math.max(0, ys - 2), ex = Math.min(C, xe + 2), ey = Math.min(R, ye + 2);
    mc.save();
    mc.beginPath(); mc.rect(xs * CELL, ys * CELL, (xe - xs) * CELL, (ye - ys) * CELL); mc.clip();
    mc.clearRect(xs * CELL, ys * CELL, (xe - xs) * CELL, (ye - ys) * CELL);
    mc.drawImage(matteBuf, sx, sy, ex - sx, ey - sy, sx * CELL, sy * CELL, (ex - sx) * CELL, (ey - sy) * CELL);
    mc.globalCompositeOperation = 'source-atop';
    mc.fillStyle = pat;
    mc.fillRect(xs * CELL, ys * CELL, (xe - xs) * CELL, (ye - ys) * CELL);
    mc.restore();
  }
}

// render a lifted piece the same matte way, on its own small canvas (CSS px size w x h)
function renderPiece(cells, minx, miny, maxx, maxy, pad) {
  const lw = maxx - minx + 1 + 4, lh = maxy - miny + 1 + 4;   // 2-cell margin for shading
  const T = new Uint8Array(lw * lh), O = new Uint32Array(lw * lh), Col = new Uint32Array(lw * lh), PH = new Uint16Array(lw * lh);
  for (let k = 0; k < cells.length; k += 6) {
    const j = (cells[k + 1] - miny + 2) * lw + (cells[k] - minx + 2);
    T[j] = cells[k + 2]; Col[j] = cells[k + 3]; O[j] = cells[k + 4]; PH[j] = cells[k + 5];
  }
  const sb = document.createElement('canvas'); sb.width = lw; sb.height = lh;
  const sc = sb.getContext('2d'), im = sc.createImageData(lw, lh), px = new Uint32Array(im.data.buffer);
  const F = new Uint8Array(lw * lh);
  if (meltOn) computeFill(F, T, O, lw, lh, 0, 0, lw, lh);
  for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) px[y * lw + x] = mattePixel(T, O, Col, PH, F, lw, lh, x, y, meltOn);
  sc.putImageData(im, 0, 0);
  const d = window.devicePixelRatio || 1;
  const wCss = (maxx - minx + 1) * CELL + pad * 2, hCss = (maxy - miny + 1) * CELL + pad * 2;
  const base = document.createElement('canvas');
  base.width = Math.ceil(wCss * d); base.height = Math.ceil(hCss * d);
  const bc = base.getContext('2d');
  bc.setTransform(d, 0, 0, d, 0, 0);
  bc.imageSmoothingEnabled = true; bc.imageSmoothingQuality = 'high';
  bc.drawImage(sb, pad - 2 * CELL, pad - 2 * CELL, lw * CELL, lh * CELL);
  bc.globalCompositeOperation = 'source-atop';
  bc.fillStyle = grainPattern(bc);
  bc.fillRect(0, 0, wCss, hCss);
  bc.globalCompositeOperation = 'source-over';
  return { base, wCss, hCss };
}

function setMelt(on) {
  if (lifted) dropObject(mouse.x, mouse.y);
  meltOn = on;
  try { localStorage.setItem('sparkleMelt', on ? '1' : '0'); } catch (e) {}
  if (pMT) pMT.fill(255);   // reshade every mold; the shapes themselves are untouched
  const b = document.getElementById('meltBtn');
  if (b) { b.textContent = on ? 'Melt' : 'Layered'; b.classList.toggle('active', on); }
  if (mode === 'sand') {
    hint.textContent = on ? 'Melt: overlapping shapes blend into one pile and move together.'
                          : 'Layered: each shape keeps its own edge and moves on its own.';
    hint.classList.remove('faded');
  }
  if (typeof blip === 'function') blip('sine', on ? 300 : 420, on ? 200 : 520, 0.18, 0.04);
}

// ---------- Molds ----------
function poly(g, pts) {
  g.beginPath();
  pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  g.closePath();
  g.fill();
}
function disc(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function cut(g, fn) { g.globalCompositeOperation = 'destination-out'; fn(); g.globalCompositeOperation = 'source-over'; }
function starPts(n, ro, ri, dy) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n;
    const r = i % 2 ? ri : ro;
    pts.push([Math.cos(a) * r, Math.sin(a) * r + (dy || 0)]);
  }
  return pts;
}
function ngon(n, r, a0) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = a0 + i * Math.PI * 2 / n;
    pts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  return pts;
}

// Each mold draws itself in a -1..1 box (y down)

  heart: { label: 'Heart', draw: g => {

    for (let i = 0; i < 80; i++) {

      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      pts.push([x / 16.5, y / 16.5 - 0.15]);
    }
    poly(g, pts);
  } },
  circle: { label: 'Circle', draw: g => disc(g, 0, 0, 0.95) },
  square: { label: 'Square', draw: g => { g.beginPath(); g.roundRect(-0.85, -0.85, 1.7, 1.7, 0.1); g.fill(); } },

  moon: { label: 'Moon', draw: g => {

  hexagon: { label: 'Hexagon', draw: g => poly(g, ngon(6, 0.97, -Math.PI / 2)) },
  ring: { label: 'Ring', draw: g => {

  cloud: { label: 'Cloud', draw: g => {

  } },
  drop: { label: 'Drop', draw: g => {

  } },
  leaf: { label: 'Leaf', draw: g => {

    cut(g, () => {

  } },
  spiral: { label: 'Swirl', draw: g => {

      const r = 0.05 + t * 0.82;

    }
    g.stroke();
  } },
  house: { label: 'House', draw: g => {
    poly(g, [[-0.97, 0], [0, -0.88], [0.97, 0]]);
    g.fillRect(-0.72, -0.1, 1.44, 1.02);
    g.fillRect(0.38, -0.85, 0.22, 0.5);
    cut(g, () => {
      g.fillRect(-0.16, 0.38, 0.32, 0.6);
      g.fillRect(-0.55, 0.1, 0.26, 0.24);
      g.fillRect(0.29, 0.1, 0.26, 0.24);
    });
  } },
  fish: { label: 'Fish', draw: g => {
    g.beginPath(); g.ellipse(-0.15, 0, 0.66, 0.44, 0, 0, Math.PI * 2); g.fill();
    poly(g, [[0.3, 0], [0.97, -0.52], [0.85, 0], [0.97, 0.52]]);
    cut(g, () => {
      disc(g, -0.5, -0.1, 0.09);
      g.lineWidth = 0.07;

    });
  } },
  butterfly: { label: 'Butterfly', draw: g => {

    g.beginPath(); g.ellipse(0.47, -0.32, 0.47, 0.34, -0.6, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(-0.36, 0.42, 0.34, 0.25, -0.6, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(0.36, 0.42, 0.34, 0.25, 0.6, 0, Math.PI * 2); g.fill();
    cut(g, () => g.fillRect(-0.15, -1, 0.3, 2));
    g.beginPath(); g.ellipse(0, 0.02, 0.08, 0.66, 0, 0, Math.PI * 2); g.fill();
    g.lineWidth = 0.08; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-0.03, -0.6); g.lineTo(-0.3, -0.95); g.moveTo(0.03, -0.6); g.lineTo(0.3, -0.95); g.stroke();
  } },
};

const moldCanvas = document.createElement('canvas');
const moldCtx = moldCanvas.getContext('2d', { willReadFrequently: true });
const maskCache = {};

function moldMask(name, n) {
  const key = name + ':' + n;
  if (maskCache[key]) return maskCache[key];
  moldCanvas.width = n; moldCanvas.height = n;
  const g = moldCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, n, n);
  g.globalCompositeOperation = 'source-over';
  const s = n / 2;
  g.setTransform(s, 0, 0, s, s, s);
  g.fillStyle = '#fff'; g.strokeStyle = '#fff';
  MOLDS[name].draw(g);
  const d = g.getImageData(0, 0, n, n).data;
  const m = new Uint8Array(n * n);
  for (let i = 0; i < n * n; i++) m[i] = d[i * 4 + 3] > 120 ? 1 : 0;
  maskCache[key] = m;
  return m;
}

function drawMoldIcon() {
  const ic = document.getElementById('moldIcon');
  if (!ic) return;
  const g = ic.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, ic.width, ic.height);
  const s = ic.width / 2;
  g.setTransform(s * 0.9, 0, 0, s * 0.9, s, s);
  g.fillStyle = color; g.strokeStyle = color;
  g.globalCompositeOperation = 'source-over';
  MOLDS[moldName].draw(g);
  g.globalCompositeOperation = 'source-over';
}

function stampMold(px, py) {
  initSandGrid();
  const n = Math.max(8, Math.round(2 * moldSize / CELL));
  const m = moldMask(moldName, n);
  const x0 = Math.round(px / CELL - n / 2), y0 = Math.round(py / CELL - n / 2);
  const id = nextObjId++, mc = moldColor(color);
  for (let y = 0; y < n; y++) {
    const gy = y0 + y;
    if (gy < 0 || gy >= gRows) continue;
    for (let x = 0; x < n; x++) {
      if (!m[y * n + x]) continue;
      const gx = x0 + x;
      if (gx < 0 || gx >= gCols) continue;
      const i = gy * gCols + gx;
      if (gType[i] === LEDGE) continue;
      gType[i] = STAMP;
      gOwner[i] = id;
      gColor[i] = mc;
    }
  }
}

// ---------- Pour / carve / ledge ----------
function pourSand() {
  if (!mouse.down || tool !== 'pour') return;
  const spread = 4 + size * 3;
  const n = 3 + Math.round(size * 1.5);
  for (let k = 0; k < n && flying.length < MAX_FLYING; k++) {
    flying.push({
      x: mouse.x + (Math.random() - 0.5) * spread,
      y: mouse.y + (Math.random() - 0.5) * spread * 0.5,
      vx: (Math.random() - 0.5) * 1.2,
      vy: Math.random() * 1.5 + 0.5,
      c: pourColor(color)
    });
  }
}

function eachOnSegment(a, b, stepLen, fn) {
  const d = Math.hypot(b.x - a.x, b.y - a.y);
  const steps = Math.max(1, Math.ceil(d / stepLen));
  for (let s = 0; s <= steps; s++) {
    const t = s / steps;
    fn(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
  }
}

function carveAt(px, py) {
  const r = (6 + size * 4) / CELL;
  const cx = px / CELL, cy = py / CELL;
  for (let gy = Math.floor(cy - r); gy <= Math.ceil(cy + r); gy++) {
    if (gy < 0 || gy >= gRows) continue;
    for (let gx = Math.floor(cx - r); gx <= Math.ceil(cx + r); gx++) {
      if (gx < 0 || gx >= gCols) continue;
      const dx = gx + 0.5 - cx, dy = gy + 0.5 - cy;
      const d2 = dx * dx + dy * dy;
      if (d2 > r * r) continue;
      const i = gy * gCols + gx;
      const t = gType[i];
      if (t !== LOOSE && t !== STAMP) continue;
      gType[i] = EMPTY;
      gOwner[i] = 0;
      // push some grains out to the sides of the brush
      if (Math.random() < 0.3 && flying.length < MAX_FLYING) {
        const d = Math.sqrt(d2) || 1;
        flying.push({
          x: (gx + 0.5) * CELL, y: (gy + 0.5) * CELL,
          vx: dx / d * (1.5 + Math.random() * 2),
          vy: dy / d * (1.5 + Math.random() * 2) - 1.5,
          c: gColor[i]
        });
      }
    }
  }
}

function ledgeAt(px, py) {
  const w = 1 + Math.floor(size / 3);
  const gx0 = Math.round(px / CELL - w / 2), gy0 = Math.round(py / CELL - w / 2);
  for (let gy = gy0; gy < gy0 + w; gy++) {
    if (gy < 0 || gy >= gRows) continue;
    for (let gx = gx0; gx < gx0 + w; gx++) {
      if (gx < 0 || gx >= gCols) continue;
      const i = gy * gCols + gx;
      if (gType[i] === LEDGE) continue;
      gType[i] = LEDGE;
      gOwner[i] = curLedgeId;
      gColor[i] = ((255 << 24) | (176 << 16) | (184 << 8) | 196) >>> 0;
    }
  }
}

function sandDown(p) {
  initSandGrid();
  hint.classList.add('faded');
  lastPt = { x: p.x, y: p.y };
  if (lifted) dropObject(p.x, p.y);
  if (tool === 'stamp') {
    // press on a placed shape or ledge to pick it up; press on empty space to stamp
    const id = objectAt(p.x, p.y);
    if (!(id && liftObject(id, p.x, p.y))) { if (stampDrop) spawnFallingMold(p.x, p.y); else stampMold(p.x, p.y); }
  }
  else if (tool === 'carve') carveAt(p.x, p.y);
  else if (tool === 'ledge') { curLedgeId = nextObjId++; ledgeAt(p.x, p.y); }
}

function sandMove(p) {
  if (!mouse.down) sandHover(p);
  if (!mouse.down || !lastPt || lifted) return;
  if (tool === 'carve') eachOnSegment(lastPt, p, (6 + size * 4) * 0.5, carveAt);
  else if (tool === 'ledge') eachOnSegment(lastPt, p, CELL * 0.7, ledgeAt);
  lastPt = { x: p.x, y: p.y };
}

// ---------- Physics ----------
function settleGrain(p) {
  let cx = Math.min(gCols - 1, Math.max(0, (p.x / CELL) | 0));
  let cy = Math.min(gRows - 1, Math.floor(p.y / CELL));
  if (cy < 0) return;
  // if a settled grain slipped into this spot, sit just above it (never climb far)
  const lim = cy - 2;
  while (cy >= 0 && cy >= lim && gType[cy * gCols + cx] !== EMPTY) cy--;
  if (cy < 0 || cy < lim) return;
  const i = cy * gCols + cx;
  gType[i] = LOOSE;
  gColor[i] = p.c;
  gSticky[i] = Math.random() < cling ? 1 : 0;
}

function updateFlying() {
  const G = 0.25, maxV = 9, W = gCols * CELL - 0.01;
  const keep = [];
  for (const p of flying) {
    p.vy = Math.min(p.vy + G, maxV);
    p.vx *= 0.985;
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(p.vx), Math.abs(p.vy)) / (CELL * 0.8)));
    let landed = false;
    for (let s = 0; s < steps; s++) {
      let nx = p.x + p.vx / steps, ny = p.y + p.vy / steps;
      if (nx < 0) { nx = 0; p.vx = Math.abs(p.vx) * 0.4; }
      else if (nx > W) { nx = W; p.vx = -Math.abs(p.vx) * 0.4; }
      const cx = (nx / CELL) | 0, cy = Math.floor(ny / CELL);
      if (cy >= gRows) { landed = true; break; }
      if (cy >= 0 && gType[cy * gCols + cx] !== EMPTY) {
        const ox = (p.x / CELL) | 0;
        // side hit while falling: drop straight instead
        if (cx !== ox && gType[cy * gCols + ox] === EMPTY && p.vy > 0) {
          p.vx *= -0.3; p.y = ny; continue;
        }
        if (p.vy < 0) { p.vy = 0; p.vx *= 0.5; continue; }
        landed = true; break;
      }
      p.x = nx; p.y = ny;
    }
    if (landed) settleGrain(p); else keep.push(p);

}

// Settled grains: fall if unsupported, slide down diagonally unless they cling
function updateGrid() {
  const C = gCols, R = gRows, T = gType, S = gSticky, Col = gColor;
  const flip = sandFrame & 1;
  for (let y = R - 2; y >= 0; y--) {
    const row = y * C, below = row + C;
    for (let k = 0; k < C; k++) {
      const x = flip ? k : C - 1 - k;
      const i = row + x;
      if (T[i] !== LOOSE) continue;
      if (T[below + x] === EMPTY) {
        // long drops become falling grains; one-cell drops stay in the grid
        if (y + 2 < R && T[below + C + x] === EMPTY && flying.length < MAX_FLYING * 2) {
          flying.push({ x: (x + 0.5) * CELL, y: (y + 0.5) * CELL, vx: 0, vy: 1, c: Col[i] });
          T[i] = EMPTY;
        } else {
          T[below + x] = LOOSE; Col[below + x] = Col[i]; S[below + x] = S[i]; T[i] = EMPTY;
        }
        continue;
      }
      const dl = x > 0 ? T[below + x - 1] !== EMPTY : true;
      const dr = x < C - 1 ? T[below + x + 1] !== EMPTY : true;
      if (dl && dr) continue;
      let dir;
      if (!dl && !dr) dir = Math.random() < 0.5 ? -1 : 1;
      else dir = dl ? 1 : -1;
      if (T[i + dir] !== EMPTY) continue;
      // clingy grains hold on unless the drop on that side is steep
      if (S[i]) {
        const two = below + C + x + dir;
        if (y + 2 >= R || T[two] !== EMPTY) continue;
      }
      const j = below + x + dir;
      T[j] = LOOSE; Col[j] = Col[i]; S[j] = S[i]; T[i] = EMPTY;
    }
  }
}

function updateSand() {
  initSandGrid();
  sandFrame++;
  pourSand();
  updateFallingMolds();
  updateFlying();
  updateGrid();
  sandFrame++;
  updateGrid();
}

function drawSand() {
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, width, height);

  if (guideLines) {
    ctx.strokeStyle = 'rgba(0,212,255,0.15)';
    ctx.lineWidth = 1;
    for (let x = 0; x < width; x += 50) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
    }
    for (let y = 0; y < height; y += 50) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
    }
    ctx.beginPath();
    for (let r = 50; r < Math.max(width, height); r += 50) {
      ctx.moveTo(width / 2 + r, height / 2);
      ctx.arc(width / 2, height / 2, r, 0, Math.PI * 2);
    }
    ctx.stroke();
  }
  if (!gType) return;

  // Settled grains live on a cached full-resolution layer; only tiles that changed get redrawn.
  const T = gType, Col = gColor, ph = gPhase, f = sandFrame, C = gCols, R = gRows;
  const atlas = sandAtlas();
  ensureSandLayer();
  const glints = [];
  const pT = prevT, pC = prevC, TD = tileDirty, TX = tilesX;
  for (let y = 0; y < R; y++) {
    const ty = (y / TILE) | 0, ly = y - ty * TILE;
    for (let x = 0, i = y * C; x < C; x++, i++) {
      const t = T[i];
      if (t !== pT[i] || (t !== EMPTY && Col[i] !== pC[i])) {
        pT[i] = t; pC[i] = Col[i];
        const tx = (x / TILE) | 0, lx = x - tx * TILE;
        // dots spill a little into the neighbor cells, so mark bordering tiles too
        const x0 = lx === 0 && tx > 0 ? tx - 1 : tx, x1 = lx === TILE - 1 && tx < TX - 1 ? tx + 1 : tx;
        const y0 = ly === 0 && ty > 0 ? ty - 1 : ty, y1 = ly === TILE - 1 && ty < tilesY - 1 ? ty + 1 : ty;
        for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) TD[yy * TX + xx] = 1;
      }
      if (t === LOOSE && (ph[i] & 3) === 0 && glints.length < 90) {
        const a = (ph[i] * 4 + (f >> 1)) & 4095;
        if (a < GLINT_LEN) glints.push(grainX(i, t), grainY(i, t), a);
      }
    }
  }
  const lc = layerCtx;
  for (let k = 0; k < TD.length; k++) {
    if (!TD[k]) continue;
    TD[k] = 0;
    const tx = k % TX, ty = (k / TX) | 0;
    const px = tx * TILE * CELL, py = ty * TILE * CELL, pw = TILE * CELL;
    lc.save();
    lc.beginPath(); lc.rect(px, py, pw, pw); lc.clip();
    lc.clearRect(px, py, pw, pw);
    const xs = Math.max(0, tx * TILE - 1), xe = Math.min(C - 1, tx * TILE + TILE);
    const ys = Math.max(0, ty * TILE - 1), ye = Math.min(R - 1, ty * TILE + TILE);
    for (let y = ys; y <= ye; y++) {
      for (let x = xs, i = y * C + xs; x <= xe; x++, i++) {
        const t = T[i];
      }
    }
    lc.restore();
  }
  updateMatteLayer();
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(matteLayer, 0, 0, C * CELL, R * CELL);
  drawFallingMolds();
  drawLifted();
  const SP = SPR_PX;
  for (const p of flying) {
    const idx = grainSprite(p.c);
    ctx.drawImage(atlas, (idx % SPR_COLS) * SP, ((idx / SPR_COLS) | 0) * SP, SP, SP,
      p.x - SPR_CSS / 2, p.y - SPR_CSS / 2, SPR_CSS, SPR_CSS);
  }

  // soft twinkling sparkles, added light
  if (glints.length) {
    const spk = sparkleSprite();
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < glints.length; k += 3) {
      const a = glints[k + 2] / GLINT_LEN;
      const tw = Math.sin(a * Math.PI);           // fade in and out
      const s = SPARK_CSS * (0.55 + 0.45 * tw);
      ctx.globalAlpha = tw * 0.5;
      ctx.drawImage(spk, glints[k] - s / 2, glints[k + 1] - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ---------- grain + sparkle sprites (drawn once per color at full screen resolution) ----------
const SPR_CSS = 5, SPR_COLS = 32, SPARK_CSS = 9, GLINT_LEN = 110;

function resetSprites() {
  sprDpr = window.devicePixelRatio || 1;
  SPR_PX = Math.ceil(SPR_CSS * sprDpr);
  sprAtlas = document.createElement('canvas');
  sprAtlas.width = sprAtlas.height = SPR_COLS * SPR_PX;
  sprCtx = sprAtlas.getContext('2d');

}
function sandAtlas() {

}
function grainSprite(u32) {

  const sx = (idx % SPR_COLS) * SPR_PX, sy = ((idx / SPR_COLS) | 0) * SPR_PX;

  const grad = sprCtx.createRadialGradient(cx - rr * 0.3, cy - rr * 0.35, 0, cx, cy, rr);
  grad.addColorStop(0, `rgb(${hi(r)},${hi(g)},${hi(b)})`);
  grad.addColorStop(0.4, `rgb(${r},${g},${b})`);
  grad.addColorStop(0.82, `rgb(${lo(r)},${lo(g)},${lo(b)})`);
  grad.addColorStop(1, `rgba(${lo(r)},${lo(g)},${lo(b)},0)`);
  sprCtx.fillStyle = grad;
  sprCtx.beginPath(); sprCtx.arc(cx, cy, rr, 0, Math.PI * 2); sprCtx.fill();

}

  if (sparkCanvas) return sparkCanvas;
  const d = window.devicePixelRatio || 1, S = Math.ceil(SPARK_CSS * d), h = S / 2;
  sparkCanvas = document.createElement('canvas');
  sparkCanvas.width = sparkCanvas.height = S;
  const c = sparkCanvas.getContext('2d');
  const glow = c.createRadialGradient(h, h, 0, h, h, h * 0.55);
  glow.addColorStop(0, 'rgba(255,255,255,0.9)');
  glow.addColorStop(0.3, 'rgba(255,250,235,0.35)');
  glow.addColorStop(1, 'rgba(255,250,235,0)');

  // soft four-point star: two thin tapered beams
  c.translate(h, h);
  for (let k = 0; k < 2; k++) {
    const beam = c.createLinearGradient(-h, 0, h, 0);
    beam.addColorStop(0, 'rgba(255,255,255,0)');
    beam.addColorStop(0.5, 'rgba(255,255,255,0.95)');
    beam.addColorStop(1, 'rgba(255,255,255,0)');

    c.moveTo(-h, 0); c.quadraticCurveTo(0, -h * 0.07, h, 0); c.quadraticCurveTo(0, h * 0.07, -h, 0);

// ---------- cached layer for settled grains ----------
const TILE = 16;
let sandLayer = null, layerCtx = null, prevT = null, prevC = null, tileDirty = null, tilesX = 0, tilesY = 0, layerDpr = 0;

function ensureSandLayer() {
  const d = window.devicePixelRatio || 1;
  if (sandLayer && prevT && prevT.length === gType.length && layerDpr === d && sandLayer._c === gCols) return;
  layerDpr = d;
  sandLayer = document.createElement('canvas');
  sandLayer.width = Math.round(gCols * CELL * d);
  sandLayer.height = Math.round(gRows * CELL * d);
  sandLayer._c = gCols;
  layerCtx = sandLayer.getContext('2d');
  layerCtx.setTransform(d, 0, 0, d, 0, 0);
  layerCtx.imageSmoothingEnabled = true;
  prevT = new Uint8Array(gType.length).fill(255);
  prevC = new Uint32Array(gType.length);
  tilesX = Math.ceil(gCols / TILE); tilesY = Math.ceil(gRows / TILE);
  tileDirty = new Uint8Array(tilesX * tilesY);
}

function grainX(i, t) {
  const x = (i % gCols + 0.5) * CELL;
  return t === LOOSE ? x + ((gPhase[i] & 15) / 15 - 0.5) * 1.3 : x;
}
function grainY(i, t) {
  const y = ((i / gCols) | 0) * CELL + CELL * 0.5;
  return t === LOOSE ? y + (((gPhase[i] >> 4) & 15) / 15 - 0.5) * 1.1 : y;
}
function drawGrainOn(c, atlas, i, t, col) {
  const idx = grainSprite(col);
  // loose sand: sub-cell jitter and size variation so piles don't look like a grid; stamps stay crisp
  const dw = t === LOOSE ? SPR_CSS * (0.86 + ((gPhase[i] >> 8) & 3) * 0.08) : SPR_CSS;
  c.drawImage(atlas, (idx % SPR_COLS) * SPR_PX, ((idx / SPR_COLS) | 0) * SPR_PX, SPR_PX, SPR_PX,
    grainX(i, t) - dw / 2, grainY(i, t) - dw / 2, dw, dw);
}

// ========== BUBBLES ==========
function blowBubble(x, y) {
  const r = 25 + Math.random() * 40;
  bubbles.push({
    x, y, r,
    vx: (Math.random()-0.5)*2,
    vy: (Math.random()-0.5)*2,
    hue: Math.random()*360,
    k: Math.random()
  });
}

function findBubbleAt(x, y) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (Math.hypot(x - b.x, y - b.y) <= b.r) return b;
  }
  return null;
}

function startBubbleInteraction(x, y) {
  const hit = findBubbleAt(x, y);
  if (hit) {
    draggingBubble = hit;
    dragOffset.x = hit.x - x;
    dragOffset.y = hit.y - y;
    lastDrag.x = x; lastDrag.y = y;
    hit.vx = 0; hit.vy = 0;
  } else {
    blowBubble(x, y);
  }
}

function moveDraggedBubble(x, y) {
  if (!draggingBubble) return;
  if (!bubbles.includes(draggingBubble)) { draggingBubble = null; return; }
  draggingBubble.x = x + dragOffset.x;
  draggingBubble.y = y + dragOffset.y;
  draggingBubble.vx = (x - lastDrag.x) * 0.5;
  draggingBubble.vy = (y - lastDrag.y) * 0.5;
  lastDrag.x = x; lastDrag.y = y;
}

function jiggleBubbles() {
  for (let b of bubbles) {
    b.vx += (Math.random()-0.5)*4;
    b.vy += (Math.random()-0.5)*4;
  }
}

function updateBubbles() {
  for (let i = 0; i < bubbles.length; i++) {
    const b = bubbles[i];
    if (b !== draggingBubble) {
      b.x += b.vx;
      b.y += b.vy;
    }
    const keepB = clampN(1 - 0.02 * bubblesK(), 0.95, 0.995);
    b.vx *= keepB;
    b.vy *= keepB;
    
    // bounce walls
    if (b.x - b.r < 0 || b.x + b.r > width) b.vx *= -0.8;
    if (b.y - b.r < 0 || b.y + b.r > height) b.vy *= -0.8;
    b.x = Math.max(b.r, Math.min(width - b.r, b.x));
    b.y = Math.max(b.r, Math.min(height - b.r, b.y));
    
    // merge
    for (let j = i+1; j < bubbles.length; j++) {
      const o = bubbles[j];
      const dx = o.x - b.x;
      const dy = o.y - b.y;
      const dist = Math.hypot(dx, dy);
      if (dist < (b.r + o.r) * surfaceTension) {
        // merge into larger
        const newR = Math.sqrt(b.r*b.r + o.r*o.r);
        b.x = (b.x * b.r + o.x * o.r) / (b.r + o.r);
        b.y = (b.y * b.r + o.y * o.r) / (b.r + o.r);
        b.r = newR;
        b.vx = (b.vx + o.vx) / 2;
        b.vy = (b.vy + o.vy) / 2;
        if (o === draggingBubble) draggingBubble = b;
        bubbles.splice(j, 1);
        j--;
      }
    }
  }
}

function drawBubbles() {
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, width, height);
  
  const bubCols = tabColorList('bubbles');
  const bubSplit = followSplitting('bubbles');
  const bft = followTick();
  for (let b of bubbles) {
    let bdx = 0, fc = null;
    if (bubSplit) {
      // overlap: bubbles touching another bubble
      const touching = bubbles.some(o => o !== b && Math.hypot(o.x - b.x, o.y - b.y) < o.r + b.r + 6);
      const nb = bubCols.length;
      if (b.k === undefined) b.k = Math.random();
      const st = followStyle(tabRGB('bubbles', Math.floor(b.k * nb) / nb), touching, bft);
      fc = st.c; bdx = st.dx;
    }
    ctx.save();
    ctx.translate(bdx, 0);
    const g = ctx.createRadialGradient(b.x - b.r*0.3, b.y - b.r*0.3, 0, b.x, b.y, b.r);
    g.addColorStop(0, 'rgba(255,255,255,0.6)');
    if (bubCols) {
      if (b.k === undefined) b.k = Math.random();
      const nb = tabColorList('bubbles').length;
      const c = fc || tabRGB('bubbles', Math.floor(b.k * nb) / nb);
      g.addColorStop(0.3, rgbStr(c, 0.53));
      g.addColorStop(1, rgbStr(c, 0.13));
    } else {
      g.addColorStop(0.3, `hsla(${b.hue}, 60%, 50%, 0.53)`);
      g.addColorStop(1, `hsla(${b.hue}, 60%, 50%, 0.13)`);
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
}
